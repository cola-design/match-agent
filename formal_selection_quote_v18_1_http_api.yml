          \ ensure_ascii=False, separators=(',', ':'), allow_nan=False).encode('utf-8')\n    if len(raw) > _CONTEXT_MAX:\n        raise CapacityError('完整上下文超过本版5MB保护上限，请按柜号或回路分批')\n    if len(raw) <= _WIRE_MAX:\n        return raw.decode('utf-8')\n    result = _WIRE_PREFIX + _whash.sha256(raw).hexdigest() + ':' + _wb64.b64encode(_wgzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii')\n    if len(result.encode('utf-8')) > _WIRE_MAX:\n        raise CapacityError('上下文无损压缩后仍超过传递预算，请按柜号或回路分批；本次不生成不完整BOM')\n    return result\n\ndef plain_json(value):\n    return _wjson.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)\n\ndef check_array_budget(requirements):\n    if len(requirements) > _BATCH_MAX:\n        return '本次共%d项有效BOM需求，超过本版每次%d项的Excel模板容量。请按柜号或回路分批提交；全部需求仍保留在内部上下文，本次未执行部分选型。' % (len(requirements), _BATCH_MAX)\n    if len(plain_json(requirements).encode('utf-8')) > 140000:\n        return '本批需求及证据展开后超过140KB数组预算，请按柜号或回路分批。本次未执行部分选型。'\n    if any((len(plain_json(r).encode('utf-8'))\
          \ > 45000 for r in requirements)):\n        return '单项需求及证据超过45KB预算，请精简重复原文或将相关页单独提交；本次未静默截断证据。'\n    return ''\nimport json\nimport re\nALLOWED_ACTIONS = {'RESOLVE', 'EXCLUDE', 'PENDING', 'RETURN_MATERIAL', 'NEED_CLARIFICATION'}\nALLOWED_TOP = {'component_role', 'category_path', 'circuit_id', 'functional_position', 'quantity_per_cabinet', 'handling_mode'}\nALLOWED_MODES = {'PRODUCT_SELECTION', 'HUMAN_CONFIRM', 'BOM_DIRECT', 'BOM_REVIEW', 'SPACE_ONLY', 'EXCLUDED'}\nALLOWED_REQ = {'rated_voltage_v', 'rated_current_min_a', 'rated_current_a', 'pole_count', 'breaking_capacity_min_ka', 'leakage_required', 'leakage_current_ma', 'operation_mode', 'control_voltage', 'required_accessories', 'brand_constraints', 'installation_mode', 'continuous_operating_voltage_v', 'uc_v', 'trip_curve', 'tripping_curve'}\n\ndef clean(value):\n    return '' if value is None else str(value).strip()\n\ndef obj(value):\n    if isinstance(value, dict):\n        return value\n    if isinstance(value, str) and\
          \ value.strip().startswith(_WIRE_PREFIX):\n        return wire_loads(value)\n    text = clean(value)\n    text = re.sub('^```(?:json)?\\\\s*', '', text, flags=re.I)\n    text = re.sub('\\\\s*```$', '', text)\n    a, b = (text.find('{'), text.rfind('}'))\n    return json.loads(text[a:b + 1]) if a >= 0 and b > a else {}\n\ndef num__stage_1(value):\n    if value in (None, '') or isinstance(value, bool):\n        return None\n    try:\n        x = float(value)\n        return int(x) if x.is_integer() else x\n    except Exception:\n        return None\n\ndef issue_row(text, action, reason):\n    return '| %s | %s | %s |' % (clean(text).replace('|', '／'), action, clean(reason).replace('|', '／'))\n\ndef _original_main(base_payload_json: str, resolution_json: str) -> dict:\n    try:\n        base = obj(base_payload_json)\n        parsed = obj(resolution_json)\n        requirements = [dict(x) for x in base.get('component_requirements', []) if isinstance(x, dict)]\n        issues = [dict(x)\
          \ for x in base.get('issues', []) if isinstance(x, dict)]\n        if not requirements:\n            raise ValueError('原始选型请求没有需求明细')\n        if clean(parsed.get('form_type')) != 'CLARIFICATION_CONFIRMATION':\n            raise ValueError('AI未识别为问题确认表')\n    except Exception as exc:\n        return {'clarification_status': 'NEED_REVIEW', 'clarification_message': '问题确认解析失败：%s' % clean(exc), 'clarification_markdown': '', 'retrieval_requirements': [], 'retrieval_requirements_json': '[]', 'all_requirements_json': '[]', 'resolved_count': 0, 'pending_count': 1, 'excluded_count': 0}\n    req_map = {clean(x.get('request_id')): x for x in requirements if clean(x.get('request_id'))}\n    resolutions = [x for x in parsed.get('resolutions', []) if isinstance(x, dict)]\n    blocking_ids = {clean(x.get('request_id')) for x in issues if x.get('blocks_retrieval') and clean(x.get('request_id'))}\n    blocking_texts = [clean(x.get('message')) for x in issues if x.get('blocks_retrieval') and clean(x.get('message'))]\n\
          \    resolution_by_req = {}\n    unresolved_rows = []\n    resolved_count = pending_count = excluded_count = 0\n    for res in resolutions:\n        rid = clean(res.get('target_request_id'))\n        action = clean(res.get('action')).upper()\n        confidence = num(res.get('confidence')) or 0\n        reason = clean(res.get('reason'))\n        issue_text = clean(res.get('issue_text'))\n        if action not in ALLOWED_ACTIONS or confidence < 0.85:\n            action = 'NEED_CLARIFICATION'\n            reason = reason or '工程师意见不够明确或识别置信度不足'\n        if rid and rid in req_map:\n            resolution_by_req[rid] = action\n        if action in {'PENDING', 'RETURN_MATERIAL', 'NEED_CLARIFICATION'}:\n            is_blocking = rid in blocking_ids or any((t and issue_text and (t in issue_text or issue_text in t) for t in blocking_texts))\n            if is_blocking:\n                pending_count += 1\n                unresolved_rows.append((issue_text or rid or '未映射问题', action, reason\
          \ or '需要进一步确认'))\n            continue\n        if not rid or rid not in req_map:\n            pending_count += 1\n            unresolved_rows.append((issue_text or '未映射问题', 'NEED_CLARIFICATION', '未能映射到原需求，不能自动采用'))\n            continue\n        req = req_map[rid]\n        if action == 'EXCLUDE':\n            req['handling_mode'] = 'EXCLUDED'\n            req['retrieval_required'] = False\n            req['quantity_per_cabinet'] = 0\n            req['project_quantity'] = 0\n            req['quantity'] = 0\n            req['mapping_status'] = 'USER_CONFIRMED_EXCLUDED'\n            excluded_count += 1\n            continue\n        updates = res.get('updates') if isinstance(res.get('updates'), dict) else {}\n        for key in ALLOWED_TOP:\n            if key not in updates or updates.get(key) in (None, '', [], {}):\n                continue\n            if key == 'quantity_per_cabinet':\n                value = num(updates.get(key))\n                if value is not None and value\
