          \ in quantity_evidence_rows(rule.get(\\'evidence\\')):\\n        token = quantity_token(line)\\n        if model:\\n            key = quantity_token(model)\\n            if not key or token.count(key) != 1:\\n                continue\\n            tail = token.split(key, 1)[1]\\n        else:\\n            if not role or token.count(role) != 1:\\n                continue\\n            tail = token.split(role, 1)[1]\\n        if re.search(\\'项目总|订货总|合计|整批|总计|总数量|所有柜\\', token):\\n            continue\\n        if re.search(\\'至少|不小于|不少于|最多|不超过|每[套组包箱]|/套|/包\\', tail):\\n            continue\\n        hits = list(re.finditer(\\'(?<![\\\\\\\\d.])([0-9]+(?:\\\\\\\\.[0-9]+)?)\\\\\\\\s*(个|只|台|套|件|根|块|支|组|处|颗|米|m)(?![a-z0-9²])\\', tail))\\n        hit = re.search(\\'(?<![\\\\\\\\d.])([0-9]+(?:\\\\\\\\.[0-9]+)?)\\\\\\\\s*(个|只|台|套|件|根|块|支|组|处|颗|米|m)[。；;，,]?$\\', tail)\\n        if not hit or len(hits) != 1:\\n            continue\\n        source_unit = hit.group(2)\\n        declared_unit\
          \ = quantity_token(params.get(\\'unit\\'))\\n        unit_alias = {\\'米\\': \\'m\\'}\\n        if not declared_unit or unit_alias.get(source_unit, source_unit) != unit_alias.get(declared_unit, declared_unit):\\n            continue\\n        qty = quantity_number(hit.group(1))\\n        if qty is not None and qty not in result:\\n            result.append(qty)\\n    return result\\n\\ndef normalize_rule_quantities(protocol):\\n    protocol = copy.deepcopy(protocol)\\n    errors = protocol.setdefault(\\'_document_errors\\', [])\\n    audit = copy.deepcopy(protocol.get(\\'quantity_resolution_audit\\') or [])\\n    rules = protocol.get(\\'component_rules\\', [])\\n    for rule in rules if isinstance(rules, list) else []:\\n        if not isinstance(rule, dict):\\n            continue\\n        params = rule.get(\\'parameters\\')\\n        if not isinstance(params, dict):\\n            continue\\n        values = [params[k] for k in (\\'quantity_per_cabinet\\', \\'每柜数量\\', \\'单柜数量\\\
          ') if params.get(k) not in (None, \\'\\')]\\n        if not values:\\n            continue\\n        numbers = [quantity_number(v) for v in values]\\n        label = str(rule.get(\\'rule_id\\') or \\'\\') + \\' \\' + str(rule.get(\\'component_role\\') or \\'\\') + \\' \\' + str(params.get(\\'model\\') or \\'\\')\\n        if None in numbers or len(set(numbers)) != 1 or numbers[0] <= 0:\\n            problem = label + \\'：逐项每柜数量字段无效或相互矛盾，需核对原始行\\'\\n            if problem not in errors:\\n                errors.append(problem)\\n            continue\\n        structured = numbers[0]\\n        params[\\'quantity_per_cabinet\\'] = structured\\n        text_count = _quantity_text_count(rule, {})\\n        evidence = item_evidence_quantities(rule)\\n        if len(evidence) > 1 or (evidence and evidence[0] != structured):\\n            problem = label + \\'：模型逐项数量%s与已核验原文行数量%s不一致，需重新核对提取结果\\' % (structured, evidence)\\n            if problem not in errors:\\n                errors.append(problem)\\\
