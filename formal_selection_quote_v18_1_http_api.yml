    - data:
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport io as _wio\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_CONTEXT_MAX = 5000000\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_loads(value):\n    if isinstance(value, (dict, list)):\n        return value\n    text = str(value or '').strip()\n    if text.startswith(_WIRE_PREFIX):\n        digest, body = text[len(_WIRE_PREFIX):].split(':', 1)\n        compressed = _wb64.b64decode(body, validate=True)\n        with _wgzip.GzipFile(fileobj=_wio.BytesIO(compressed)) as stream:\n            raw = stream.read(_CONTEXT_MAX + 1)\n        if len(raw) > _CONTEXT_MAX:\n            raise CapacityError('完整上下文超过本版5MB解码保护上限，请按柜号或回路分批')\n        if _whash.sha256(raw).hexdigest() != digest:\n            raise ValueError('上下文校验失败，内容可能不完整')\n        return _wjson.loads(raw.decode('utf-8'))\n    return _wjson.loads(text)\nimport json\nimport re\n\ndef clean(value):\n    if value is None:\n        return\
          \ ''\n    if isinstance(value, list):\n        return ' '.join((clean(x) for x in value))\n    if isinstance(value, dict):\n        return ' '.join((clean(x) for x in value.values()))\n    return re.sub('\\\\s+', ' ', str(value)).strip()\n\ndef first_value(data, *keys):\n    for key in keys:\n        value = data.get(key)\n        if value not in (None, '', []):\n            return clean(value)\n    return ''\n\ndef main__v16_before_1(requirement: dict) -> dict:\n    item = requirement if isinstance(requirement, dict) else {}\n    req = item.get('requirements') if isinstance(item.get('requirements'), dict) else {}\n    model = clean(item.get('shown_model'))\n    if not model:\n        summary = clean(item.get('requirement_summary'))\n        m = re.search('\\\\b([A-Z]{2,}\\\\d[A-Z0-9_-]*(?:-\\\\d+[A-Z0-9_-]*)?)\\\\b', summary, re.I)\n        if m:\n            model = m.group(1)\n    role = clean(item.get('component_role'))\n    category = clean(item.get('category_path') or role)\n\
          \    pole = first_value(req, 'pole_count')\n    current = first_value(req, 'rated_current_a', 'rated_current_min_a')\n    curve = first_value(req, 'trip_curve', 'tripping_curve')\n    voltage = first_value(req, 'rated_voltage_v', 'voltage_v', 'uc_v')\n    capacity = first_value(req, 'breaking_capacity_min_ka')\n    imax = first_value(req, 'max_discharge_current_ka', 'imax_ka')\n    exact = []\n    if model:\n        exact.append(model)\n    if pole:\n        exact.append(pole)\n    if curve and current:\n        exact.append(curve + current)\n    elif current:\n        exact.append(current + 'A')\n    if voltage:\n        exact.append(voltage + 'V')\n    if imax:\n        exact.append('Imax' + imax + 'kA')\n    curve_current = (curve + ' ' + current + 'A').strip() if curve or current else ''\n    terms = [' '.join(exact), model, role, category, pole, curve_current, ('分断能力 ' + capacity + 'kA').strip() if capacity else '', ('最大放电电流 ' + imax + 'kA').strip() if imax else '']\n    unique\
          \ = []\n    for value in terms:\n        value = clean(value)\n        if value and value not in unique:\n            unique.append(value)\n    query = '；'.join(unique)[:240]\n    return {'retrieval_query': query or '物料编码 PRODUCT ' + role, 'requirement_json': json.dumps(item, ensure_ascii=False), 'request_id': clean(item.get('request_id')), 'scheme_group_id': clean(item.get('scheme_group_id')), 'component_role': role}\n_query_previous_main = main__v16_before_1\n\ndef main(requirement):\n    item = requirement\n    if isinstance(item, dict) and item.get('transport_schema') == 'requirement-envelope-v1':\n        restored = wire_loads(item.get('payload_json'))\n        if not isinstance(restored, dict) or restored.get('request_id') != item.get('request_id'):\n            raise ValueError('需求传递内容与关联编号不一致，停止该项检索')\n        item = restored\n    return _query_previous_main(item)\n"
