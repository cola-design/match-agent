          \                    requirement['cabinet_cable_entry_exit_source_text'] = project['cabinet_cable_entry_exit_source_text']\n        payload = preserve_cabinet_context(payload, drawing, protocol)\n        out = publish_checked_output(out, payload, issues)\n        return transport_requirement_arrays(out)\n    except CapacityError as exc:\n        return requirement_capacity_response(str(exc))\n\ndef quantity_number(value):\n    if isinstance(value, bool) or value in (None, ''):\n        return None\n    try:\n        number = float(value)\n    except (ValueError, TypeError, OverflowError):\n        return None\n    if not math.isfinite(number) or number < 0:\n        return None\n    return int(number) if number.is_integer() else number\n\ndef quantity_token(value):\n    return re.sub('\\\\s+', '', unicodedata.normalize('NFKC', str(value or ''))).casefold().replace('×', 'x')\n\ndef quantity_evidence_rows(value):\n    \"\"\"A model-authored quotation without source anchoring cannot\
          \ arbitrate.\"\"\"\n    out = []\n    if isinstance(value, list):\n        for entry in value:\n            out.extend(quantity_evidence_rows(entry))\n    elif isinstance(value, dict):\n        if value.get('source_verified') is True and value.get('document_hash') and value.get('chunk_id'):\n            for line in str(value.get('text') or '').replace('\\\\n', '\\n').splitlines():\n                if line.strip() and line.strip() not in out:\n                    out.append(line.strip())\n        for entry in value.get('sources', []) if isinstance(value.get('sources'), list) else []:\n            for line in quantity_evidence_rows(entry):\n                if line not in out:\n                    out.append(line)\n    return out\n\ndef item_evidence_quantities(rule):\n    \"\"\"Only unambiguous trailing quantities in the cited item's own row.\n\n    This is a consistency check, not a PDF table parser. Unrecognized layouts\n    produce no evidence and cannot silently resolve contradictory\
          \ fields.\n    \"\"\"\n    params = rule.get('parameters') if isinstance(rule.get('parameters'), dict) else {}\n    model = next((params[k] for k in ('model', 'required_model', 'specified_model', '型号', '规格型号') if params.get(k)), None)\n    role = quantity_token(rule.get('component_role'))\n    result = []\n    for line in quantity_evidence_rows(rule.get('evidence')):\n        token = quantity_token(line)\n        if model:\n            key = quantity_token(model)\n            if not key or token.count(key) != 1:\n                continue\n            tail = token.split(key, 1)[1]\n        else:\n            if not role or token.count(role) != 1:\n                continue\n            tail = token.split(role, 1)[1]\n        if re.search('项目总|订货总|合计|整批|总计|总数量|所有柜', token):\n            continue\n        if re.search('至少|不小于|不少于|最多|不超过|每[套组包箱]|/套|/包', tail):\n            continue\n        hits = list(re.finditer('(?<![\\\\d.])([0-9]+(?:\\\\.[0-9]+)?)\\\\s*(个|只|台|套|件|根|块|支|组|处|颗|米|m)(?![a-z0-9²])',\
          \ tail))\n        hit = re.search('(?<![\\\\d.])([0-9]+(?:\\\\.[0-9]+)?)\\\\s*(个|只|台|套|件|根|块|支|组|处|颗|米|m)[。；;，,]?$', tail)\n        if not hit or len(hits) != 1:\n            continue\n        source_unit = hit.group(2)\n        declared_unit = quantity_token(params.get('unit'))\n        unit_alias = {'米': 'm'}\n        if not declared_unit or unit_alias.get(source_unit, source_unit) != unit_alias.get(declared_unit, declared_unit):\n            continue\n        qty = quantity_number(hit.group(1))\n        if qty is not None and qty not in result:\n            result.append(qty)\n    return result\n\ndef normalize_rule_quantities(protocol):\n    protocol = copy.deepcopy(protocol)\n    errors = protocol.setdefault('_document_errors', [])\n    audit = copy.deepcopy(protocol.get('quantity_resolution_audit') or [])\n    rules = protocol.get('component_rules', [])\n    for rule in rules if isinstance(rules, list) else []:\n        if not isinstance(rule, dict):\n            continue\n\
          \        params = rule.get('parameters')\n        if not isinstance(params, dict):\n            continue\n        values = [params[k] for k in ('quantity_per_cabinet', '每柜数量', '单柜数量') if params.get(k) not in (None, '')]\n        if not values:\n            continue\n        numbers = [quantity_number(v) for v in values]\n        label = str(rule.get('rule_id') or '') + ' ' + str(rule.get('component_role') or '') + ' ' + str(params.get('model') or '')\n        if None in numbers or len(set(numbers)) != 1 or numbers[0] <= 0:\n            problem = label + '：逐项每柜数量字段无效或相互矛盾，需核对原始行'\n            if problem not in errors:\n                errors.append(problem)\n            continue\n        structured = numbers[0]\n        params['quantity_per_cabinet'] = structured\n        text_count = _quantity_text_count(rule, {})\n        evidence = item_evidence_quantities(rule)\n        if len(evidence) > 1 or (evidence and evidence[0] != structured):\n            problem = label + '：模型逐项数量%s与已核验原文行数量%s不一致，需重新核对提取结果'\
          \ % (structured, evidence)\n            if problem not in errors:\n                errors.append(problem)\n            continue\n        if text_count is None or text_count == structured:\n            continue\n        if evidence == [structured]:\n            record = {'rule_id': rule.get('rule_id'), 'original_quantity_rule': rule.get('quantity_rule'), 'structured_quantity': structured, 'text_quantity': text_count, 'evidence_quantities': evidence, 'resolution': 'VERIFIED_ITEM_ROW_OVER_UNSUPPORTED_QUANTITY_TEXT'}\n            if record not in audit:\n                audit.append(record)\n            rule['quantity_rule'] = '每柜%s%s' % (structured, str(params.get('unit') or '件'))\n            rule['quantity_resolution'] = copy.deepcopy(record)\n        else:\n            problem = label + '：逐项数量%s与数量规则%s不一致，缺少足够的本行原文依据，不能自动放行' % (structured, text_count)\n            if problem not in errors:\n                errors.append(problem)\n    if audit:\n        protocol['quantity_resolution_audit']\
          \ = audit\n    return protocol\n\ndef quantity_from_rule(rule, group):\n    params = rule.get('parameters') if isinstance(rule.get('parameters'), dict) else {}\n    if params.get('quantity_per_cabinet') not in (None, ''):\n        return quantity_number(params['quantity_per_cabinet'])\n    return _quantity_text_count(rule, group)\nimport hashlib\n\ndef contract_rows(value):\n    return value if isinstance(value, list) else []\n\ndef fact_text(value):\n    return unicodedata.normalize('NFKC', str(value or '')).replace('\\r', '')\n\ndef fact_key(value):\n    return re.sub('\\\\s+', '', fact_text(value)).casefold().replace('×', 'x')\n\ndef evidence_leaves(value):\n    out = []\n    if isinstance(value, list):\n        for child in value:\n            out.extend(evidence_leaves(child))\n    elif isinstance(value, dict):\n        if value.get('text'):\n            out.append({k: copy.deepcopy(value[k]) for k in ('text', 'document_hash', 'chunk_id', 'source_verified', 'source_start',\
          \ 'source_end', 'source_spans', 'page_index', 'location') if k in value})\n        else:\n            for child in value.values():\n                if isinstance(child, (dict, list)):\n                    out.extend(evidence_leaves(child))\n        for child in value.get('sources', []) if isinstance(value.get('sources'), list) else []:\n            out.extend(evidence_leaves(child))\n    unique = []\n    seen = set()\n    for row in out:\n        key = json.dumps(row, ensure_ascii=False, sort_keys=True)\n        if key not in seen:\n            seen.add(key)\n            unique.append(row)\n    return unique\n\ndef is_anchored(ev):\n    return ev.get('source_verified') is True and bool(ev.get('document_hash')) and bool(ev.get('chunk_id'))\n\ndef source_rows(evidence, raw_text=''):\n    \"\"\"Expand a verified citation only to its own source line, never a document scan.\"\"\"\n    raw = str(raw_text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    digest = hashlib.sha256(raw.encode()).hexdigest()\
          \ if raw else ''\n    rows = []\n    for ev in evidence_leaves(evidence):\n        if not is_anchored(ev):\n            continue\n        for line in str(ev['text']).replace('\\\\n', '\\n').splitlines():\n            if line.strip():\n                rows.append((line.strip(), ev))\n        spans = ev.get('source_spans') or ([[ev['source_start'], ev['source_end']]] if isinstance(ev.get('source_start'), int) and isinstance(ev.get('source_end'), int) else [])\n        if raw and digest == ev.get('document_hash'):\n            for span in spans:\n                if not isinstance(span, (list, tuple)) or len(span) != 2:\n                    continue\n                start, end = span\n                if not isinstance(start, int) or not isinstance(end, int) or (not 0 <= start < end <= len(raw)):\n                    continue\n                if '\\n' in raw[start:end]:\n                    continue\n                a = raw.rfind('\\n', 0, start) + 1\n                b = raw.find('\\\
          n', end)\n                if b < 0:\n                    b = len(raw)\n                row = raw[a:b].strip()\n                expanded = dict(ev, text=row, source_start=a, source_end=b, source_spans=[[a, b]])\n                if row:\n                    rows.append((row, expanded))\n    return rows\n\ndef item_source_clause(line, model, symbol, role):\n    \"\"\"Select a clause with an explicit item identity; same-model peers stay separate.\"\"\"\n    text = fact_text(line)\n    model = fact_text(model).strip()\n    symbol = fact_text(symbol).strip()\n    clauses = re.split('[;；\\\\n]', text)\n    selected = []\n    for clause in clauses:\n        if re.search('例如|示例|举例|推荐示意|可选型号', clause):\n            continue\n        if model and fact_key(model) not in fact_key(clause):\n            continue\n        if not model:\n            if not symbol or not re.search('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I):\n                continue\n         \
          \   if role and fact_key(role) not in fact_key(clause):\n                continue\n        if model and fact_key(clause).count(fact_key(model)) > 1:\n            if not symbol:\n                continue\n            hits = list(re.finditer('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I))\n            if len(hits) != 1:\n                continue\n            tail = clause[hits[0].start():]\n            next_position = re.search('\\\\s+[A-Za-z][A-Za-z0-9_-]*\\\\s*[=:：]', tail[len(symbol):])\n            clause = tail[:len(symbol) + next_position.start()] if next_position else tail\n            if fact_key(clause).count(fact_key(model)) != 1:\n                continue\n        if symbol:\n            label = re.match('\\\\s*([A-Za-z][A-Za-z0-9_-]*)\\\\s*[=:：]', clause)\n            if label and label.group(1).casefold() != symbol.casefold():\n                continue\n        clause = re.sub('(?:不允许|不得|禁止|不能|不采用|不选用|不使用|排除|不含)[^;；。\\\\n,，]*', '', clause)\n\
          \        if clause.strip():\n            selected.append(clause.strip())\n    return selected\n\ndef explicit_item_facts(clause, role=''):\n    \"\"\"Small, transparent grammar; unrecognized prose remains in source evidence.\"\"\"\n    text = fact_text(clause)\n    facts = []\n\n    def put(field, value):\n        if isinstance(value, float) and value.is_integer():\n            value = int(value)\n        pair = (field, value)\n        if pair not in facts:\n            facts.append(pair)\n    if '断路器' in str(role) or 'MCB' in str(role).upper():\n        for m in re.finditer('(?<![A-Z0-9])([BCD])\\\\s*(\\\\d{1,3})(?:\\\\s*A)?(?![A-Z0-9])', text, re.I):\n            put('trip_curve', m.group(1).upper())\n            put('rated_current_a', int(m.group(2)))\n        for m in re.finditer('(?:脱扣(?:特性|曲线)\\\\s*[:：=为]?\\\\s*([BCD])|(?<![A-Z0-9])([BCD])\\\\s*型脱扣)', text, re.I):\n            put('trip_curve', next((x for x in m.groups() if x)).upper())\n    for m in re.finditer('(?<![A-Za-z0-9])([1-5])\\\
          \\s*P\\\\s*(\\\\+\\\\s*N)?(?![A-Za-z0-9])', text, re.I):\n        put('pole_count', m.group(1) + 'P' + ('+N' if m.group(2) else ''))\n    patterns = [('continuous_operating_voltage_v', '(?:\\\\bUc|最大持续(?:工作|运行)电压)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\\b'), ('max_discharge_current_ka', '(?:\\\\bImax|最大放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA|A)\\\\b'), ('nominal_discharge_current_ka', '(?:\\\\bIn|标称放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\b'), ('breaking_capacity_ka', '(?:分断能力|\\\\bIcn|\\\\bIcu)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\b'), ('rated_current_a', '额定电流\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(A)\\\\b'), ('rated_voltage_v', '额定(?:工作)?电压\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\\b'), ('control_voltage', '(?:线圈电压|控制电压)\\\\s*[:：=为]?\\\\s*((?:AC|DC)\\\\s*\\\\d+(?:\\\\.\\\\d+)?\\\\s*V)\\\\b')]\n    for field, pattern in patterns:\n        for m in re.finditer(pattern, text, re.I):\n\
          \            if field == 'control_voltage':\n                put(field, re.sub('\\\\s+', '', m.group(1)).upper())\n                continue\n            number = float(m.group(1))\n            unit = m.group(2).lower()\n            if field.endswith('_v') and unit == 'kv':\n                number *= 1000\n            if field.endswith('_ka') and unit == 'a':\n                number /= 1000\n            put(field, number)\n    return facts\n\ndef normalize_fact_value(field, value):\n    if field in ('trip_curve', 'pole_count', 'control_voltage'):\n        return re.sub('\\\\s+', '', fact_text(value)).upper()\n    if isinstance(value, bool):\n        return ('invalid', str(value))\n    m = re.fullmatch('\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V|kA|A)?\\\\s*', str(value), re.I)\n    if not m:\n        return ('text', fact_key(value))\n    number = float(m.group(1))\n    unit = (m.group(2) or '').lower()\n    if field.endswith('_v') and unit == 'kv':\n        number *= 1000\n    elif\
          \ field.endswith('_ka') and unit == 'a':\n        number /= 1000\n    elif unit and unit not in (('v', 'kv') if field.endswith('_v') else ('a', 'ka')):\n        return ('invalid', str(value))\n    return number\n\ndef recover_item_facts(item, parameter_key, raw_text='', extra_evidence=None):\n    params = item.setdefault(parameter_key, {})\n    if not isinstance(params, dict):\n        return ['物料参数不是对象，无法核对来源']\n    model = item.get('shown_model') or next((params[k] for k in ('model', 'required_model', 'designated_model', 'specified_model') if params.get(k)), '')\n    symbol = item.get('symbol') or params.get('bit_number') or params.get('symbol') or ''\n    role = str(item.get('component_role') or item.get('category') or '')\n    ledger = list(item.get('parameter_facts') or [])\n    values = {}\n    errors = []\n    evidence = [item.get('evidence'), extra_evidence]\n    for line, ev in source_rows(evidence, raw_text):\n        for clause in item_source_clause(line, model, symbol,\
          \ role):\n            for field, value in explicit_item_facts(clause, role):\n                proof = {k: copy.deepcopy(ev[k]) for k in ('document_hash', 'chunk_id', 'source_verified', 'source_start', 'source_end', 'source_spans', 'page_index', 'location') if k in ev}\n                fact = {'field': field, 'value': value, 'source_text': clause, 'source': proof}\n                if fact not in ledger:\n                    ledger.append(fact)\n                values.setdefault(field, [])\n                if value not in values[field]:\n                    values[field].append(value)\n    for field, found in values.items():\n        if len({str(normalize_fact_value(field, v)) for v in found}) != 1:\n            errors.append('当前物料原文的' + field + '存在不同值：' + str(found))\n            continue\n        value = found[0]\n        if params.get(field) in (None, '', [], {}):\n            params[field] = value\n        elif normalize_fact_value(field, params[field]) != normalize_fact_value(field,\
          \ value):\n            errors.append('模型参数' + field + '=' + str(params[field]) + '与当前物料原文' + str(value) + '不一致')\n    if ledger:\n        item['parameter_facts'] = ledger\n    return errors\n\ndef preserve_document_facts(document, kind, raw_text=''):\n    if not isinstance(document, dict):\n        return {'scheme_groups': [], '_document_errors': ['提取结果不是JSON对象，不能作为工程资料']}\n    document = copy.deepcopy(document)\n    errors = document.setdefault('_document_errors', [])\n    if not isinstance(errors, list):\n        errors = ['来源错误列表格式异常，需检查提取结果']\n        document['_document_errors'] = errors\n\n    def finite(value, path):\n        if isinstance(value, float) and (not math.isfinite(value)):\n            message = '来源字段含非有限数值：' + path\n            if message not in errors:\n                errors.append(message)\n            return str(value)\n        if isinstance(value, dict):\n            return {key: finite(child, path + '.' + str(key)) for key, child in value.items()}\n  \
          \      if isinstance(value, list):\n            return [finite(child, path + '[' + str(index) + ']') for index, child in enumerate(value)]\n        return value\n    document = finite(document, kind)\n    document['_document_errors'] = errors\n    if kind == 'PROTOCOL':\n        for rule in document.get('component_rules', []) if isinstance(document.get('component_rules'), list) else []:\n            if not isinstance(rule, dict):\n                continue\n            for error in recover_item_facts(rule, 'parameters', raw_text):\n                message = str(rule.get('rule_id') or '') + ' ' + str(rule.get('component_role') or '') + '：' + error\n                if message not in errors:\n                    errors.append(message)\n    else:\n        for group in document.get('scheme_groups', []) if isinstance(document.get('scheme_groups'), list) else []:\n            if not isinstance(group, dict):\n                continue\n            seen = set()\n            for circuit in\
          \ group.get('circuits', []) if isinstance(group.get('circuits'), list) else []:\n                if not isinstance(circuit, dict):\n                    continue\n                for item in circuit.get('components', []) if isinstance(circuit.get('components'), list) else []:\n                    if not isinstance(item, dict):\n                        continue\n                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text, circuit.get('evidence')):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n            for key in ('drawing_items', 'shown_bom', 'auxiliary_materials', 'wire_requirements'):\n                for item in group.get(key, []) if isinstance(group.get(key), list) else []:\n                    if not isinstance(item, dict) or id(item) in seen:\n                        continue\n\
          \                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n    return document\n\ndef preserve_cabinet_context(payload, drawing, protocol):\n    groups = {g.get('scheme_group_id'): g for g in contract_rows(drawing.get('scheme_groups')) if isinstance(g, dict)}\n    project = protocol.get('project_requirements') or {}\n    if not isinstance(project, dict):\n        project = {}\n    for row in contract_rows(payload.get('component_requirements')):\n        role = str(row.get('component_role') or '') + ' ' + str(row.get('category_path') or '')\n        if not any((word in role for word in ('柜体', '箱体'))):\n            continue\n        group = groups.get(row.get('scheme_group_id'), {})\n        params = row.setdefault('requirements',\
          \ {})\n        for target, names in {'material': ('cabinet_material',), 'thickness_mm': ('cabinet_thickness_mm',), 'color': ('cabinet_color', 'color')}.items():\n            value = next((source[k] for source in (group, project) for k in names if source.get(k) not in (None, '', [], {})), None)\n            if value is not None and params.get(target) in (None, '', [], {}):\n                params[target] = copy.deepcopy(value)\n    return payload\n\ndef requirement_capacity_response(message):\n    payload = {'capacity_blocked': True, 'capacity_message': message, 'component_requirements': [], 'issues': []}\n    return {'pricing_gate': 'BLOCKED_CAPACITY', 'request_summary': message, 'requirement_count': 0, 'requirement_review_filename': '容量超限_请按柜号分批', 'requirement_review_markdown': capacity_markdown(message), 'requirements': [], 'requirements_json': '[]', 'retrieval_count': 0, 'retrieval_requirements': [], 'retrieval_requirements_json': '[]', 'selection_request_json': plain_json(payload),\
          \ 'validation_message': message, 'validation_status': 'NEED_REVIEW'}\n"
