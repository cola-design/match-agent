        desc: 通用文本分段、完整性和来源校验；不包含临时物料或固定回路。
        code_language: python3
        code: "import hashlib\nimport json\nCHUNK_CHARS = 10000\nOVERLAP_CHARS = 500\nMAX_CHUNKS = 40\n\ndef jdump(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)\n\ndef document_chunks(text, kind):\n    raw = str(text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    digest = hashlib.sha256(raw.encode()).hexdigest()\n    chunks = []\n    start = 0\n    problem = ''\n    if not raw.strip():\n        problem = '未提取到可读文字；可能是扫描PDF、图形文字或文件损坏，需OCR/视觉处理后重试'\n    while start < len(raw) and len(chunks) < MAX_CHUNKS:\n        end = min(start + CHUNK_CHARS, len(raw))\n        if end < len(raw):\n            boundary = raw.rfind('\\n', start + CHUNK_CHARS // 2, end)\n            if boundary > start:\n                end = boundary + 1\n        chunks.append({'chunk_id': '%s-%03d' % (kind, len(chunks) + 1), 'document_hash': digest, 'start': start, 'end': end, 'text': raw[start:end]})\n        if end == len(raw):\n            break\n        start\
          \ = end - OVERLAP_CHARS\n    if chunks and chunks[-1]['end'] != len(raw):\n        problem = '资料超过本版40段文本处理预算；本次不处理前半份资料，请按项目或柜号拆分后提交'\n        chunks = []\n    if not chunks:\n        chunks = [{'chunk_id': kind + '-001', 'document_hash': digest, 'start': 0, 'end': 0, 'text': '', 'input_problem': problem}]\n    manifest = {'kind': kind, 'document_hash': digest, 'character_count': len(raw), 'input_problem': problem, 'chunks': [{k: v for k, v in c.items() if k != 'text'} for c in chunks]}\n    return {'chunks': [jdump(c) for c in chunks], 'manifest': jdump(manifest), 'chunk_count': len(chunks)}\n\ndef main(text):\n    return document_chunks(text, 'DRAWING')\n"
