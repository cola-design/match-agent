      data:
        type: code
        title: 逐条核验补充摘录并锁定工程事实
        desc: 只核查原文证据；不改型号、参数、数量或业务范围。
        selected: false
        code_language: python3
        code: "\"\"\"Exact citations plus one bounded model-assisted repair, never fact repair.\"\"\"\nimport copy\nimport json\nimport re\nimport unicodedata\n\n\ndef source_norm(value):\n    return re.sub(r'\\s+', '', ''.join(unicodedata.normalize('NFKC', c) for c in str(value or '')))\n\n\ndef citation_leaves(value):\n    if isinstance(value, list):\n        for child in value:\n            yield from citation_leaves(child)\n    elif isinstance(value, dict):\n        if str(value.get('text') or '').strip():\n            yield {k: copy.deepcopy(v) for k, v in value.items() if k != 'sources'}\n        if isinstance(value.get('sources'), list):\n            for child in value['sources']:\n                yield from citation_leaves(child)\n\n\ndef exact_citations(value, chunk):\n    \"\"\"Return only quotes actually present in this exact, current chunk.\"\"\"\n    text = chunk['text']\n    hay = source_norm(text)\n    index = []\n    for i, char in enumerate(text):\n        index.extend(i\
          \ for c in unicodedata.normalize('NFKC', char) if not c.isspace())\n    valid, rejected, seen = [], [], set()\n    for leaf in citation_leaves(value):\n        needle = source_norm(leaf['text'])\n        if not needle or needle not in hay:\n            rejected.append(leaf['text'])\n            continue\n        if needle in seen:\n            continue\n        seen.add(needle)\n        spans = [[chunk['start'] + index[h.start()], chunk['start'] + index[h.end()-1]+1]\n                 for h in re.finditer(re.escape(needle), hay)]\n        anchored = dict(leaf, chunk_id=chunk['chunk_id'], document_hash=chunk['document_hash'],\n                        source_verified=True, chunk_start=chunk['start'], chunk_end=chunk['end'],\n                        source_spans=spans, page_index=None)\n        anchored.pop('source_start', None)\n        anchored.pop('source_end', None)\n        if len(spans) == 1:\n            anchored.update(source_start=spans[0][0], source_end=spans[0][1])\n  \
          \      valid.append(anchored)\n    return valid, rejected\n\n\ndef anchor_evidence(value, chunk, errors):\n    valid, rejected = exact_citations(value, chunk)\n    if not valid:\n        if not list(citation_leaves(value)):\n            return {}\n        example = next((str(x.get('text')) for x in citation_leaves(value)), '')\n        errors.append(chunk['chunk_id']+'：来源原文未在当前文本段找到，不能用模型生成的原文作证据'\n                      + ('；未定位摘录：'+example if example else '；未返回原文摘录'))\n        return {}\n    first = copy.deepcopy(valid[0])\n    if len(valid) > 1:\n        first['sources'] = copy.deepcopy(valid)\n    if rejected:\n        # A model's prose summary is not promoted to source evidence. Preserve\n        # it for diagnosis while anchoring the independently valid quotations.\n        first['unmatched_summary_texts'] = rejected\n    return first\n\n\ndef json_pointer_part(value):\n    return str(value).replace('~', '~0').replace('/', '~1')\n\n\ndef pointer_parent(root, pointer):\n  \
          \  if not isinstance(pointer, str) or not pointer.startswith('/'):\n        raise ValueError('证据路径无效')\n    parts = [p.replace('~1', '/').replace('~0', '~') for p in pointer[1:].split('/')]\n    target = root\n    for p in parts[:-1]:\n        target = target[int(p)] if isinstance(target, list) else target[p]\n    return target, parts[-1]\n\n\ndef missing_citations(body, chunk):\n    tasks = []\n    def walk(value, pointer=''):\n        if isinstance(value, list):\n            for i, child in enumerate(value):\n                walk(child, pointer+'/'+str(i))\n        elif isinstance(value, dict):\n            entity = (('scheme_group_id' in value or 'protocol_scheme_id' in value)\n                      and ('scheme_name' in value or 'circuits' in value))\n            entity = entity or ('components' in value and 'circuit_id' in value)\n            entity = entity or ('component_role' in value and any(k in value for k in ('item_id','rule_id','shown_model','parameters')))\n     \
          \       has_facts=any(v not in (None,'',[],{}) for k,v in value.items() if k!='evidence' and not k.startswith('_'))\n            if entity or ('evidence' in value and (value['evidence'] or has_facts)):\n                valid, rejected = exact_citations(value.get('evidence'), chunk)\n                if not valid:\n                    context = {k:copy.deepcopy(v) for k,v in value.items()\n                               if k!='evidence' and (not isinstance(v,(list,dict)) or k in ('shown_parameters','parameters'))}\n                    tasks.append({'path':pointer+'/evidence','context':context,\n                                  'unmatched_quotes':rejected,'reason':'未找到当前对象可核查的原文摘录'})\n            for key, child in value.items():\n                if key != 'evidence' and not key.startswith('_'):\n                    walk(child, pointer+'/'+json_pointer_part(key))\n    walk(body)\n    return tasks\n\n\ndef prepare_source_repair(result_json, chunk_json):\n    body = json.loads(result_json)\n\
          \    chunk = json.loads(chunk_json) if isinstance(chunk_json,str) else chunk_json\n    tasks = [] if body.get('_binding_error') or chunk.get('input_problem') else missing_citations(body,chunk)\n    status = 'REPAIR' if tasks else 'DIRECT'\n    request = json.dumps({'source_chunk':chunk,'citation_tasks':tasks},ensure_ascii=False,separators=(',',':')) if tasks else '{}'\n    if len(request.encode('utf-8')) > 50000:\n        body['_binding_error']='本段原文与待修复证据超过50KB输入预算，请拆分资料；本次不使用截断原文'\n        result_json=json.dumps(body,ensure_ascii=False,separators=(',',':'))\n        status='DIRECT';request='{}'\n    return {'result_json':result_json,'evidence_check_status':status,'repair_input':request}\n\n\ndef facts_without_evidence(value):\n    if isinstance(value,list):return [facts_without_evidence(v) for v in value]\n    if isinstance(value,dict):\n        return {k:facts_without_evidence(v) for k,v in value.items() if k!='evidence' and not k.startswith('_')}\n    return value\n\n\ndef\
          \ identity_in_quotes(token, quotes):\n    token=unicodedata.normalize('NFKC',str(token)).strip()\n    hay=unicodedata.normalize('NFKC','\\n'.join(quotes))\n    if re.fullmatch(r'[A-Za-z0-9_.:/\\-]+',token):\n        return bool(re.search(r'(?<![A-Za-z0-9])'+re.escape(token)+r'(?![A-Za-z0-9])',hay,re.I))\n    return source_norm(token).casefold() in source_norm(hay).casefold()\n\n\ndef apply_source_repair(input_json, original_result_json, repair_text):\n    body = json.loads(original_result_json)\n    chunk = json.loads(input_json) if isinstance(input_json,str) else input_json\n    original_facts = facts_without_evidence(body)\n    try:\n        if body.get('chunk_id') != chunk['chunk_id'] or body.get('document_hash') != chunk['document_hash']:\n            raise ValueError('证据修复关联了其他文档或文本段')\n        tasks = missing_citations(body,chunk)\n        expected = {t['path'] for t in tasks}\n        contexts={t['path']:t['context'] for t in tasks}\n        text = re.sub(r'^```(?:json)?\\\
          s*|\\s*```$', '', str(repair_text or '').strip(), flags=re.I)\n        repair=json.loads(text)\n        if not isinstance(repair,dict) or set(repair)!={'citations'} or not isinstance(repair['citations'],list):\n            raise ValueError('修复模型必须仅返回citations数组，不得返回或修改工程事实')\n        found={}\n        for row in repair['citations']:\n            if not isinstance(row,dict) or set(row)!={'path','quotes'}:\n                raise ValueError('修复项只能包含证据路径和原文摘录')\n            path=row['path']\n            if path not in expected or path in found:\n                raise ValueError('修复项证据路径无效、重复或越过原请求范围')\n            quotes=row['quotes']\n            if not isinstance(quotes,list) or not 1<=len(quotes)<=6 or not all(isinstance(q,str) and q.strip() for q in quotes):\n                raise ValueError('当前对象仍缺少可核查原文摘录')\n            value=[{'text':q,'page_index':None,'location':'本段原文重新摘录'} for q in quotes]\n            anchored,rejected=exact_citations(value,chunk)\n            if rejected\
          \ or len(anchored)!=len({source_norm(q) for q in quotes}):\n                raise ValueError('补充摘录仍未逐字命中当前原文，不能放行')\n            context=contexts[path];parameters=context.get('parameters') or {}\n            if not isinstance(parameters,dict):parameters={}\n            identities=[context.get('shown_model'),context.get('symbol'),parameters.get('bit_number'),\n                        parameters.get('model'),parameters.get('designated_model')]\n            key=context.get('source_scheme_key')\n            if key and key!='__PROJECT__':identities.append(key)\n            if any(not identity_in_quotes(token,quotes) for token in identities if token not in (None,'')):\n                raise ValueError('补充原文未包含当前对象的位号、指定型号或方案标识，不能借用其他对象证据')\n            found[path]=value[0] if len(value)==1 else dict(value[0],sources=value)\n        if set(found)!=expected:\n            raise ValueError('修复模型遗漏了待核对对象，不能只处理部分证据')\n        result=copy.deepcopy(body)\n        for pointer,value in found.items():\n\
          \            parent,key=pointer_parent(result,pointer)\n            if not isinstance(parent,dict) or key!='evidence':\n                raise ValueError('修复只能写入对象的evidence字段')\n            parent[key]=value\n        if facts_without_evidence(result)!=original_facts or missing_citations(result,chunk):\n            raise ValueError('工程事实发生变化或仍存在未定位证据')\n        result['_source_repair']={'status':'EXACT_QUOTES_VERIFIED','attempts':1,'paths':sorted(found)}\n        return {'result_json':json.dumps(result,ensure_ascii=False,separators=(',',':'))}\n    except (ValueError,TypeError,KeyError,IndexError) as exc:\n        body['_binding_error']='原文证据自动补充一次后仍未通过：'+str(exc)\n        body['_source_repair_failure']={'attempts':1,'message':str(exc)}\n        return {'result_json':json.dumps(body,ensure_ascii=False,separators=(',',':'))}\n\n\ndef main(input_json, original_result_json, repair_text):\n    return apply_source_repair(input_json,original_result_json,repair_text)\n"
