    - data:
        code: "import json\nimport re\nfrom datetime import date, datetime\nfrom decimal import Decimal, InvalidOperation\n\ndef clean(v):\n    return '' if v is None else str(v).replace('\\u200b', '').replace('\\ufeff', '').strip()\n\ndef norm(v):\n    return re.sub('[^A-Z0-9]', '', clean(v).upper().replace('×', 'X').replace('²', '2'))\n\ndef stop(result, status, message):\n    result.update(item_status=status, issue=message)\n\ndef dec(v):\n    try:\n        d = Decimal(clean(v).replace('￥', '').replace('¥', '').replace(',', '').replace('%', ''))\n        return d if d.is_finite() else None\n    except (ValueError, InvalidOperation):\n        return None\n\ndef count_unit_ok(bom_unit, price_unit, cat):\n    if bom_unit == price_unit:\n        return (True, '')\n    single = {'小型断路器', '小型隔离开关', 'SPD后备保护器', '电涌保护器', '表位支架', '接地排', '铜铝接线鼻', '电缆防水接头', '紧固件', '浪涌保护器', '防雷后备保护器'}\n    if cat in single and bom_unit in ('台', '件', '只', '个') and (price_unit in ('台', '件', '只', '个')):\n        return\
          \ (True, '单件计数单位换算（需人工核实）：' + bom_unit + '→' + price_unit)\n    if cat == '柜体箱体' and bom_unit == '台' and (price_unit == '套'):\n        return (True, '一台柜体按一套计价，须人工核实')\n    return (False, '')\n\ndef check_category(item, product):\n    name = clean(item.get('material_name'))\n    cat = clean(product.get('产品类别'))\n    expected = (('SPD后备保护器', ('SPD后备保护器', '防雷后备保护器')), ('后备保护器', ('SPD后备保护器', '防雷后备保护器')), ('电涌保护器', ('电涌保护器', '浪涌保护器')), ('浪涌保护器', ('电涌保护器', '浪涌保护器')), ('小型断路器', '小型断路器'), ('小型隔离开关', '小型隔离开关'), ('隔离开关', ('隔离开关', '小型隔离开关')), ('表位支架', '表位支架'), ('接线鼻', '铜铝接线鼻'), ('防水接头', '电缆防水接头'), ('接地排', '接地排'), ('膨胀螺栓', '紧固件'), ('膨胀螺丝', '紧固件'), ('柜体', '柜体箱体'))\n    for keyword, category in expected:\n        if keyword in name and cat not in (category if isinstance(category, tuple) else (category,)):\n            return 'BOM元器件类别与产品库类别不一致：' + name + ' → ' + cat\n    return ''\n\ndef check_model(model, product):\n    \"\"\"Only explicit model information can be verified; no semantic substitution.\"\
          \"\"\n    description = clean(product['物料描述'])\n    expected = clean(model)\n    if not expected:\n        return '确认型号为空'\n    tokens = re.findall('[A-Za-z]+[A-Za-z0-9]*[\\\\-_/×x]?[A-Za-z0-9]+(?:[\\\\-_/×x][A-Za-z0-9]+)*', expected)\n    for token in tokens:\n        nt = norm(token)\n        if len(nt) >= 4 and nt not in norm(description):\n            return '确认型号片段与产品描述不一致：' + token\n    if re.fullmatch('\\\\d{2,4}', expected):\n        if not re.search('(?<!\\\\d)' + re.escape(expected) + '(?!\\\\d)', description):\n            return '纯数字规格代号与产品描述不一致：' + expected\n    if re.search('\\\\b[1-4]P\\\\b', expected, re.I):\n        exp = re.search('\\\\b([1-4])P\\\\b', expected, re.I).group(1)\n        poles = re.search('极数\\\\s*=\\\\s*([1-4])P', clean(product['规格参数']), re.I)\n        if poles and poles.group(1) != exp:\n            return '确认型号极数与产品规格不一致'\n    return ''\n\ndef evaluate_system_voltage(spec, product):\n    \"\"\"Return (action, note). REVIEW denotes no verified\
          \ voltage rating.\n\n    This workflow uses ACTIVE records from the formal price library; REVIEW is preserved\n    in line remarks and summary. Explicit component rated-voltage data gaps\n    cannot be silently treated as electrical compliance.\n    \"\"\"\n    req = clean(spec)\n    param = clean(product.get('规格参数'))\n    cat = clean(product.get('产品类别'))\n    wants = re.search('(?:额定工作电压|工作电压|系统电压|电网电压|交流电压)\\\\s*[:：=]?\\\\s*(?:AC\\\\s*)?(3[68]0|400|415)\\\\s*V', req, re.I)\n    if not wants:\n        return ('NOT_APPLICABLE', '')\n    requested = int(wants.group(1))\n    require_rated = bool(re.search('额定工作电压\\\\s*[:：=]?\\\\s*(?:AC\\\\s*)?' + str(requested) + '\\\\s*V', req, re.I))\n    if cat in ('电涌保护器', '浪涌保护器'):\n        return ('REVIEW', '系统' + str(requested) + 'V与SPD的Uc和接线方式需工程核实；不得以Uc直接当额定工作电压')\n    matched = re.search('(?:额定工作电压|工作电压)\\\\s*=\\\\s*(AC|DC)?\\\\s*((?:\\\\d{2,4}\\\\s*/\\\\s*)*\\\\d{2,4})\\\\s*V\\\\b', param, re.I)\n    if not matched:\n        if require_rated:\n\
          \            return ('UNVERIFIED_EXPLICIT', '元器件明确要求额定工作电压' + str(requested) + 'V，但原始PRODUCT无可验证的额定电压')\n        return ('REVIEW', '系统' + str(requested) + 'V；PRODUCT没有该产品额定工作电压证据，需工程师查产品样本核实')\n    acdc = (matched.group(1) or '').upper()\n    nums = [int(x) for x in re.findall('\\\\d{2,4}', matched.group(2))]\n    if acdc == 'DC':\n        return ('MISMATCH', '需求交流系统' + str(requested) + 'V，产品记录明确为DC额定，须核实是否有交流额定值')\n    if acdc == 'AC' and nums and (max(nums) >= requested):\n        return ('VERIFIED_BY_RECORD', 'PRODUCT载明' + matched.group(0) + '；按额定交流电压容量覆盖系统' + str(requested) + 'V作材料参考报价，最终适用性待厂家样本确认')\n    if acdc == 'AC' and nums and (max(nums) < requested):\n        return ('MISMATCH', '系统' + str(requested) + 'V，产品额定工作电压仅' + matched.group(0))\n    return ('REVIEW', 'PRODUCT电压记录缺少AC/DC制式，不能直接判定系统' + str(requested) + 'V适用性')\n\ndef check_specs(spec, product):\n    \"\"\"Verify key explicit machine-checkable requirements; defer others to engineer.\"\"\"\n    original_text = clean(spec)\n\
          \    text = re.sub('(?:不允许|不得|禁止|不能|不采用|不选用|不使用|排除|不含)[^;；。\\\\n,，]*', '', original_text)\n    if not original_text:\n        return ''\n    if '电压参数含义待确认' in text:\n        return 'SPD电压参数含义未明确，不能报价'\n    desc = clean(product['物料描述'])\n    param = clean(product['规格参数'])\n    alltxt = desc + ' ' + param\n    m = re.search('(?<![A-Z0-9])([1-4])\\\\s*P(?![A-Z0-9])', text, re.I)\n    if m:\n        pm = re.search('极数\\\\s*=\\\\s*([1-4])\\\\s*P', param, re.I)\n        if pm and pm.group(1) != m.group(1):\n            return '关键参数极数不符：要求' + m.group(1) + 'P，产品' + pm.group(1) + 'P'\n        if not pm and (not re.search('(?<![A-Z0-9])' + m.group(1) + '\\\\s*P(?![A-Z0-9])', alltxt, re.I)):\n            return '无法证实关键参数极数' + m.group(1) + 'P'\n    curve = re.search('(?<![A-Z0-9])([BCD])\\\\s*型\\\\s*(?:脱扣|曲线)?', text, re.I)\n    if curve:\n        actual = re.search('脱扣特性\\\\s*=\\\\s*([BCD])\\\\b', param, re.I)\n        if actual and curve.group(1).upper() != actual.group(1).upper():\n   \
          \         return '脱扣特性不符：要求' + curve.group(1).upper() + '型，产品' + actual.group(1).upper() + '型'\n        if not actual and (not re.search('(?<![A-Z0-9])' + curve.group(1) + '\\\\d{1,3}(?![A-Z0-9])', desc, re.I)):\n            return '无法核实要求的' + curve.group(1).upper() + '型脱扣特性'\n    trip = re.search('(?<![A-Z0-9])([BCD])\\\\s*(\\\\d{1,3})(?![A-Z0-9])', text, re.I)\n    if trip:\n        characteristic, current = (trip.group(1).upper(), trip.group(2))\n        t = re.search('脱扣特性\\\\s*=\\\\s*([BCD])\\\\b', param, re.I)\n        rated = re.search('额定电流\\\\s*=\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*A', param, re.I)\n        if t and t.group(1).upper() != characteristic:\n            return '脱扣特性不符：要求' + characteristic + '，产品' + t.group(1)\n        if rated and Decimal(rated.group(1)) != Decimal(current):\n            return '额定电流不符：要求' + current + 'A，产品' + rated.group(1) + 'A'\n        if not t and norm(characteristic + current) not in norm(desc):\n            return '无法核实脱扣曲线与电流' + characteristic\
          \ + current\n    currents = re.findall('(?<![A-Za-z0-9])([1-9]\\\\d{1,3})\\\\s*A(?![A-Za-z0-9])', text, re.I)\n    if currents:\n        rated = re.search('额定电流\\\\s*=\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*A', param, re.I)\n        for c in currents:\n            if rated:\n                minimum = bool(re.search('额定电流最低要求\\\\s*[:：=]?\\\\s*' + re.escape(c) + '\\\\s*A', text, re.I))\n                if Decimal(rated.group(1)) < Decimal(c) if minimum else Decimal(rated.group(1)) != Decimal(c):\n                    return '关键参数额定电流不符：要求' + c + 'A，产品' + rated.group(1) + 'A'\n            elif not re.search('(?<!\\\\d)' + c + '\\\\s*A(?!\\\\w)', desc, re.I):\n                return '无法核实关键参数额定电流' + c + 'A'\n    uc_req = re.search('(?:Uc|最大持续工作电压|最大持续运行电压|持续运行电压)\\\\s*[:：=]?\\\\s*(\\\\d{2,4})\\\\s*V', text, re.I)\n    if uc_req:\n        uc_known = re.search('最大持续工作电压\\\\s*=\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*V?', param, re.I)\n        if not uc_known:\n            return '无法核实浪涌保护器最大持续工作电压Uc'\
          \ + uc_req.group(1) + 'V（须核实专用参数，不能用系统电压代替）'\n        if Decimal(uc_known.group(1)) != Decimal(uc_req.group(1)):\n            return 'Uc不符：需求' + uc_req.group(1) + 'V，产品' + uc_known.group(1) + 'V'\n    if re.search('禁止附件[^；;\\\\n]*辅助触点|无附加触点|无辅助触点', original_text) and re.search('(?<![A-Z])OF\\\\d*|配[^;；]*辅助触|带[^;；]*辅助触', alltxt, re.I):\n        return '原始要求禁止辅助触点，最终产品带附加触点，请重新选型'\n    for label in ('标称放电电流', '最大放电电流'):\n        demand = re.search(label + '(?:In|Imax)?\\\\s*[:：=]\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*kA', text, re.I)\n        if demand:\n            known = re.search(label + '\\\\s*(?:[（(]\\\\s*kA\\\\s*[）)])?\\\\s*[:=：]\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*kA', param, re.I)\n            if not known:\n                return '无法核实' + label + '专用参数，不能用其他kA数值代替'\n            if Decimal(known.group(1)) < Decimal(demand.group(1)):\n                return label + '低于明确要求'\n    demand = re.search('试验类别\\\\s*[:：=]\\\\s*([^；;\\\\n]+)', text)\n    if demand:\n        known = re.search('试验(?:分类|类型|类别)\\\
          \\s*[:：=]\\\\s*([^；;\\\\n]+)', param)\n        canon = lambda s: clean(s).upper().replace('类', '').replace('Ⅱ', 'II')\n        if not known or canon(known.group(1)) != canon(demand.group(1)):\n            return '试验类别未证实或不符'\n    ratings = re.findall('(?<![A-Za-z0-9])([1-9]\\\\d*(?:\\\\.\\\\d+)?)\\\\s*kA(?![A-Za-z0-9])', text, re.I)\n    for rating in ratings:\n        if not re.search('(?<!\\\\d)' + re.escape(rating) + '\\\\s*kA(?![A-Za-z0-9])', alltxt, re.I):\n            return '不能核实关键参数' + rating + 'kA'\n    pair_kas = re.findall('(?<![A-Za-z0-9])([1-9]\\\\d*)\\\\s*/\\\\s*([1-9]\\\\d*)\\\\s*kA', text, re.I)\n    for a, b in pair_kas:\n        for num in (a, b):\n            if not re.search('(?<!\\\\d)' + re.escape(num) + '\\\\s*kA(?![A-Za-z0-9])', alltxt, re.I):\n                return '不能核实标称/最大放电电流' + num + 'kA'\n    for count in re.findall('(?<!\\\\d)([1-9]\\\\d?)\\\\s*孔', text):\n        if not re.search('(?<!\\\\d)' + count + '\\\\s*孔', alltxt):\n            return '接地排孔数与要求不一致：'\
          \ + count + '孔'\n    for protection in re.findall('\\\\bIP\\\\s*\\\\d{2}\\\\b', text, re.I):\n        if norm(protection) not in norm(alltxt):\n            return '防护等级不符：要求' + protection\n    if re.search('(?<![A-Z0-9])([BCD])(\\\\d{2,3})(?![A-Z0-9])', text, re.I) and '断路器' not in clean(product['产品类别']):\n        return '要求脱扣曲线，但产品类别不是断路器'\n    return ''\nPRODUCT_FIELDS = ('物料编码', '物料描述', '产品类别', '产品系列', '规格参数', '状态', '数据质量')\nPRICE_FIELDS = ('物料编码', '物料描述', '产品类别', '未税单价', '计价单位', '税率', '有效期', '价格版本', '审批状态')\nCODE_RE = re.compile('物料编码\\\\s*[:：]\\\\s*([A-Z][A-Z0-9_-]{5,}|\\\\d{8,16})(?![A-Z0-9_-])', re.I)\n\ndef doc_texts(value):\n    \"\"\"Only interpret document body text; never mistake retrieval metadata for a record.\"\"\"\n    if isinstance(value, str):\n        if value.strip().startswith(('[', '{')):\n            try:\n                parsed = json.loads(value)\n                if isinstance(parsed, (dict, list)):\n                    return doc_texts(parsed)\n      \
          \      except (ValueError, TypeError):\n                pass\n        return [value] if value.strip() else []\n    if isinstance(value, list):\n        out = []\n        for x in value:\n            out.extend(doc_texts(x))\n        return out\n    if isinstance(value, dict):\n        for k in ('content', 'text', 'page_content'):\n            if isinstance(value.get(k), str) and value[k].strip():\n                return [value[k]]\n        for k in ('result', 'results', 'documents', 'chunks', 'data'):\n            if k in value:\n                return doc_texts(value[k])\n    return []\n\ndef extract_field(block, key, fields):\n    \"\"\"Read the named field only inside one material record, not the next record.\"\"\"\n    all_labels = '|'.join((re.escape(x) for x in fields))\n    m = re.search('(?:^|\\\\s)' + re.escape(key) + '\\\\s*[:：]\\\\s*', block, re.I)\n    if not m:\n        return ''\n    rest = block[m.end():]\n    nxt = re.search('(?:^|\\\\s)(?:' + all_labels + ')\\\\\
          s*[:：]', rest, re.I)\n    value = rest[:nxt.start()] if nxt else rest\n    value = re.split('(?:\\\\n\\\\s*#{1,6}\\\\s*(?:PRODUCT|PRICE)\\\\b|\\\\n\\\\s*---\\\\s*$)', value, 1, flags=re.I | re.M)[0]\n    value = re.sub('\\\\s+', ' ', value).strip()\n    value = re.sub('(?:\\\\s+#{0,6}\\\\s*(?:PRICE|PRODUCT)|\\\\s+---)\\\\s*$', '', value, flags=re.I).strip()\n    return value\n\ndef parse_records(value, fields):\n    \"\"\"Exact-code record extraction from any Dify retrieval hit; never join adjacent codes.\"\"\"\n    out = []\n    for raw in doc_texts(value):\n        text = raw.replace('**', '').replace('＃', '')\n        matches = list(CODE_RE.finditer(text))\n        for i, m in enumerate(matches):\n            block = text[m.start():matches[i + 1].start() if i + 1 < len(matches) else len(text)]\n            row = {'物料编码': m.group(1).upper()}\n            for k in fields[1:]:\n                row[k] = extract_field(block, k, fields)\n            if row.get('物料描述') and (row.get('规格参数')\
          \ if fields == PRODUCT_FIELDS else row.get('未税单价')):\n                out.append(row)\n    return out\n\ndef explicit_trip_requirements(value):\n    curves = set()\n    currents = set()\n    if isinstance(value, dict):\n        for key, child in value.items():\n            if str(key).lower() in ('forbidden_models', 'excluded_models', 'prohibited_models', 'forbidden_accessories'):\n                continue\n            if key in ('trip_curve', 'tripping_curve', '脱扣曲线', '脱扣特性'):\n                text = clean(child).upper()\n                if text in ('B', 'C', 'D'):\n                    curves.add(text)\n            c, a = explicit_trip_requirements(child)\n            curves.update(c)\n            currents.update(a)\n        return (curves, currents)\n    if isinstance(value, (list, tuple)):\n        for child in value:\n            c, a = explicit_trip_requirements(child)\n            curves.update(c)\n            currents.update(a)\n        return (curves, currents)\n    text\
          \ = clean(value).upper()\n    text = re.sub('(?:不允许|不得|禁止|不能|不采用|不选用|不使用|排除|不含)[^;；。\\\\n,，]*', '', text)\n    for match in re.finditer('(?<![A-Z0-9])([BCD])\\\\s*(\\\\d{1,3})(?:\\\\s*A)?(?![A-Z0-9])', text):\n        curves.add(match.group(1))\n        currents.add(int(match.group(2)))\n    for match in re.finditer('(?:脱扣(?:特性|曲线)|TRIP_CURVE|TRIPPING_CURVE)\\\\s*[:：=为]?\\\\s*([BCD])(?![A-Z0-9/／])|(?<![A-Z0-9/／])([BCD])\\\\s*型?\\\\s*脱扣', text):\n        curves.add(next((x for x in match.groups() if x)))\n    return (curves, currents)\n\ndef trip_mismatch(requirement, product):\n    wanted_curves, wanted_currents = explicit_trip_requirements(requirement)\n    actual_curves, actual_currents = explicit_trip_requirements(product)\n    if len(wanted_curves) > 1 or len(wanted_currents) > 1:\n        return '需求中的脱扣特性或对应电流存在冲突，请核实原始资料，不能直接采用'\n    if wanted_curves:\n        if len(actual_curves) != 1:\n            return '产品记录或确认型号未唯一证实所要求的脱扣特性：' + '/'.join(sorted(wanted_curves))\n   \
          \     if wanted_curves != actual_curves:\n            return '脱扣特性不一致：要求' + '/'.join(sorted(wanted_curves)) + '型，当前为' + '/'.join(sorted(actual_curves)) + '型；请更正型号及对应物料编码'\n    if wanted_currents and actual_currents and (wanted_currents != actual_currents):\n        return '脱扣型号额定电流不一致：要求%sA，当前%sA' % (sorted(wanted_currents), sorted(actual_currents))\n    return ''\n\ndef main(item_json, material_code, product_result, price_result, primary_product_result, primary_price_result, product_gate, price_gate):\n    product_retry_result = []\n    price_retry_result = []\n    try:\n        item = json.loads(item_json) if isinstance(item_json, str) else item_json if isinstance(item_json, dict) else {}\n    except (ValueError, TypeError):\n        item = {}\n    code = clean(material_code or item.get('material_code')).upper()\n    result = dict(item)\n    result.update(material_code=code, item_status='PRICED', issue='', price_source='', product_source='')\n    if not re.fullmatch('(?:\\\\\
          d{8,16}|[A-Z][A-Z0-9_-]{5,})', code):\n        stop(result, 'INVALID_CODE', 'BOM物料编码为空或格式不合法')\n    result['product_retrieval_hits'] = len(doc_texts(product_result)) + len(doc_texts(product_retry_result))\n    result['price_retrieval_hits'] = len(doc_texts(price_result)) + len(doc_texts(price_retry_result))\n    result['product_exact_primary_hits'] = sum((p['物料编码'] == code for p in parse_records(primary_product_result, PRODUCT_FIELDS)))\n    result['product_exact_retry_hits'] = sum((p['物料编码'] == code for p in parse_records(product_retry_result, PRODUCT_FIELDS)))\n    result['price_exact_primary_hits'] = sum((p['物料编码'] == code for p in parse_records(primary_price_result, PRICE_FIELDS)))\n    result['price_exact_retry_hits'] = sum((p['物料编码'] == code for p in parse_records(price_retry_result, PRICE_FIELDS)))\n    result['product_primary_retrieval_hits'] = len(doc_texts(primary_product_result))\n    result['price_primary_retrieval_hits'] = len(doc_texts(primary_price_result))\n   \
          \ result['product_retry_executed'] = product_gate == 'MISS'\n    result['price_retry_executed'] = price_gate == 'MISS'\n    result['product_exact_selected_hits'] = sum((p['物料编码'] == code for p in parse_records(product_result, PRODUCT_FIELDS)))\n    result['price_exact_selected_hits'] = sum((p['物料编码'] == code for p in parse_records(price_result, PRICE_FIELDS)))\n    result['product_exact_retry_hits'] = result['product_exact_selected_hits'] if result['product_retry_executed'] else 0\n    result['price_exact_retry_hits'] = result['price_exact_selected_hits'] if result['price_retry_executed'] else 0\n    result['product_returned_codes'] = list(dict.fromkeys((p['物料编码'] for p in parse_records(product_result, PRODUCT_FIELDS))))\n    result['product_returned_documents'] = list(dict.fromkeys((clean(x.get('title')) for x in product_result or [] if isinstance(x, dict) and clean(x.get('title')))))\n    if result['item_status'] == 'PRICED':\n        candidates = [p for p in parse_records(product_result,\
          \ PRODUCT_FIELDS) + parse_records(product_retry_result, PRODUCT_FIELDS) if p['物料编码'] == code]\n        signatures = {tuple((p.get(k, '') for k in ('物料描述', '产品类别', '规格参数', '状态'))) for p in candidates}\n        if len(signatures) > 1:\n            stop(result, 'PRODUCT_CONFLICT', '实时PRODUCT检索同码出现不同产品描述或规格，不能以离线备援覆盖冲突')\n        elif candidates:\n            product = candidates[0]\n            result['product_source'] = 'PRODUCT_API'\n        else:\n            stop(result, 'PRODUCT_NOT_RETRIEVED', '本次产品检索未命中编码%s（%s）；备用检索%s。最终返回编码：%s。请在产品库搜索该编码，核对原始产品段是否可用；系统未用价格记录或离线快照替代产品证据' % (code, clean(item.get('model_spec')), '已执行' if result['product_retry_executed'] else '未执行', '、'.join(result['product_returned_codes'][:5]) or '未解析到编码'))\n    if result['item_status'] == 'PRICED':\n        if not product.get('状态') or any((x in product['状态'] for x in ('停用', '禁用', '冻结', '停产', '淘汰', '作废'))):\n            stop(result, 'PRODUCT_UNAVAILABLE', '产品状态缺失或不可用：' + clean(product.get('状态')))\n        elif\
          \ any((x in product['状态'] for x in ('待核实', '待确认', '待审核'))) or code.startswith('TMP-'):\n            result['technical_review_required'] = True\n            result['technical_review_notes'] = ['产品状态为' + clean(product.get('状态')) + '或为临时物料编码，须工程师/采购核实，当前仅可作为正式价格库材料报价']\n    if result['item_status'] == 'PRICED':\n        e = check_category(item, product)\n        if e:\n            stop(result, 'CATEGORY_MISMATCH', e)\n    if result['item_status'] == 'PRICED':\n        e = check_model(item.get('model_spec'), product)\n        if e:\n            stop(result, 'MODEL_SPEC_MISMATCH', e)\n    if result['item_status'] == 'PRICED':\n        try:\n            typed = json.loads(item.get('requirements_json') or '{}')\n            if not isinstance(typed, dict):\n                raise ValueError('原始要求不是对象')\n        except (ValueError, TypeError):\n            typed = {}\n            stop(result, 'TECH_SPEC_MISMATCH', '原始结构化技术要求损坏，不能跳过校验')\n        extension_conflicts, extension_warnings = extension_product_checks(typed,\
          \ product)\n        if extension_conflicts:\n            stop(result, 'TECH_SPEC_MISMATCH', '；'.join(extension_conflicts))\n        e = trip_mismatch(item.get('key_technical_parameters'), product.get('规格参数', '') + ' ' + product.get('物料描述', ''))\n        if not e:\n            e = check_specs(item.get('key_technical_parameters'), product)\n        if e:\n            stop(result, 'TECH_SPEC_MISMATCH', e)\n        if result['item_status'] == 'PRICED':\n            voltage_state, voltage_note = evaluate_system_voltage(item.get('key_technical_parameters'), product)\n            result['voltage_check_status'] = voltage_state\n            if voltage_note:\n                result['voltage_check_note'] = voltage_note\n            if voltage_state == 'MISMATCH':\n                stop(result, 'TECH_SPEC_MISMATCH', voltage_note)\n            elif voltage_state == 'UNVERIFIED_EXPLICIT':\n                stop(result, 'VOLTAGE_RATING_UNVERIFIED', voltage_note)\n            elif voltage_state\
          \ == 'REVIEW':\n                result['technical_review_required'] = True\n                result.setdefault('technical_review_notes', []).append(voltage_note)\n    if result['item_status'] == 'PRICED':\n        found = [p for p in parse_records(price_result, PRICE_FIELDS) + parse_records(price_retry_result, PRICE_FIELDS) if p['物料编码'] == code]\n        result['price_exact_code_records'] = len(found)\n        signatures = {tuple((re.sub('\\\\s+', ' ', clean(p.get(k, ''))) for k in PRICE_FIELDS)) for p in found}\n        if len(signatures) > 1:\n            stop(result, 'PRICE_CONFLICT', 'PRICE实时检索同码存在不同价/版本/单位/有效期，不自动选价')\n        elif not found:\n            stop(result, 'PRICE_NOT_RETRIEVED', 'PRICE主检索和备用检索均未返回完整的精确编码价格；请检查两个PRICE节点的库绑定、索引、分段及命中详情；不得猜测价格')\n        else:\n            price = found[0]\n            if not all((clean(price.get(x)) for x in PRICE_FIELDS if x != '物料描述')):\n                stop(result, 'PRICE_FIELD_MISSING', 'PRICE知识库中此编码的必填字段缺失')\n            result['price_source']\
          \ = 'PRICE_API'\n            if result['item_status'] == 'PRICED' and ((clean(price.get('物料描述')) and clean(price.get('物料描述')) != clean(product.get('物料描述'))) or clean(price.get('产品类别')) != clean(product.get('产品类别'))):\n                stop(result, 'PRODUCT_PRICE_CONFLICT', '检索到的PRICE描述或类别与产品记录不一致，请检查知识库版本')\n    if result['item_status'] == 'PRICED':\n        unit = price['计价单位']\n        bom_unit = clean(item.get('unit'))\n        unit_ok, note = count_unit_ok(bom_unit, unit, product['产品类别'])\n        amount = dec(price['未税单价'])\n        taxraw = price['税率']\n        tax = dec(taxraw)\n        rate = tax / Decimal('100') if tax is not None and '%' in taxraw else tax\n        if amount is None or amount <= 0:\n            stop(result, 'PRICE_INVALID', '正式价格库未税单价无效')\n        elif rate is None or not Decimal('0') <= rate <= Decimal('1'):\n            stop(result, 'TAX_INVALID', '税率格式或数值无效')\n        elif price['审批状态'].upper() not in ('ACTIVE', '有效'):\n            stop(result, 'PRICE_APPROVAL_MISMATCH',\
          \ '正式价格库记录不是ACTIVE状态')\n        elif not unit:\n            stop(result, 'UNIT_MISSING', 'PRICE计价单位缺失')\n        elif bom_unit and (not unit_ok):\n            stop(result, 'UNIT_MISMATCH', 'BOM单位' + bom_unit + '不能与价格单位' + unit + '安全对应')\n        else:\n            mm = re.fullmatch('(\\\\d{4}-\\\\d{2}-\\\\d{2})\\\\s*至\\\\s*(\\\\d{4}-\\\\d{2}-\\\\d{2})', price['有效期'])\n            if not mm:\n                stop(result, 'PRICE_VALIDITY_UNKNOWN', 'PRICE有效期缺少起止日期')\n            else:\n                try:\n                    start = datetime.strptime(mm.group(1), '%Y-%m-%d').date()\n                    end = datetime.strptime(mm.group(2), '%Y-%m-%d').date()\n                    if not start <= date.today() <= end:\n                        stop(result, 'PRICE_EXPIRED', 'PRICE正式价格未生效或已过期：' + price['有效期'])\n                except ValueError:\n                    stop(result, 'PRICE_INVALID', 'PRICE有效期日期非法')\n    if result['item_status'] == 'PRICED':\n        result.update(material_name=clean(item.get('material_name'))\
          \ or product['物料描述'], category=price['产品类别'], pricing_unit=unit, unit_price_ex_tax=float(amount), tax_rate=float(rate), price_version=price['价格版本'], approval_status='ACTIVE', price_basis=price.get('价格依据') or 'MARKET_REFERENCE_ESTIMATE', reference_only=False, price_validity=price['有效期'], unit_conversion_note=note, product_status=product['状态'], product_description=product['物料描述'])\n    return {'quote_item_json': json.dumps(result, ensure_ascii=False), 'item_status': result['item_status'], 'material_code': code}\nimport unicodedata\n\ndef product_field_token(value):\n    return re.sub('[\\\\s_()（）²]+', '', unicodedata.normalize('NFKC', str(value or ''))).casefold()\n\ndef product_attribute_map(record):\n    attrs = record.get('规格参数') or ''\n    if isinstance(attrs, dict):\n        return {product_field_token(k): v for k, v in attrs.items()}\n    result = {}\n    for part in re.split('[;；\\\\n]', str(attrs)):\n        m = re.match('\\\\s*([^=:：]{1,45})\\\\s*[=:：]\\\\s*(.+?)\\\\s*$',\
          \ part)\n        if m:\n            result[product_field_token(m.group(1))] = m.group(2)\n    for k, v in record.items():\n        if v not in (None, '', [], {}):\n            result.setdefault(product_field_token(k), v)\n    materials = re.findall('(?<!\\\\d)(201|304|316L?)\\\\s*不锈钢', str(record.get('物料描述') or ''), re.I)\n    if len(set(materials)) == 1:\n        result.setdefault(product_field_token('材质'), materials[0] + '不锈钢')\n    return result\n\ndef extension_product_checks(requirements, record):\n    attrs = product_attribute_map(record)\n    conflicts = []\n    warnings = []\n    fields = {'control_voltage': ('控制/线圈电压', ('控制电压', '线圈电压', 'control_voltage'), 'voltage'), 'leakage_current_ma': ('漏电动作电流', ('额定剩余动作电流', '漏电动作电流', '剩余动作电流', 'leakage_current_ma'), 'ma'), 'material': ('材质', ('材质', '柜体材质', 'material'), 'material'), 'thickness_mm': ('板厚', ('板厚', '柜体板厚', '厚度', 'thickness_mm'), 'mm'), 'cross_section_mm2': ('截面积', ('截面积', '导体截面', 'cross_section_mm2'), 'mm2'), 'color':\
          \ ('颜色', ('颜色', '表面颜色', 'color'), 'text'), 'installation_mode': ('安装方式', ('安装方式', 'installation_mode'), 'text'), 'operation_mode': ('操作方式', ('操作方式', 'operation_mode'), 'text')}\n\n    def atom(value, kind):\n        text = unicodedata.normalize('NFKC', str(value or '')).strip().upper().replace(' ', '')\n        if kind == 'material':\n            found = set(re.findall('(?<!\\\\d)(201|304|316L?)(?!\\\\d)', text))\n            return next(iter(found)) if len(found) == 1 else None\n        if kind == 'voltage':\n            m = re.fullmatch('(AC|DC)?([0-9.]+)(KV|V)?', text)\n            return (m.group(1) or '', float(m.group(2)) * (1000 if m.group(3) == 'KV' else 1)) if m else None\n        if kind in ('ma', 'mm', 'mm2'):\n            m = re.fullmatch('([0-9.]+)(MA|A|MM|MM2|平方毫米)?', text)\n            if not m:\n                return None\n            unit = m.group(2) or ''\n            if kind == 'ma' and unit not in ('', 'MA', 'A'):\n                return None\n           \
