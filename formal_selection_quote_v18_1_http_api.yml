    - data:
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport io as _wio\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_WIRE_MAX = 55000\n_CONTEXT_MAX = 5000000\n_BATCH_MAX = 120\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_loads(value):\n    if isinstance(value, (dict, list)):\n        return value\n    text = str(value or '').strip()\n    if text.startswith(_WIRE_PREFIX):\n        digest, body = text[len(_WIRE_PREFIX):].split(':', 1)\n        compressed = _wb64.b64decode(body, validate=True)\n        with _wgzip.GzipFile(fileobj=_wio.BytesIO(compressed)) as stream:\n            raw = stream.read(_CONTEXT_MAX + 1)\n        if len(raw) > _CONTEXT_MAX:\n            raise CapacityError('完整上下文超过本版5MB解码保护上限，请按柜号或回路分批')\n        if _whash.sha256(raw).hexdigest() != digest:\n            raise ValueError('上下文校验失败，内容可能不完整')\n        return _wjson.loads(raw.decode('utf-8'))\n    return _wjson.loads(text)\n\ndef wire_pack(value):\n    raw = _wjson.dumps(value,\
          \ ensure_ascii=False, separators=(',', ':'), allow_nan=False).encode('utf-8')\n    if len(raw) > _CONTEXT_MAX:\n        raise CapacityError('完整上下文超过本版5MB保护上限，请按柜号或回路分批')\n    if len(raw) <= _WIRE_MAX:\n        return raw.decode('utf-8')\n    result = _WIRE_PREFIX + _whash.sha256(raw).hexdigest() + ':' + _wb64.b64encode(_wgzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii')\n    if len(result.encode('utf-8')) > _WIRE_MAX:\n        raise CapacityError('上下文无损压缩后仍超过传递预算，请按柜号或回路分批；本次不生成不完整BOM')\n    return result\n\ndef plain_json(value):\n    return _wjson.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)\n\ndef capacity_markdown(message):\n    return '## 资料问题确认\\n\\n| 序号 | 关联位置 | 问题类型 | 问题说明 | 对后续的影响 | 工程师确认/补充 |\\n|---:|---|---|---|---|---|\\n| 1 | 当前提交 | 处理容量 | ' + message.replace('|', '／') + ' | 本次未进入选型或报价，未生成部分清单 | 请拆分资料后重新开始选型 |'\n\ndef check_array_budget(requirements):\n    if len(requirements) > _BATCH_MAX:\n        return '本次共%d项有效BOM需求，超过本版每次%d项的Excel模板容量。请按柜号或回路分批提交；全部需求仍保留在内部上下文，本次未执行部分选型。'\
          \ % (len(requirements), _BATCH_MAX)\n    if len(plain_json(requirements).encode('utf-8')) > 140000:\n        return '本批需求及证据展开后超过140KB数组预算，请按柜号或回路分批。本次未执行部分选型。'\n    if any((len(plain_json(r).encode('utf-8')) > 45000 for r in requirements)):\n        return '单项需求及证据超过45KB预算，请精简重复原文或将相关页单独提交；本次未静默截断证据。'\n    return ''\nimport json\nimport re\n\ndef strip_fence(text):\n    value = (text or '').strip()\n    value = re.sub('^```(?:json)?\\\\s*', '', value, flags=re.I)\n    value = re.sub('\\\\s*```$', '', value)\n    return value.strip()\n\ndef parse_object(value):\n    if isinstance(value, str) and value.strip().startswith(_WIRE_PREFIX):\n        return wire_loads(value)\n    if isinstance(value, dict):\n        return value\n    try:\n        result = json.loads(strip_fence(value))\n        return result if isinstance(result, dict) else {}\n    except Exception:\n        return {}\n\ndef clean(value):\n    if value is None:\n        return ''\n    if isinstance(value, bool):\n  \
          \      return '是' if value else '否'\n    if isinstance(value, (dict, list)):\n        value = json.dumps(value, ensure_ascii=False)\n    return str(value).replace('|', '／').replace('\\n', ' ').replace('\\r', ' ').strip()\n\ndef num__stage_1(value):\n    if value in (None, '') or isinstance(value, bool):\n        return None\n    try:\n        x = float(value)\n        return int(x) if x.is_integer() else x\n    except Exception:\n        return None\n\ndef evidence_text(value):\n    if isinstance(value, list):\n        return '；'.join((evidence_text(x) for x in value if x not in (None, '', [], {})))\n    if isinstance(value, dict):\n        page = value.get('page_index') or value.get('image_index') or ''\n        section = clean(value.get('section'))\n        location = clean(value.get('location'))\n        text = clean(value.get('text'))\n        prefix = '第%s页' % page if page else ''\n        return clean(' '.join((x for x in [prefix, section, location, text] if x)))\n    return\
