app:
  description: 基于V18.0，将五处知识库检索替换为HTTP API查询和返回值校验。保留原有资料提取、人工确认、模板和整批报价校验。目标Dify运行环境仍需联调。
  icon: 🤖
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 成套柜智能选型与报价 V18.1（HTTP API接入版）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:0.1.1@f3a8b649027d1bd13e67df96f3463a601c16628da4292705528d28d97d96b263
- current_identifier: null
  type: marketplace
  value:
