          \ issue='按件计数的器件数量必须为整数')\n            except (ValueError, TypeError, InvalidOperation):\n                row.update(item_status='INVALID_QUANTITY', issue='数量格式无效')\n        checked.append(row)\n    if confirmed_bom_json:\n        try:\n            confirmed = json.loads(confirmed_bom_json)\n            expected = confirmed.get('items')\n            if confirmed.get('pricing_allowed') is not True or not isinstance(expected, list) or (not expected):\n                raise ValueError('缺少允许计价的人工确认BOM')\n\n            def item_key(row):\n                return str(row.get('source_request_id') or row.get('line_no') or '')\n            byid = {item_key(row): row for row in expected}\n            returned = [item_key(row) for row in checked]\n            if len(byid) != len(expected) or not all(byid) or len(returned) != len(set(returned)) or (set(returned) != set(byid)):\n                raise ValueError('逐项计价结果与已确认BOM行数或来源编号不一致，不能生成部分报价')\n            for row in checked:\n          \
          \      original = byid[item_key(row)]\n                if clean(row.get('material_code')) != clean(original.get('material_code')) or Decimal(str(row.get('quantity'))) != Decimal(str(original.get('quantity'))) or clean(row.get('unit')) != clean(original.get('unit')):\n                    raise ValueError('逐项结果的编码、数量或单位偏离已确认BOM，不能汇总')\n        except (ValueError, TypeError, KeyError, InvalidOperation) as exc:\n            checked.append({'quantity': 1, 'item_status': 'INCOMPLETE_PRICE_RESULTS', 'issue': str(exc)})\n    per_cabinet_groups = {row.get('scheme_group_id') for row in checked if row.get('quantity_basis') == 'PER_CABINET' and row.get('scheme_group_id')}\n    if len(per_cabinet_groups) > 1:\n        checked.append({'quantity': 1, 'item_status': 'MIXED_CABINET_SCOPES', 'issue': '本批含不同方案组的单柜用量，不能相加称为一台柜的报价；请分别确认或补充项目柜数'})\n    out = _v1511_quote_main(checked)\n    if out['pricing_status'] != 'READY':\n        out.update(material_subtotal=0, pre_tax_quote=0, tax_amount=0, tax_included_quote=0,\
