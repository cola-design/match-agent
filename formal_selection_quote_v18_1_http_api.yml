    - data:
        code: "import math\nimport json\nimport re\nALLOWED = {'START_SELECTION', 'SUBMIT_CLARIFICATION', 'SUBMIT_BOM', 'HELP', 'UNKNOWN'}\n\ndef clean(value):\n    return '' if value is None else str(value).strip()\n\ndef main(model_text: str, query: str='') -> dict:\n    action, confidence, reason = ('UNKNOWN', 0.0, '未识别到明确操作')\n    try:\n        text = clean(model_text)\n        text = re.sub('^```(?:json)?\\\\s*', '', text, flags=re.I)\n        text = re.sub('\\\\s*```$', '', text)\n        start, end = (text.find('{'), text.rfind('}'))\n        obj = json.loads(text[start:end + 1])\n        candidate = clean(obj.get('action')).upper()\n        confidence = float(obj.get('confidence') or 0)\n        reason = clean(obj.get('reason'))\n        if candidate in ALLOWED and math.isfinite(confidence) and (0.85 <= confidence <= 1):\n            action = candidate\n    except Exception:\n        pass\n    q = clean(query)\n    exact = {'开始选型': 'START_SELECTION', '重新选型': 'START_SELECTION', '提交问题确认':\
          \ 'SUBMIT_CLARIFICATION', '提交需求确认': 'SUBMIT_CLARIFICATION', '提交问题确认单': 'SUBMIT_CLARIFICATION', '提交确认BOM': 'SUBMIT_BOM', '提交BOM确认': 'SUBMIT_BOM'}\n    if q in exact:\n        action, confidence, reason = (exact[q], 1.0, '明确标准指令')\n    if not q or re.fullmatch('[\\\\d\\\\s.,，。]+', q) or q in {'你好', '您好', '在吗', '看看', '测试'}:\n        action, confidence, reason = ('UNKNOWN', 0.0, '未提供明确执行指令')\n    if not math.isfinite(confidence) or not 0 <= confidence <= 1:\n        action, confidence, reason = ('UNKNOWN', 0.0, '意图置信度格式不合法')\n    targets = {'START_SELECTION': '(?:开始|重新|进行)?选型', 'SUBMIT_BOM': '(?:提交|确认|上传).{0,5}BOM', 'SUBMIT_CLARIFICATION': '(?:提交|上传).{0,5}(?:问题|需求)确认'}\n    if action in targets and re.search('(?:不要|不需要|暂不|先别|别|不想).{0,4}' + targets[action], q, re.I):\n        action, confidence, reason = ('UNKNOWN', 0.0, '用户明确暂不执行该动作')\n    return {'action': action, 'intent_confidence': confidence, 'intent_reason': reason}\n"
