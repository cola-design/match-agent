            项目订货柜数写project_cabinet_quantity（协议写cabinet_quantity）；drawing_sample_quantity仅表示图示样柜，不能把“项目共若干台”填到样柜数量。每柜用量、项目总量、项目柜数必须分开。同配置多台柜在原理图、布置图、物料表中重复出现同一位号时保持同一实体。'
