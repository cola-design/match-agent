            "", "category": "", "shown_model": "", "shown_parameters": {}, "quantity_per_cabinet": null, "unit": "", "functional_position": "", "evidence": {"page_index": null, "text": "", "location": ""}}], "evidence": {"page_index": null, "text": "", "location": ""}}], "shown_bom": [{"item_id": "", "scope_type": "auxiliary", "symbol": "", "component_role": "", "category": "", "shown_model": "", "shown_parameters": {}, "quantity_per_cabinet": null, "unit": "", "functional_position": "", "evidence": {"page_index": null, "text": "", "location": ""}}], "auxiliary_materials": [], "wire_requirements": [], "external_cable_requirements": [], "evidence": {"page_index": null, "text": "", "location": ""}, "unreadable_items": [], "cabinet_cable_entry_exit": ""}], "warnings": [], "fragment_status": "COMPLETE|NO_RELEVANT_CONTENT|PARTIAL"}

            文档标识、段号由后续程序从本次迭代输入自动绑定，你只返回提取内容，不承担标识回显。fragment_status缺省只能表明结构已返回，不能证明无遗漏。

            必须覆盖柜体电缆进出位置/方向，写cabinet_cable_entry_exit；与installation_mode（壁挂、落地等安装方式）、器件上进下出要求分开。保留原文和作用范围。通用参数表中有明确文字时不得漏提取。SPD参数固定使用continuous_operating_voltage_v（Uc）、nominal_discharge_current_ka（In）、max_discharge_current_ka（Imax），不用Uc_V或Imax_kA等额外字段。

