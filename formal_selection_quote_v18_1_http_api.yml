          \ ':'), allow_nan=False)\nimport base64\nimport gzip\nimport json\nimport re\nHEADERS = ['序号', '回路/位号', '元器件名称', '关键技术参数', '推荐型号', '物料编码', '数量', '系统状态', '工程师确认', '修改意见']\n\ndef safe(value):\n    text = '' if value is None else str(value).strip()\n    return \"'\" + text if text.startswith(('=', '+', '-', '@')) else text\n\ndef display_parameter(value):\n    text = '' if value is None else str(value)\n    text = text.replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    text = re.sub('[ \\\\t]*[；;][ \\\\t]*', '\\n', text)\n    text = re.sub('\\\\n{3,}', '\\n\\n', text)\n    return text.strip()\n\ndef column_name(number):\n    result = ''\n    while number:\n        number, remainder = divmod(number - 1, 26)\n        result = chr(65 + remainder) + result\n    return result\n\ndef parse_rows(markdown):\n    rows, active = ([], False)\n    for line in str(markdown or '').splitlines():\n        heading = re.match('^\\\\s*##\\\\s+(.+?)\\\\s*$', line)\n        if heading:\n            active\
          \ = heading.group(1).strip() == 'BOM确认'\n            continue\n        if not active or not line.strip().startswith('|'):\n            continue\n        fields = [part.replace('\\\\|', '|').strip() for part in re.split('(?<!\\\\\\\\)\\\\|', line.strip().strip('|'))]\n        if fields == HEADERS or all((re.fullmatch(':?-{3,}:?', x.replace(' ', '')) for x in fields)):\n            continue\n        if len(fields) == len(HEADERS):\n            rows.append(fields)\n    if len(rows) > 120:\n        raise CapacityError('确认单超过120行，请分批，不会仅保留前120行')\n    return rows\n\ndef _original_main(markdown: str, selection_json: str) -> dict:\n    rows = parse_rows(markdown)\n    if not rows:\n        raise ValueError('没有可写入BOM确认单的选型结果')\n    raw = gzip.compress((selection_json or '{}').encode('utf-8'), compresslevel=9, mtime=0)\n    payload_b64 = base64.b64encode(raw).decode('ascii')\n    chunks = [payload_b64[i:i + 24000] for i in range(0, len(payload_b64), 24000)]\n    if len(chunks) > 25:\n \
          \       raise ValueError('BOM上下文过大，超过确认Excel的25段容量')\n    cells = {}\n    cells['BOM确认!A130'] = 'FORM_TYPE'\n    cells['BOM确认!B130'] = 'BOM_CONFIRMATION'\n    cells['BOM确认!A131'] = 'SCHEMA_VERSION'\n    cells['BOM确认!B131'] = 'bom-confirmation-v15.7'\n    cells['系统数据!A2'] = 'FORM_TYPE'\n    cells['系统数据!B2'] = 'BOM_CONFIRMATION'\n    cells['系统数据!A3'] = 'SCHEMA_VERSION'\n    cells['系统数据!B3'] = 'bom-confirmation-v15.7'\n    for index, chunk in enumerate(chunks, 1):\n        for target_sheet, row_no in (('系统数据', 3 + index),):\n            cells['%s!A%d' % (target_sheet, row_no)] = 'PAYLOAD_CHUNK_%03d' % index\n            cells['%s!B%d' % (target_sheet, row_no)] = 'PAYLOAD_B64_PART_%03d:%s' % (index, chunk)\n    for row_number, row in enumerate(rows, 5):\n        for column, value in enumerate(row, 1):\n            if column in (4, 8):\n                value = display_parameter(value)\n            if column == 9:\n                value = '【请工程师填写】'\n            elif column == 10:\n\
          \                value = '【如需修改请填写】'\n            cells['BOM确认!%s%d' % (column_name(column), row_number)] = safe(value)\n    return {'payload_json': json.dumps({'cells': cells, 'output_filename': 'BOM人工确认单_V17.3'}, ensure_ascii=False), 'summary': 'BOM确认%d行；参数按分号分行；前24行使用加高模板（插件不保证任意行自动行高）；选型上下文完整保留' % len(rows)}\n\ndef main(markdown, selection_json):\n    try:\n        decoded = wire_loads(selection_json)\n        if isinstance(decoded, dict) and decoded.get('capacity_blocked'):\n            raise CapacityError(decoded.get('capacity_message') or '本次容量超限，请分批重新提交原始资料')\n        context = plain_json(decoded)\n        out = _original_main(markdown, context)\n        if len(out['payload_json'].encode('utf-8')) > 65000:\n            raise CapacityError('确认单内容超过65KB插件请求预算，请分批。本次未生成可提交的完整确认单。')\n        return out\n    except CapacityError as exc:\n        message = str(exc)\n        sheet = 'BOM确认'\n        cells = {sheet + '!A1': '本次输出容量超限，未生成完整确认单', sheet + '!A2': message, sheet + '!A130':\
