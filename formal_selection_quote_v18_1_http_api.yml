          \   visible = text\n    for marker in payload_markers:\n        visible = visible.replace(marker, '[系统上下文分段已读取]')\n    if len(visible.encode('utf-8')) > 50000:\n        return {'form_status': 'INVALID', 'form_type': form_type, 'base_payload_json': '{}', 'human_table_text': '', 'parse_message': '问题确认表正文超过50KB预算，请分批；未截取前半份意见'}\n    return {'form_status': 'VALID', 'form_type': form_type, 'base_payload_json': decoded, 'human_table_text': visible, 'parse_message': '问题确认表及选型上下文读取成功'}\n\ndef main(extracted_text):\n    out = _original_main(extracted_text)\n    try:\n        base = wire_loads(out['base_payload_json'])\n        if base.get('capacity_blocked'):\n            out.update(form_status='INVALID', parse_message=base.get('capacity_message') or '请分批重新上传原始协议和图纸，不能以填写采用解除容量限制')\n        reqs = base.get('component_requirements', [])\n        projection = {'component_requirements': [{k: r[k] for k in ('request_id', 'scheme_group_id', 'circuit_id', 'component_role', 'category_path', 'requirements',\
