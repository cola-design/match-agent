          \ r for r in components + existing if isinstance(r, dict) and clean(r.get('item_id'))}\n        for item in direct:\n            if not isinstance(item, dict):\n                continue\n            item['evidence'] = compatible_evidence(item.get('evidence'))\n            target = indexed.get(clean(item.get('item_id')))\n            if target is None:\n                existing.append(item)\n                if clean(item.get('item_id')):\n                    indexed[clean(item['item_id'])] = item\n            else:\n                differences = any((target.get(k) not in (None, '') and item.get(k) not in (None, '') and (clean(target[k]) != clean(item[k])) for k in ('shown_model', 'quantity_per_cabinet')))\n                left = target.get('shown_parameters')\n                right = item.get('shown_parameters')\n                if isinstance(left, dict) and isinstance(right, dict):\n                    differences = differences or any((k in left and left[k] not in (None, '') and\
          \ (v not in (None, '')) and (clean(left[k]) != clean(v)) for k, v in right.items()))\n                if differences:\n                    existing.append(item)\n                    data.setdefault('_contract_errors', []).append('同一来源编号的型号、数量或参数不一致：' + clean(item.get('item_id')))\n                else:\n                    for key, value in item.items():\n                        if target.get(key) in (None, '', [], {}) and value not in (None, '', [], {}):\n                            target[key] = value\n                        elif key == 'shown_parameters' and isinstance(value, dict) and isinstance(target.get(key), dict):\n                            for k, v in value.items():\n                                if k not in target[key]:\n                                    target[key][k] = v\n        group['shown_bom'] = existing\n        for key in ('shown_bom', 'auxiliary_materials', 'wire_requirements'):\n            for item in group.get(key, []) if isinstance(group.get(key),\
          \ list) else []:\n                if isinstance(item, dict):\n                    item['evidence'] = compatible_evidence(item.get('evidence'))\n    return data\n\ndef run_drawing_contract(previous, vision_text, raw_drawing_text=''):\n    try:\n        data = wire_loads(strip_fence(vision_text))\n    except (ValueError, TypeError):\n        return previous(vision_text, raw_drawing_text)\n    out = previous(plain_json(normalize_drawing_contract(data)), raw_drawing_text)\n    full = wire_loads(out['validated_drawing_json'])\n    if full.get('_contract_errors'):\n        messages = '；'.join(full['_contract_errors'])\n        out['drawing_validation_status'] = 'NEED_REVIEW'\n        out['drawing_validation_message'] += '；' + messages\n        out['drawing_review_markdown'] += '\\n\\n来源一致性问题：' + messages\n    full['drawing_validation_status'] = out['drawing_validation_status']\n    out['validated_drawing_json'] = wire_pack(full)\n    return out\n\ndef main__v16_before_1(vision_text,\
          \ raw_drawing_text=''):\n    return run_drawing_contract(_drawing_prior_main, vision_text, raw_drawing_text)\n\ndef evidence_proven(value):\n    if isinstance(value, list):\n        return any((evidence_proven(v) for v in value))\n    return isinstance(value, dict) and bool(value.get('text')) and (value.get('source_verified') is True and value.get('document_hash') and value.get('chunk_id') or value.get('page_index') not in (None, ''))\n\ndef generic_repair_fragments(items, issues, gid):\n    out = []\n    for item in items:\n        if not isinstance(item, dict):\n            continue\n        item = copy.deepcopy(item)\n        match = None\n        source_key = clean(item.get('source_row_key'))\n        if source_key:\n            match = next((v for v in out if clean(v.get('source_row_key')) == source_key and evidence_signature(v) == evidence_signature(item)), None)\n        if match is None:\n            out.append(item)\n            continue\n        for key, value in item.items():\n\
          \            if match.get(key) in (None, '', [], {}):\n                match[key] = value\n            elif value not in (None, '', [], {}) and match[key] != value and (key not in ('item_id', 'evidence')):\n                issues.append({'severity': 'BLOCKER', 'level': '错误', 'message': gid + '同一来源行内容矛盾：' + source_key + ' ' + key})\n    return out\n\ndef repair_bom_fragments(items, issues, gid):\n    return generic_repair_fragments(items, issues, gid)\n_v16_drawing_base = main__v16_before_1\n\ndef main(vision_text, raw_drawing_text=''):\n    vision_text = wire_pack(preserve_document_facts(wire_loads(strip_fence(vision_text)), 'DRAWING', raw_drawing_text))\n    out = _v16_drawing_base(vision_text, raw_drawing_text)\n    full = wire_loads(out['validated_drawing_json'])\n    errors = list(full.get('_document_errors', []))\n    for group in full.get('scheme_groups', []):\n        for item in group.get('drawing_items', []):\n            if not evidence_proven(item.get('evidence')):\n\
          \                errors.append('物料缺少可核查的原文：' + clean(item.get('component_role') or item.get('item_id')))\n    if errors:\n        out['drawing_validation_status'] = 'NEED_REVIEW'\n        out['drawing_validation_message'] += '；' + '；'.join(dict.fromkeys(errors))\n        report = out['drawing_review_markdown']\n        before, sep, after = report.partition('## 已识别方案组')\n        extra = '\\n'.join(('| 来源-%d | 错误 | %s | 核对原文或补充可读资料 |' % (i + 1, str(e).replace('|', '／').replace('\\n', ' ')) for i, e in enumerate(dict.fromkeys(errors))))\n        out['drawing_review_markdown'] = before.rstrip() + '\\n' + extra + '\\n\\n' + sep + after\n        out['drawing_summary'] += ' 来源完整性问题%d项。' % len(set(errors))\n    full['drawing_validation_status'] = out['drawing_validation_status']\n    out['validated_drawing_json'] = wire_pack(full)\n    return out\nimport hashlib\nimport math\nimport unicodedata\n\ndef fact_text(value):\n    return unicodedata.normalize('NFKC', str(value or '')).replace('\\\
          r', '')\n\ndef fact_key(value):\n    return re.sub('\\\\s+', '', fact_text(value)).casefold().replace('×', 'x')\n\ndef evidence_leaves(value):\n    out = []\n    if isinstance(value, list):\n        for child in value:\n            out.extend(evidence_leaves(child))\n    elif isinstance(value, dict):\n        if value.get('text'):\n            out.append({k: copy.deepcopy(value[k]) for k in ('text', 'document_hash', 'chunk_id', 'source_verified', 'source_start', 'source_end', 'source_spans', 'page_index', 'location') if k in value})\n        else:\n            for child in value.values():\n                if isinstance(child, (dict, list)):\n                    out.extend(evidence_leaves(child))\n        for child in value.get('sources', []) if isinstance(value.get('sources'), list) else []:\n            out.extend(evidence_leaves(child))\n    unique = []\n    seen = set()\n    for row in out:\n        key = json.dumps(row, ensure_ascii=False, sort_keys=True)\n        if key not\
          \ in seen:\n            seen.add(key)\n            unique.append(row)\n    return unique\n\ndef is_anchored(ev):\n    return ev.get('source_verified') is True and bool(ev.get('document_hash')) and bool(ev.get('chunk_id'))\n\ndef source_rows(evidence, raw_text=''):\n    \"\"\"Expand a verified citation only to its own source line, never a document scan.\"\"\"\n    raw = str(raw_text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    digest = hashlib.sha256(raw.encode()).hexdigest() if raw else ''\n    rows = []\n    for ev in evidence_leaves(evidence):\n        if not is_anchored(ev):\n            continue\n        for line in str(ev['text']).replace('\\\\n', '\\n').splitlines():\n            if line.strip():\n                rows.append((line.strip(), ev))\n        spans = ev.get('source_spans') or ([[ev['source_start'], ev['source_end']]] if isinstance(ev.get('source_start'), int) and isinstance(ev.get('source_end'), int) else [])\n        if raw and digest == ev.get('document_hash'):\n\
          \            for span in spans:\n                if not isinstance(span, (list, tuple)) or len(span) != 2:\n                    continue\n                start, end = span\n                if not isinstance(start, int) or not isinstance(end, int) or (not 0 <= start < end <= len(raw)):\n                    continue\n                if '\\n' in raw[start:end]:\n                    continue\n                a = raw.rfind('\\n', 0, start) + 1\n                b = raw.find('\\n', end)\n                if b < 0:\n                    b = len(raw)\n                row = raw[a:b].strip()\n                expanded = dict(ev, text=row, source_start=a, source_end=b, source_spans=[[a, b]])\n                if row:\n                    rows.append((row, expanded))\n    return rows\n\ndef item_source_clause(line, model, symbol, role):\n    \"\"\"Select a clause with an explicit item identity; same-model peers stay separate.\"\"\"\n    text = fact_text(line)\n    model = fact_text(model).strip()\n\
          \    symbol = fact_text(symbol).strip()\n    clauses = re.split('[;；\\\\n]', text)\n    selected = []\n    for clause in clauses:\n        if re.search('例如|示例|举例|推荐示意|可选型号', clause):\n            continue\n        if model and fact_key(model) not in fact_key(clause):\n            continue\n        if not model:\n            if not symbol or not re.search('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I):\n                continue\n            if role and fact_key(role) not in fact_key(clause):\n                continue\n        if model and fact_key(clause).count(fact_key(model)) > 1:\n            if not symbol:\n                continue\n            hits = list(re.finditer('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I))\n            if len(hits) != 1:\n                continue\n            tail = clause[hits[0].start():]\n            next_position = re.search('\\\\s+[A-Za-z][A-Za-z0-9_-]*\\\\s*[=:：]', tail[len(symbol):])\n\
          \            clause = tail[:len(symbol) + next_position.start()] if next_position else tail\n            if fact_key(clause).count(fact_key(model)) != 1:\n                continue\n        if symbol:\n            label = re.match('\\\\s*([A-Za-z][A-Za-z0-9_-]*)\\\\s*[=:：]', clause)\n            if label and label.group(1).casefold() != symbol.casefold():\n                continue\n        clause = re.sub('(?:不允许|不得|禁止|不能|不采用|不选用|不使用|排除|不含)[^;；。\\\\n,，]*', '', clause)\n        if clause.strip():\n            selected.append(clause.strip())\n    return selected\n\ndef explicit_item_facts(clause, role=''):\n    \"\"\"Small, transparent grammar; unrecognized prose remains in source evidence.\"\"\"\n    text = fact_text(clause)\n    facts = []\n\n    def put(field, value):\n        if isinstance(value, float) and value.is_integer():\n            value = int(value)\n        pair = (field, value)\n        if pair not in facts:\n            facts.append(pair)\n    if '断路器' in str(role)\
          \ or 'MCB' in str(role).upper():\n        for m in re.finditer('(?<![A-Z0-9])([BCD])\\\\s*(\\\\d{1,3})(?:\\\\s*A)?(?![A-Z0-9])', text, re.I):\n            put('trip_curve', m.group(1).upper())\n            put('rated_current_a', int(m.group(2)))\n        for m in re.finditer('(?:脱扣(?:特性|曲线)\\\\s*[:：=为]?\\\\s*([BCD])|(?<![A-Z0-9])([BCD])\\\\s*型脱扣)', text, re.I):\n            put('trip_curve', next((x for x in m.groups() if x)).upper())\n    for m in re.finditer('(?<![A-Za-z0-9])([1-5])\\\\s*P\\\\s*(\\\\+\\\\s*N)?(?![A-Za-z0-9])', text, re.I):\n        put('pole_count', m.group(1) + 'P' + ('+N' if m.group(2) else ''))\n    patterns = [('continuous_operating_voltage_v', '(?:\\\\bUc|最大持续(?:工作|运行)电压)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\\b'), ('max_discharge_current_ka', '(?:\\\\bImax|最大放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA|A)\\\\b'), ('nominal_discharge_current_ka', '(?:\\\\bIn|标称放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\\
          b'), ('breaking_capacity_ka', '(?:分断能力|\\\\bIcn|\\\\bIcu)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\b'), ('rated_current_a', '额定电流\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(A)\\\\b'), ('rated_voltage_v', '额定(?:工作)?电压\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\\b'), ('control_voltage', '(?:线圈电压|控制电压)\\\\s*[:：=为]?\\\\s*((?:AC|DC)\\\\s*\\\\d+(?:\\\\.\\\\d+)?\\\\s*V)\\\\b')]\n    for field, pattern in patterns:\n        for m in re.finditer(pattern, text, re.I):\n            if field == 'control_voltage':\n                put(field, re.sub('\\\\s+', '', m.group(1)).upper())\n                continue\n            number = float(m.group(1))\n            unit = m.group(2).lower()\n            if field.endswith('_v') and unit == 'kv':\n                number *= 1000\n            if field.endswith('_ka') and unit == 'a':\n                number /= 1000\n            put(field, number)\n    return facts\n\ndef normalize_fact_value(field, value):\n    if\
          \ field in ('trip_curve', 'pole_count', 'control_voltage'):\n        return re.sub('\\\\s+', '', fact_text(value)).upper()\n    if isinstance(value, bool):\n        return ('invalid', str(value))\n    m = re.fullmatch('\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V|kA|A)?\\\\s*', str(value), re.I)\n    if not m:\n        return ('text', fact_key(value))\n    number = float(m.group(1))\n    unit = (m.group(2) or '').lower()\n    if field.endswith('_v') and unit == 'kv':\n        number *= 1000\n    elif field.endswith('_ka') and unit == 'a':\n        number /= 1000\n    elif unit and unit not in (('v', 'kv') if field.endswith('_v') else ('a', 'ka')):\n        return ('invalid', str(value))\n    return number\n\ndef recover_item_facts(item, parameter_key, raw_text='', extra_evidence=None):\n    params = item.setdefault(parameter_key, {})\n    if not isinstance(params, dict):\n        return ['物料参数不是对象，无法核对来源']\n    model = item.get('shown_model') or next((params[k] for k in ('model',\
          \ 'required_model', 'designated_model', 'specified_model') if params.get(k)), '')\n    symbol = item.get('symbol') or params.get('bit_number') or params.get('symbol') or ''\n    role = str(item.get('component_role') or item.get('category') or '')\n    ledger = list(item.get('parameter_facts') or [])\n    values = {}\n    errors = []\n    evidence = [item.get('evidence'), extra_evidence]\n    for line, ev in source_rows(evidence, raw_text):\n        for clause in item_source_clause(line, model, symbol, role):\n            for field, value in explicit_item_facts(clause, role):\n                proof = {k: copy.deepcopy(ev[k]) for k in ('document_hash', 'chunk_id', 'source_verified', 'source_start', 'source_end', 'source_spans', 'page_index', 'location') if k in ev}\n                fact = {'field': field, 'value': value, 'source_text': clause, 'source': proof}\n                if fact not in ledger:\n                    ledger.append(fact)\n                values.setdefault(field,\
          \ [])\n                if value not in values[field]:\n                    values[field].append(value)\n    for field, found in values.items():\n        if len({str(normalize_fact_value(field, v)) for v in found}) != 1:\n            errors.append('当前物料原文的' + field + '存在不同值：' + str(found))\n            continue\n        value = found[0]\n        if params.get(field) in (None, '', [], {}):\n            params[field] = value\n        elif normalize_fact_value(field, params[field]) != normalize_fact_value(field, value):\n            errors.append('模型参数' + field + '=' + str(params[field]) + '与当前物料原文' + str(value) + '不一致')\n    if ledger:\n        item['parameter_facts'] = ledger\n    return errors\n\ndef preserve_document_facts(document, kind, raw_text=''):\n    if not isinstance(document, dict):\n        return {'scheme_groups': [], '_document_errors': ['提取结果不是JSON对象，不能作为工程资料']}\n    document = copy.deepcopy(document)\n    errors = document.setdefault('_document_errors', [])\n    if\
          \ not isinstance(errors, list):\n        errors = ['来源错误列表格式异常，需检查提取结果']\n        document['_document_errors'] = errors\n\n    def finite(value, path):\n        if isinstance(value, float) and (not math.isfinite(value)):\n            message = '来源字段含非有限数值：' + path\n            if message not in errors:\n                errors.append(message)\n            return str(value)\n        if isinstance(value, dict):\n            return {key: finite(child, path + '.' + str(key)) for key, child in value.items()}\n        if isinstance(value, list):\n            return [finite(child, path + '[' + str(index) + ']') for index, child in enumerate(value)]\n        return value\n    document = finite(document, kind)\n    document['_document_errors'] = errors\n    if kind == 'PROTOCOL':\n        for rule in document.get('component_rules', []) if isinstance(document.get('component_rules'), list) else []:\n            if not isinstance(rule, dict):\n                continue\n            for error\
          \ in recover_item_facts(rule, 'parameters', raw_text):\n                message = str(rule.get('rule_id') or '') + ' ' + str(rule.get('component_role') or '') + '：' + error\n                if message not in errors:\n                    errors.append(message)\n    else:\n        for group in document.get('scheme_groups', []) if isinstance(document.get('scheme_groups'), list) else []:\n            if not isinstance(group, dict):\n                continue\n            seen = set()\n            for circuit in group.get('circuits', []) if isinstance(group.get('circuits'), list) else []:\n                if not isinstance(circuit, dict):\n                    continue\n                for item in circuit.get('components', []) if isinstance(circuit.get('components'), list) else []:\n                    if not isinstance(item, dict):\n                        continue\n                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text,\
          \ circuit.get('evidence')):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n            for key in ('drawing_items', 'shown_bom', 'auxiliary_materials', 'wire_requirements'):\n                for item in group.get(key, []) if isinstance(group.get(key), list) else []:\n                    if not isinstance(item, dict) or id(item) in seen:\n                        continue\n                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n    return document\n"
