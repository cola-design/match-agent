            输出一个合法JSON：{"schema_version":"component-requirement-advisory-v5","component_requirements":[{"source_item_id":"","scheme_group_id":"","matched_protocol_rule_ids":[],"candidate_protocol_rule_ids":[],"user_confirmation_applied":false,"confirmed_presence":null,"requirements":{},"quantity_per_cabinet":null,"mapping_reason":""}],"potential_conflicts":[],"warnings":[]}

