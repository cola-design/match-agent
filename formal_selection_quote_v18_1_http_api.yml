    - data:
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport io as _wio\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_CONTEXT_MAX = 5000000\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_loads(value):\n    if isinstance(value, (dict, list)):\n        return value\n    text = str(value or '').strip()\n    if text.startswith(_WIRE_PREFIX):\n        digest, body = text[len(_WIRE_PREFIX):].split(':', 1)\n        compressed = _wb64.b64decode(body, validate=True)\n        with _wgzip.GzipFile(fileobj=_wio.BytesIO(compressed)) as stream:\n            raw = stream.read(_CONTEXT_MAX + 1)\n        if len(raw) > _CONTEXT_MAX:\n            raise CapacityError('完整上下文超过本版5MB解码保护上限，请按柜号或回路分批')\n        if _whash.sha256(raw).hexdigest() != digest:\n            raise ValueError('上下文校验失败，内容可能不完整')\n        return _wjson.loads(raw.decode('utf-8'))\n    return _wjson.loads(text)\n\ndef plain_json(value):\n    return _wjson.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)\nimport base64\nimport gzip\nimport json\nimport re\nHEADERS = ['序号', '关联位置', '问题类型', '问题说明', '对后续的影响', '工程师确认/补充']\n\ndef safe(value):\n    text = '' if value is None else str(value).strip()\n    return \"'\" + text if text.startswith(('=', '+', '-', '@')) else text\n\ndef display_problem(value):\n    text = '' if value is None else str(value)\n    text = text.replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    return re.sub('[ \\\\t]*[；;][ \\\\t]*', '\\n', text)\n\ndef column_name(number):\n    result = ''\n    while number:\n        number, remainder = divmod(number - 1, 26)\n        result = chr(65 + remainder) + result\n    return result\n\ndef parse_rows(markdown):\n    rows, active = ([], False)\n    for line in str(markdown or '').splitlines():\n        heading = re.match('^\\\\s*##\\\\s+(.+?)\\\\s*$', line)\n        if heading:\n            active = heading.group(1).strip() == '资料问题确认'\n            continue\n        if not active or not line.strip().startswith('|'):\n\
          \            continue\n        fields = [part.replace('\\\\|', '|').strip() for part in re.split('(?<!\\\\\\\\)\\\\|', line.strip().strip('|'))]\n        if fields == HEADERS or all((re.fullmatch(':?-{3,}:?', x.replace(' ', '')) for x in fields)):\n            continue\n        if len(fields) == len(HEADERS):\n            rows.append(fields)\n    if len(rows) > 120:\n        raise CapacityError('确认单超过120行，请分批，不会仅保留前120行')\n    return rows\n\ndef _original_main(markdown: str, selection_request_json: str) -> dict:\n    rows = parse_rows(markdown)\n    if not rows:\n        raise ValueError('没有可写入问题确认单的问题行')\n    raw = gzip.compress((selection_request_json or '{}').encode('utf-8'), compresslevel=9, mtime=0)\n    payload_b64 = base64.b64encode(raw).decode('ascii')\n    chunks = [payload_b64[i:i + 24000] for i in range(0, len(payload_b64), 24000)]\n    if len(chunks) > 25:\n        raise ValueError('选型上下文过大，超过问题确认Excel的25段容量')\n    cells = {}\n    cells['资料问题确认!A130'] = 'FORM_TYPE'\n\
          \    cells['资料问题确认!B130'] = 'CLARIFICATION_CONFIRMATION'\n    cells['资料问题确认!A131'] = 'SCHEMA_VERSION'\n    cells['资料问题确认!B131'] = 'clarification-confirmation-v14.4'\n    for index, chunk in enumerate(chunks, 1):\n        cells['资料问题确认!A%d' % (131 + index)] = 'PAYLOAD_CHUNK_%03d' % index\n        cells['资料问题确认!B%d' % (131 + index)] = 'PAYLOAD_B64_PART_%03d:%s' % (index, chunk)\n    for row_number, row in enumerate(rows, 5):\n        for column, value in enumerate(row, 1):\n            if column in (4, 5):\n                value = display_problem(value)\n            if column == 6:\n                value = '【请工程师填写】'\n            cells['资料问题确认!%s%d' % (column_name(column), row_number)] = safe(value)\n    return {'payload_json': json.dumps({'cells': cells, 'output_filename': '选型前问题确认单_V14.8.1_动态框线版式'}, ensure_ascii=False), 'summary': '问题确认%d行，已写入文件类型和选型上下文' % len(rows)}\n\ndef main(markdown, selection_request_json):\n    try:\n        decoded = wire_loads(selection_request_json)\n\
          \        if isinstance(decoded, dict) and decoded.get('capacity_blocked'):\n            raise CapacityError(decoded.get('capacity_message') or '本次容量超限，请分批重新提交原始资料')\n        context = plain_json(decoded)\n        out = _original_main(markdown, context)\n        if len(out['payload_json'].encode('utf-8')) > 65000:\n            raise CapacityError('确认单内容超过65KB插件请求预算，请分批。本次未生成可提交的完整确认单。')\n        return out\n    except CapacityError as exc:\n        message = str(exc)\n        sheet = '资料问题确认'\n        cells = {sheet + '!A1': '本次输出容量超限，未生成完整确认单', sheet + '!A2': message, sheet + '!A130': 'FORM_TYPE', sheet + '!B130': 'CAPACITY_BLOCKED', '系统数据!A2': 'FORM_TYPE', '系统数据!B2': 'CAPACITY_BLOCKED'}\n        return {'payload_json': plain_json({'cells': cells, 'output_filename': '容量超限提示_请分批重新提交'}), 'summary': message}\n"
        code_language: python3
