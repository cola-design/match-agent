- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: wonendieee/generic_excel_template_filler:0.4.0@c8505d2c93171753828b3d15decd20de46b9229352da057a5598e2dd921c4e63
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: d9d99477-ae3d-416d-aa87-1d729b238601
    name: MONGODB_API_BASE_URL
    value_type: string
    value: ''
    description: 电脑临时测试填http://电脑IPv4:8000；服务器部署后只改此地址。末尾不加斜杠。
    selector:
    - env
    - MONGODB_API_BASE_URL
  - id: df00d21d-e594-48d6-9280-a393813cab55
    name: MONGODB_API_KEY
    value_type: secret
    value: ''
    description: API服务启动时的MONGODB_API_KEY，不是MongoDB密码。
    selector:
    - env
    - MONGODB_API_KEY
  features:
    file_upload:
      allowed_file_extensions:
      - .PDF
      - .pdf
      - .DOC
      - .doc
      - .DOCX
      - .docx
      - .XLSX
      - .xlsx
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '本系统只执行以下明确操作：


      1. 上传技术协议和CAD图纸PDF，输入：开始选型

      2. 更换资料后再次选型，输入：重新选型

      3. 上传已填写的选型前问题确认Excel，输入：提交问题确认

      4. 上传已填写的BOM人工确认Excel，输入：提交确认BOM


      问题确认表和BOM确认表不能混用。其他普通消息不会触发选型或报价。


      正式产品库仅使用 data_status=ACTIVE 且 source_status=有效的产品；正式价格库仅使用 status=ACTIVE 且处于有效期内的价格。


      V17：关键要求未明确时仅列候选；确认单保留版本和来源。文本PDF分段处理，扫描或图形内容不足时需要补充可读资料。

      '
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始选型
    - 重新选型
    - 提交问题确认
    - 提交确认BOM
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
