    - data:
        code: "import json\nimport re\nHEADERS = {'识别概况': ['项目', '内容'], '待处理问题': ['序号', '问题级别', '问题说明', '人工处理结果'], '已识别方案组': ['序号', '方案组', '方案名称', '进线数', '出线数', '表位', '主电流(A)', '防护等级', '单柜样例数', 'PDF证据']}\n\ndef main(markdown):\n    sections = {}\n    current = None\n    for line in str(markdown or '').splitlines():\n        found = re.match('^\\\\s*##\\\\s+(.+?)\\\\s*$', line)\n        if found:\n            current = found.group(1).strip()\n            if current not in HEADERS:\n                current = None\n            elif current in sections:\n                raise ValueError('重复章节：' + current)\n            else:\n                sections[current] = []\n            continue\n        if current is None or not line.strip().startswith('|'):\n            continue\n        fields = [part.replace('\\\\|', '|').strip() for part in re.split('(?<!\\\\\\\\)\\\\|', line.strip().strip('|'))]\n        if all((re.fullmatch(':?-{3,}:?', field.replace(' ', '')) for field in fields)):\n          \
          \  continue\n        expected = HEADERS[current]\n        if fields == expected:\n            continue\n        if len(fields) != len(expected):\n            raise ValueError('%s应有%d列，实际%d列：%s' % (current, len(expected), len(fields), line[:100]))\n        sections[current].append(fields)\n    if not sections.get('识别概况'):\n        sections['识别概况'] = [['识别结论', '未完整识别，本次未进入产品选型']]\n    if not sections.get('待处理问题'):\n        sections['待处理问题'] = [['—', '错误', '没有可读取的识别结果，请核对源文件', '']]\n    if not sections.get('已识别方案组'):\n        sections['已识别方案组'] = [['—', '未识别到有效方案', '需提供可读资料', '', '', '', '', '', '', '']]\n    for sheet, rows in list(sections.items()):\n        if len(rows) > 120:\n            text = '\\n'.join(('；'.join((str(v) for v in row)) for row in rows))\n            chunks = [text[i:i + 6000] for i in range(0, len(text), 6000)]\n            if len(chunks) > 120:\n                raise ValueError('问题报告超过模板容量，请按柜号拆分资料；未输出不完整BOM')\n            sections[sheet] = [[str(i + 1), '详细记录（合并展示）',\
          \ chunk, ''] if sheet == '待处理问题' else [chunk] + [''] * (len(HEADERS[sheet]) - 1) for i, chunk in enumerate(chunks)]\n    cells = {}\n    for sheet, rows in sections.items():\n        for row_number, row in enumerate(rows, 2):\n            for column, value in enumerate(row):\n                if value.startswith(('=', '+', '-', '@')):\n                    value = \"'\" + value\n                cells['%s!%s%d' % (sheet, chr(65 + column), row_number)] = value\n    return {'payload_json': json.dumps({'cells': cells}, ensure_ascii=False), 'summary': '；'.join(('%s%d行' % (name, len(rows)) for name, rows in sections.items()))}\n"
        code_language: python3
        desc: ''
        outputs:
          payload_json:
            children: null
            type: string
          summary:
            children: null
            type: string
