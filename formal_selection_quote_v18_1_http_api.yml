        code_language: python3
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport io as _wio\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_CONTEXT_MAX = 5000000\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_loads(value):\n    if isinstance(value, (dict, list)):\n        return value\n    text = str(value or '').strip()\n    if text.startswith(_WIRE_PREFIX):\n        digest, body = text[len(_WIRE_PREFIX):].split(':', 1)\n        compressed = _wb64.b64decode(body, validate=True)\n        with _wgzip.GzipFile(fileobj=_wio.BytesIO(compressed)) as stream:\n            raw = stream.read(_CONTEXT_MAX + 1)\n        if len(raw) > _CONTEXT_MAX:\n            raise CapacityError('完整上下文超过本版5MB解码保护上限，请按柜号或回路分批')\n        if _whash.sha256(raw).hexdigest() != digest:\n            raise ValueError('上下文校验失败，内容可能不完整')\n        return _wjson.loads(raw.decode('utf-8'))\n    return _wjson.loads(text)\n\ndef plain_json(value):\n    return _wjson.dumps(value, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)\nimport json\n\ndef make_advisory_batches(protocol_text, drawing_text, supplementary_notes=''):\n    protocol = wire_loads(protocol_text)\n    drawing = wire_loads(drawing_text)\n    rules = [{k: r.get(k) for k in ('rule_id', 'component_role', 'category', 'scope_type', 'applicable_protocol_scheme_ids', 'parameters', 'quantity_rule')} for r in protocol.get('component_rules', []) if isinstance(r, dict)]\n    rows = []\n    for group in drawing.get('scheme_groups', []):\n        for item in group.get('drawing_items', []):\n            rows.append(dict(item, scheme_group_id=group.get('scheme_group_id')))\n\n    def project(v):\n        if isinstance(v, list):\n            return [project(x) for x in v]\n        if isinstance(v, dict):\n            return {k: project(x) for k, x in v.items() if k not in ('evidence', 'source_evidence', 'raw_text')}\n        return v\n    chunks = []\n    problems = []\n    for start in range(0, len(rows), 8):\n        body =\
          \ {'advisory_id': 'A-%03d' % (len(chunks) + 1), 'component_items': project(rows[start:start + 8]), 'protocol_rule_catalog': rules, 'supplementary_notes': supplementary_notes}\n        if len(plain_json(body).encode()) > 54000:\n            body = {'advisory_id': body['advisory_id'], 'input_problem': '关联输入超过54KB预算，需按柜号拆分，未截断需求', 'component_items': []}\n            problems.append(body['input_problem'])\n        chunks.append(plain_json(body))\n    if not chunks:\n        chunks = [plain_json({'advisory_id': 'A-001', 'component_items': [], 'protocol_rule_catalog': rules})]\n    return {'chunks': chunks, 'manifest': plain_json({'ids': [json.loads(c)['advisory_id'] for c in chunks], 'errors': problems})}\n\ndef main(protocol_text, drawing_text, supplementary_notes=''):\n    return make_advisory_batches(protocol_text, drawing_text, supplementary_notes)\n"
