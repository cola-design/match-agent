        title: 校验语义关联批次完整性
        desc: 通用文本分段、完整性和来源校验；不包含临时物料或固定回路。
        code_language: python3
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_WIRE_MAX = 55000\n_CONTEXT_MAX = 5000000\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_pack(value):\n    raw = _wjson.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False).encode('utf-8')\n    if len(raw) > _CONTEXT_MAX:\n        raise CapacityError('完整上下文超过本版5MB保护上限，请按柜号或回路分批')\n    if len(raw) <= _WIRE_MAX:\n        return raw.decode('utf-8')\n    result = _WIRE_PREFIX + _whash.sha256(raw).hexdigest() + ':' + _wb64.b64encode(_wgzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii')\n    if len(result.encode('utf-8')) > _WIRE_MAX:\n        raise CapacityError('上下文无损压缩后仍超过传递预算，请按柜号或回路分批；本次不生成不完整BOM')\n    return result\nimport json\nimport re\n\ndef collect_advisories(results, manifest):\n    meta = json.loads(manifest)\n    expected = set(meta['ids'])\n    seen = set()\n    errors = list(meta['errors'])\n    rows\
          \ = []\n    warnings = []\n    conflicts = []\n    for raw in results if isinstance(results, list) else []:\n        try:\n            part = json.loads(re.sub('^```(?:json)?\\\\s*|\\\\s*```$', '', str(raw).strip(), flags=re.I))\n            aid = part.get('advisory_id')\n            if aid not in expected or aid in seen:\n                raise ValueError('关联批次编号缺失、错误或重复')\n            seen.add(aid)\n            if part.get('input_problem'):\n                errors.append(str(part['input_problem']))\n            values = part.get('component_requirements', [])\n            if not isinstance(values, list):\n                raise ValueError('关联需求不是数组')\n            rows.extend(values)\n            warnings.extend(part.get('warnings', []))\n            conflicts.extend(part.get('potential_conflicts', []))\n        except (ValueError, TypeError, AttributeError) as exc:\n            errors.append('语义关联批次输出错误：' + str(exc))\n    if expected - seen:\n        errors.append('语义关联批次缺失：' +\
          \ '、'.join(sorted(expected - seen)))\n    return {'text': wire_pack({'component_requirements': rows, 'warnings': warnings, 'potential_conflicts': conflicts, '_document_errors': errors})}\n\ndef main(results, manifest):\n    return collect_advisories(results, manifest)\n"
