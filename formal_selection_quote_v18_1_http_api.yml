        title: 核对并汇总：图纸事实
        desc: 通用文本分段、完整性和来源校验；不包含临时物料或固定回路。
        code_language: python3
        code: "import base64 as _wb64\nimport gzip as _wgzip\nimport hashlib as _whash\nimport io as _wio\nimport json as _wjson\n_WIRE_PREFIX = 'GZJSON1:'\n_WIRE_MAX = 55000\n_CONTEXT_MAX = 5000000\n\nclass CapacityError(ValueError):\n    pass\n\ndef wire_loads(value):\n    if isinstance(value, (dict, list)):\n        return value\n    text = str(value or '').strip()\n    if text.startswith(_WIRE_PREFIX):\n        digest, body = text[len(_WIRE_PREFIX):].split(':', 1)\n        compressed = _wb64.b64decode(body, validate=True)\n        with _wgzip.GzipFile(fileobj=_wio.BytesIO(compressed)) as stream:\n            raw = stream.read(_CONTEXT_MAX + 1)\n        if len(raw) > _CONTEXT_MAX:\n            raise CapacityError('完整上下文超过本版5MB解码保护上限，请按柜号或回路分批')\n        if _whash.sha256(raw).hexdigest() != digest:\n            raise ValueError('上下文校验失败，内容可能不完整')\n        return _wjson.loads(raw.decode('utf-8'))\n    return _wjson.loads(text)\n\ndef wire_pack(value):\n    raw = _wjson.dumps(value, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False).encode('utf-8')\n    if len(raw) > _CONTEXT_MAX:\n        raise CapacityError('完整上下文超过本版5MB保护上限，请按柜号或回路分批')\n    if len(raw) <= _WIRE_MAX:\n        return raw.decode('utf-8')\n    result = _WIRE_PREFIX + _whash.sha256(raw).hexdigest() + ':' + _wb64.b64encode(_wgzip.compress(raw, compresslevel=9, mtime=0)).decode('ascii')\n    if len(result.encode('utf-8')) > _WIRE_MAX:\n        raise CapacityError('上下文无损压缩后仍超过传递预算，请按柜号或回路分批；本次不生成不完整BOM')\n    return result\nimport copy\nimport hashlib\nimport json\nimport re\nimport unicodedata\n\ndef jdump(value):\n    return json.dumps(value, ensure_ascii=False, separators=(',', ':'), allow_nan=False)\n\ndef norm_source(value):\n    return re.sub('\\\\s+', '', ''.join((unicodedata.normalize('NFKC', ch) for ch in str(value or ''))))\n\ndef unfence(text):\n    return re.sub('^```(?:json)?\\\\s*|\\\\s*```$', '', str(text or '').strip(), flags=re.I)\n\ndef anchor_evidence(value, chunk, errors):\n    valid,\
          \ rejected = exact_citations(value, chunk)\n    if not valid:\n        if not list(citation_leaves(value)):\n            return {}\n        example = next((str(x.get('text')) for x in citation_leaves(value)), '')\n        errors.append(chunk['chunk_id']+'：来源原文未在当前文本段找到，不能用模型生成的原文作证据'\n                      + ('；未定位摘录：'+example if example else '；未返回原文摘录'))\n        return {}\n    first = copy.deepcopy(valid[0])\n    if len(valid) > 1:\n        first['sources'] = copy.deepcopy(valid)\n    if rejected:\n        # A model's prose summary is not promoted to source evidence. Preserve\n        # it for diagnosis while anchoring the independently valid quotations.\n        first['unmatched_summary_texts'] = rejected\n    return first\n\ndef stamp_sources(value, chunk, errors):\n    if isinstance(value, list):\n        return [stamp_sources(v, chunk, errors) for v in value]\n    if not isinstance(value, dict):\n        return value\n    out = {}\n    for key, child in value.items():\n \
          \       out[key] = anchor_evidence(child, chunk, errors) if key == 'evidence' else stamp_sources(child, chunk, errors)\n    return out\n\ndef combine_value(left, right, path, errors):\n    if left in (None, '', [], {}):\n        return copy.deepcopy(right)\n    if right in (None, '', [], {}):\n        return left\n    if path.endswith('.evidence') and isinstance(left, dict) and isinstance(right, dict):\n        if left == right:\n            return left\n        out = copy.deepcopy(left)\n        sources = out.get('sources') or [copy.deepcopy(left)]\n        if right not in sources:\n            sources.append(copy.deepcopy(right))\n        out['sources'] = sources\n        return out\n    if isinstance(left, dict) and isinstance(right, dict):\n        out = copy.deepcopy(left)\n        for k, v in right.items():\n            out[k] = combine_value(out.get(k), v, path + '.' + k, errors)\n        return out\n    if isinstance(left, list) and isinstance(right, list):\n\n        def\
          \ identity(v):\n            if isinstance(v, dict) and isinstance(v.get('evidence'), dict):\n                ev = v['evidence']\n                if ev.get('source_start') is not None and ev.get('source_end') is not None:\n                    body = {k: x for k, x in v.items() if k not in ('item_id', 'evidence')}\n                    return jdump([body, ev.get('document_hash'), ev['source_start'], ev['source_end']])\n            return jdump(v)\n        result = copy.deepcopy(left)\n        seen = {identity(v) for v in result}\n        for v in right:\n            sig = identity(v)\n            if sig not in seen:\n                result.append(copy.deepcopy(v))\n                seen.add(sig)\n        return result\n    if left == right:\n        return left\n    errors.append('跨段同一对象字段矛盾：' + path + '；保留来源，需确认，不能静默取后一个值')\n    return left\n\ndef stable_key(value):\n    return hashlib.sha256(str(value).encode()).hexdigest()[:16]\n\ndef collect_document(results, chunks, manifest):\n\
          \    \"\"\"Collect every expected result by ID, never by optimistic zip/truncation.\"\"\"\n    meta = json.loads(manifest)\n    kind = meta['kind']\n    source = [json.loads(c) for c in chunks]\n    byid = {c['chunk_id']: c for c in source}\n    errors = []\n    parts = {}\n    if meta.get('input_problem'):\n        errors.append(meta['input_problem'])\n    if not isinstance(results, list):\n        results = []\n        errors.append('分段结果不是数组')\n    for value in results:\n        try:\n            part = json.loads(unfence(value)) if isinstance(value, str) else value\n            if not isinstance(part, dict):\n                raise ValueError('非对象')\n            cid = part.get('chunk_id')\n            if cid not in byid:\n                raise ValueError('结果缺少合法chunk_id或关联了其他资料')\n            if cid in parts:\n                raise ValueError('同一文本段重复返回')\n            if part.get('document_hash') != meta['document_hash']:\n                raise ValueError('文档标识不一致')\n      \
          \      for key in ('project_requirements', 'drawing_info'):\n                if key in part and (not isinstance(part[key], dict)):\n                    errors.append(cid + '：' + key + '必须为对象')\n                    part[key] = {}\n            for key in ('component_rules', 'warnings'):\n                if key in part and (not isinstance(part[key], list)):\n                    errors.append(cid + '：' + key + '必须为数组')\n                    part[key] = []\n            if kind == 'DRAWING' and part.get('fragment_status') != 'NO_RELEVANT_CONTENT' and (part.get('recognition_status') not in ('READABLE', 'READY')):\n                errors.append(cid + '：图纸段未明确完整可读')\n            if part.get('fragment_status') not in ('COMPLETE', 'NO_RELEVANT_CONTENT'):\n                errors.append(cid + '：模型报告本段未完整提取，需复核')\n            if part.get('fragment_status') == 'NO_RELEVANT_CONTENT' and any((part.get(k) for k in ('scheme_groups', 'component_rules'))):\n                errors.append(cid + '：声明无相关内容但同时返回了工程对象')\n\
          \            if part.get('_binding_error'):\n                errors.append(cid + '：' + str(part['_binding_error']))\n            parts[cid] = stamp_sources(part, byid[cid], errors)\n        except (ValueError, TypeError) as exc:\n            errors.append('分段结果格式或关联错误：' + str(exc))\n    missing = set(byid) - set(parts)\n    if missing:\n        errors.append('缺少文本段结果：' + '、'.join(sorted(missing)))\n    project = {}\n    groups = {}\n    rules = []\n    warnings = []\n    drawing_info = {}\n    drawing_sheets = []\n    rule_seen = set()\n    all_raw = ''.join((c['text'] for c in source))\n    for cid in byid:\n        part = parts.get(cid, {})\n        project = combine_value(project, part.get('project_requirements', {}), '项目参数', errors)\n        info = part.get('drawing_info', {})\n        if info and info not in drawing_sheets:\n            drawing_sheets.append(copy.deepcopy(info))\n        if info:\n            if not drawing_info:\n                drawing_info = copy.deepcopy(info)\n\
          \            else:\n                drawing_info = {k: v for k, v in drawing_info.items() if v == info.get(k)}\n        warnings.extend(part.get('warnings', []) if isinstance(part.get('warnings'), list) else [])\n        local_ids = {}\n        group_rows = part.get('scheme_groups', [])\n        if not isinstance(group_rows, list):\n            errors.append(cid + '：方案列表类型错误')\n            group_rows = []\n        for seq, group in enumerate(group_rows, 1):\n            if not isinstance(group, dict):\n                errors.append(cid + '：方案格式错误')\n                continue\n            group = copy.deepcopy(group)\n            oldid = group.get('protocol_scheme_id') if kind == 'PROTOCOL' else group.get('scheme_group_id')\n            if kind == 'DRAWING':\n                for key2 in ('circuits', 'shown_bom', 'drawing_items', 'auxiliary_materials', 'wire_requirements', 'external_cable_requirements'):\n                    if key2 in group and (not isinstance(group[key2], list)):\n\
          \                        errors.append(cid + '：' + key2 + '必须为数组')\n                        group[key2] = []\n                for circuit in group.get('circuits', []):\n                    if not isinstance(circuit, dict):\n                        continue\n                    circuitkey = str(circuit.pop('source_circuit_key', '') or '')\n                    if circuitkey and norm_source(circuitkey) in norm_source(all_raw):\n                        circuit['circuit_id'] = 'C-' + stable_key(circuitkey)\n                    else:\n                        circuit['circuit_id'] = cid + ':' + str(circuit.get('circuit_id') or 'UNNAMED')\n                    if not isinstance(circuit.get('components', []), list):\n                        errors.append(cid + '：回路元件必须为数组')\n                        circuit['components'] = []\n                    for item in circuit.get('components', []):\n                        if isinstance(item, dict):\n                            item['circuit_id'] =\
          \ circuit['circuit_id']\n            natural = str(group.pop('source_scheme_key', '') or '').strip()\n            global_scope = natural == '__PROJECT__'\n            if natural and (not global_scope) and (norm_source(natural) not in norm_source(all_raw)):\n                errors.append(cid + '：方案关联键没有原文依据')\n                natural = ''\n            if global_scope and len(group_rows) > 1:\n                errors.append(cid + '：多方案不能同时使用全项目默认关联键')\n            key = natural if natural else cid + ':' + str(oldid or seq)\n            gid = ('P-' if kind == 'PROTOCOL' else 'D-') + stable_key(key)\n            local_ids[str(oldid or '')] = gid\n            group['protocol_scheme_id' if kind == 'PROTOCOL' else 'scheme_group_id'] = gid\n            if global_scope:\n                group['scope_basis'] = 'GLOBAL_PROTOCOL' if kind == 'PROTOCOL' else 'DOCUMENT_DEFAULT'\n            if not group.get('evidence'):\n                errors.append(cid + '：方案缺少可定位原文证据')\n            if gid not\
          \ in groups:\n                groups[gid] = group\n            else:\n                target = groups[gid]\n                for key2, val in group.items():\n                    if key2 == 'circuits':\n                        cmap = {str(c.get('circuit_id')): c for c in target.get('circuits', []) if isinstance(c, dict)}\n                        for circuit in val if isinstance(val, list) else []:\n                            if not isinstance(circuit, dict):\n                                errors.append('回路结构错误')\n                                continue\n                            ck = str(circuit.get('circuit_id') or cid + ':' + str(len(cmap)))\n                            cmap[ck] = combine_value(cmap.get(ck), circuit, gid + '.' + ck, errors)\n                        target['circuits'] = list(cmap.values())\n                    elif key2 == 'evidence':\n                        ev = target.get('evidence') or {}\n                        other = group.get('evidence') or {}\n \
          \                       if ev and other and (ev != other):\n                            ev = copy.deepcopy(ev)\n                            ev['sources'] = (ev.get('sources') or [target['evidence']]) + [other]\n                        target[key2] = ev or other\n                    else:\n                        target[key2] = combine_value(target.get(key2), val, gid + '.' + key2, errors)\n        for rule in part.get('component_rules', []) if isinstance(part.get('component_rules'), list) else []:\n            if not isinstance(rule, dict):\n                errors.append(cid + '：规则格式错误')\n                continue\n            rule = copy.deepcopy(rule)\n            mapped = []\n            for ident in rule.get('applicable_protocol_scheme_ids', []):\n                if str(ident) in local_ids:\n                    mapped.append(local_ids[str(ident)])\n                else:\n                    errors.append(cid + '：条款引用了本段未声明的方案，需明确条款范围')\n            rule['applicable_protocol_scheme_ids']\
          \ = mapped\n            if not rule.get('evidence'):\n                errors.append(cid + '：元器件规则缺少原文证据')\n            identity = {k: v for k, v in rule.items() if k not in ('rule_id', 'evidence')}\n            sig = jdump(identity)\n            if sig in rule_seen:\n                continue\n            rule_seen.add(sig)\n            rule['rule_id'] = 'R-' + stable_key(sig)\n            rules.append(rule)\n    output = {'schema_version': 'protocol-v3' if kind == 'PROTOCOL' else 'drawing-pdf-text-v3', 'scheme_groups': list(groups.values()), 'warnings': warnings, '_document_errors': list(dict.fromkeys(errors)), 'source_manifest': {'document_hash': meta['document_hash'], 'expected_chunks': len(byid), 'received_chunks': len(parts), 'character_count': meta['character_count'], 'complete': not errors}}\n    if kind == 'PROTOCOL':\n        output.update(project_requirements=project, component_rules=rules, document_type='technical_agreement')\n    else:\n        output.update(drawing_info=drawing_info,\
          \ drawing_sheets=drawing_sheets, recognition_status='PARTIAL' if errors else 'READABLE')\n    return {'text': wire_pack(output), 'fragment_summary': '%s资料：%d段，返回%d段，来源或结构问题%d项' % (kind, len(byid), len(parts), len(errors))}\n\ndef main(results, chunks, manifest):\n    out = collect_document(results, chunks, manifest)\n    document = preserve_document_facts(wire_loads(out['text']), 'DRAWING', source_from_chunks(chunks))\n    if document.get('_document_errors'):\n        document.setdefault('source_manifest', {})['complete'] = False\n    out['text'] = wire_pack(document)\n    return out\nimport math\n\ndef fact_text(value):\n    return unicodedata.normalize('NFKC', str(value or '')).replace('\\r', '')\n\ndef fact_key(value):\n    return re.sub('\\\\s+', '', fact_text(value)).casefold().replace('×', 'x')\n\ndef evidence_leaves(value):\n    out = []\n    if isinstance(value, list):\n        for child in value:\n            out.extend(evidence_leaves(child))\n    elif isinstance(value,\
          \ dict):\n        if value.get('text'):\n            out.append({k: copy.deepcopy(value[k]) for k in ('text', 'document_hash', 'chunk_id', 'source_verified', 'source_start', 'source_end', 'source_spans', 'page_index', 'location') if k in value})\n        else:\n            for child in value.values():\n                if isinstance(child, (dict, list)):\n                    out.extend(evidence_leaves(child))\n        for child in value.get('sources', []) if isinstance(value.get('sources'), list) else []:\n            out.extend(evidence_leaves(child))\n    unique = []\n    seen = set()\n    for row in out:\n        key = json.dumps(row, ensure_ascii=False, sort_keys=True)\n        if key not in seen:\n            seen.add(key)\n            unique.append(row)\n    return unique\n\ndef is_anchored(ev):\n    return ev.get('source_verified') is True and bool(ev.get('document_hash')) and bool(ev.get('chunk_id'))\n\ndef source_rows(evidence, raw_text=''):\n    \"\"\"Expand a verified\
          \ citation only to its own source line, never a document scan.\"\"\"\n    raw = str(raw_text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    digest = hashlib.sha256(raw.encode()).hexdigest() if raw else ''\n    rows = []\n    for ev in evidence_leaves(evidence):\n        if not is_anchored(ev):\n            continue\n        for line in str(ev['text']).replace('\\\\n', '\\n').splitlines():\n            if line.strip():\n                rows.append((line.strip(), ev))\n        spans = ev.get('source_spans') or ([[ev['source_start'], ev['source_end']]] if isinstance(ev.get('source_start'), int) and isinstance(ev.get('source_end'), int) else [])\n        if raw and digest == ev.get('document_hash'):\n            for span in spans:\n                if not isinstance(span, (list, tuple)) or len(span) != 2:\n                    continue\n                start, end = span\n                if not isinstance(start, int) or not isinstance(end, int) or (not 0 <= start < end <=\
          \ len(raw)):\n                    continue\n                if '\\n' in raw[start:end]:\n                    continue\n                a = raw.rfind('\\n', 0, start) + 1\n                b = raw.find('\\n', end)\n                if b < 0:\n                    b = len(raw)\n                row = raw[a:b].strip()\n                expanded = dict(ev, text=row, source_start=a, source_end=b, source_spans=[[a, b]])\n                if row:\n                    rows.append((row, expanded))\n    return rows\n\ndef item_source_clause(line, model, symbol, role):\n    \"\"\"Select a clause with an explicit item identity; same-model peers stay separate.\"\"\"\n    text = fact_text(line)\n    model = fact_text(model).strip()\n    symbol = fact_text(symbol).strip()\n    clauses = re.split('[;；\\\\n]', text)\n    selected = []\n    for clause in clauses:\n        if re.search('例如|示例|举例|推荐示意|可选型号', clause):\n            continue\n        if model and fact_key(model) not in fact_key(clause):\n\
          \            continue\n        if not model:\n            if not symbol or not re.search('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I):\n                continue\n            if role and fact_key(role) not in fact_key(clause):\n                continue\n        if model and fact_key(clause).count(fact_key(model)) > 1:\n            if not symbol:\n                continue\n            hits = list(re.finditer('(?<![A-Za-z0-9_-])' + re.escape(symbol) + '(?![A-Za-z0-9_-])', clause, re.I))\n            if len(hits) != 1:\n                continue\n            tail = clause[hits[0].start():]\n            next_position = re.search('\\\\s+[A-Za-z][A-Za-z0-9_-]*\\\\s*[=:：]', tail[len(symbol):])\n            clause = tail[:len(symbol) + next_position.start()] if next_position else tail\n            if fact_key(clause).count(fact_key(model)) != 1:\n                continue\n        if symbol:\n            label = re.match('\\\\s*([A-Za-z][A-Za-z0-9_-]*)\\\\\
          s*[=:：]', clause)\n            if label and label.group(1).casefold() != symbol.casefold():\n                continue\n        clause = re.sub('(?:不允许|不得|禁止|不能|不采用|不选用|不使用|排除|不含)[^;；。\\\\n,，]*', '', clause)\n        if clause.strip():\n            selected.append(clause.strip())\n    return selected\n\ndef explicit_item_facts(clause, role=''):\n    \"\"\"Small, transparent grammar; unrecognized prose remains in source evidence.\"\"\"\n    text = fact_text(clause)\n    facts = []\n\n    def put(field, value):\n        if isinstance(value, float) and value.is_integer():\n            value = int(value)\n        pair = (field, value)\n        if pair not in facts:\n            facts.append(pair)\n    if '断路器' in str(role) or 'MCB' in str(role).upper():\n        for m in re.finditer('(?<![A-Z0-9])([BCD])\\\\s*(\\\\d{1,3})(?:\\\\s*A)?(?![A-Z0-9])', text, re.I):\n            put('trip_curve', m.group(1).upper())\n            put('rated_current_a', int(m.group(2)))\n        for m in re.finditer('(?:脱扣(?:特性|曲线)\\\
          \\s*[:：=为]?\\\\s*([BCD])|(?<![A-Z0-9])([BCD])\\\\s*型脱扣)', text, re.I):\n            put('trip_curve', next((x for x in m.groups() if x)).upper())\n    for m in re.finditer('(?<![A-Za-z0-9])([1-5])\\\\s*P\\\\s*(\\\\+\\\\s*N)?(?![A-Za-z0-9])', text, re.I):\n        put('pole_count', m.group(1) + 'P' + ('+N' if m.group(2) else ''))\n    patterns = [('continuous_operating_voltage_v', '(?:\\\\bUc|最大持续(?:工作|运行)电压)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\\b'), ('max_discharge_current_ka', '(?:\\\\bImax|最大放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA|A)\\\\b'), ('nominal_discharge_current_ka', '(?:\\\\bIn|标称放电电流)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\b'), ('breaking_capacity_ka', '(?:分断能力|\\\\bIcn|\\\\bIcu)\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kA)\\\\b'), ('rated_current_a', '额定电流\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(A)\\\\b'), ('rated_voltage_v', '额定(?:工作)?电压\\\\s*[:：=为]?\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V)\\\
          \\b'), ('control_voltage', '(?:线圈电压|控制电压)\\\\s*[:：=为]?\\\\s*((?:AC|DC)\\\\s*\\\\d+(?:\\\\.\\\\d+)?\\\\s*V)\\\\b')]\n    for field, pattern in patterns:\n        for m in re.finditer(pattern, text, re.I):\n            if field == 'control_voltage':\n                put(field, re.sub('\\\\s+', '', m.group(1)).upper())\n                continue\n            number = float(m.group(1))\n            unit = m.group(2).lower()\n            if field.endswith('_v') and unit == 'kv':\n                number *= 1000\n            if field.endswith('_ka') and unit == 'a':\n                number /= 1000\n            put(field, number)\n    return facts\n\ndef normalize_fact_value(field, value):\n    if field in ('trip_curve', 'pole_count', 'control_voltage'):\n        return re.sub('\\\\s+', '', fact_text(value)).upper()\n    if isinstance(value, bool):\n        return ('invalid', str(value))\n    m = re.fullmatch('\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*(kV|V|kA|A)?\\\\s*', str(value), re.I)\n\
          \    if not m:\n        return ('text', fact_key(value))\n    number = float(m.group(1))\n    unit = (m.group(2) or '').lower()\n    if field.endswith('_v') and unit == 'kv':\n        number *= 1000\n    elif field.endswith('_ka') and unit == 'a':\n        number /= 1000\n    elif unit and unit not in (('v', 'kv') if field.endswith('_v') else ('a', 'ka')):\n        return ('invalid', str(value))\n    return number\n\ndef recover_item_facts(item, parameter_key, raw_text='', extra_evidence=None):\n    params = item.setdefault(parameter_key, {})\n    if not isinstance(params, dict):\n        return ['物料参数不是对象，无法核对来源']\n    model = item.get('shown_model') or next((params[k] for k in ('model', 'required_model', 'designated_model', 'specified_model') if params.get(k)), '')\n    symbol = item.get('symbol') or params.get('bit_number') or params.get('symbol') or ''\n    role = str(item.get('component_role') or item.get('category') or '')\n    ledger = list(item.get('parameter_facts') or\
          \ [])\n    values = {}\n    errors = []\n    evidence = [item.get('evidence'), extra_evidence]\n    for line, ev in source_rows(evidence, raw_text):\n        for clause in item_source_clause(line, model, symbol, role):\n            for field, value in explicit_item_facts(clause, role):\n                proof = {k: copy.deepcopy(ev[k]) for k in ('document_hash', 'chunk_id', 'source_verified', 'source_start', 'source_end', 'source_spans', 'page_index', 'location') if k in ev}\n                fact = {'field': field, 'value': value, 'source_text': clause, 'source': proof}\n                if fact not in ledger:\n                    ledger.append(fact)\n                values.setdefault(field, [])\n                if value not in values[field]:\n                    values[field].append(value)\n    for field, found in values.items():\n        if len({str(normalize_fact_value(field, v)) for v in found}) != 1:\n            errors.append('当前物料原文的' + field + '存在不同值：' + str(found))\n   \
          \         continue\n        value = found[0]\n        if params.get(field) in (None, '', [], {}):\n            params[field] = value\n        elif normalize_fact_value(field, params[field]) != normalize_fact_value(field, value):\n            errors.append('模型参数' + field + '=' + str(params[field]) + '与当前物料原文' + str(value) + '不一致')\n    if ledger:\n        item['parameter_facts'] = ledger\n    return errors\n\ndef preserve_document_facts(document, kind, raw_text=''):\n    if not isinstance(document, dict):\n        return {'scheme_groups': [], '_document_errors': ['提取结果不是JSON对象，不能作为工程资料']}\n    document = copy.deepcopy(document)\n    errors = document.setdefault('_document_errors', [])\n    if not isinstance(errors, list):\n        errors = ['来源错误列表格式异常，需检查提取结果']\n        document['_document_errors'] = errors\n\n    def finite(value, path):\n        if isinstance(value, float) and (not math.isfinite(value)):\n            message = '来源字段含非有限数值：' + path\n            if message not\
          \ in errors:\n                errors.append(message)\n            return str(value)\n        if isinstance(value, dict):\n            return {key: finite(child, path + '.' + str(key)) for key, child in value.items()}\n        if isinstance(value, list):\n            return [finite(child, path + '[' + str(index) + ']') for index, child in enumerate(value)]\n        return value\n    document = finite(document, kind)\n    document['_document_errors'] = errors\n    if kind == 'PROTOCOL':\n        for rule in document.get('component_rules', []) if isinstance(document.get('component_rules'), list) else []:\n            if not isinstance(rule, dict):\n                continue\n            for error in recover_item_facts(rule, 'parameters', raw_text):\n                message = str(rule.get('rule_id') or '') + ' ' + str(rule.get('component_role') or '') + '：' + error\n                if message not in errors:\n                    errors.append(message)\n    else:\n        for group in\
          \ document.get('scheme_groups', []) if isinstance(document.get('scheme_groups'), list) else []:\n            if not isinstance(group, dict):\n                continue\n            seen = set()\n            for circuit in group.get('circuits', []) if isinstance(group.get('circuits'), list) else []:\n                if not isinstance(circuit, dict):\n                    continue\n                for item in circuit.get('components', []) if isinstance(circuit.get('components'), list) else []:\n                    if not isinstance(item, dict):\n                        continue\n                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text, circuit.get('evidence')):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n            for key in ('drawing_items', 'shown_bom', 'auxiliary_materials',\
          \ 'wire_requirements'):\n                for item in group.get(key, []) if isinstance(group.get(key), list) else []:\n                    if not isinstance(item, dict) or id(item) in seen:\n                        continue\n                    seen.add(id(item))\n                    for error in recover_item_facts(item, 'shown_parameters', raw_text):\n                        message = str(item.get('item_id') or '') + '：' + error\n                        if message not in errors:\n                            errors.append(message)\n    return document\n\ndef source_from_chunks(chunks):\n    pieces = [json.loads(v) if isinstance(v, str) else v for v in chunks]\n    pieces = sorted((p for p in pieces if isinstance(p, dict)), key=lambda p: p.get('start', 0))\n    raw = ''\n    for piece in pieces:\n        start = piece.get('start')\n        text = str(piece.get('text') or '')\n        if not isinstance(start, int) or start < 0 or start > len(raw):\n            return ''\n        overlap\
          \ = len(raw) - start\n        if overlap > 0 and raw[start:] != text[:overlap]:\n            return ''\n        raw += text[overlap:]\n    return raw\n\ndef source_norm(value):\n    return re.sub(r'\\s+', '', ''.join(unicodedata.normalize('NFKC', c) for c in str(value or '')))\ndef citation_leaves(value):\n    if isinstance(value, list):\n        for child in value:\n            yield from citation_leaves(child)\n    elif isinstance(value, dict):\n        if str(value.get('text') or '').strip():\n            yield {k: copy.deepcopy(v) for k, v in value.items() if k != 'sources'}\n        if isinstance(value.get('sources'), list):\n            for child in value['sources']:\n                yield from citation_leaves(child)\ndef exact_citations(value, chunk):\n    \"\"\"Return only quotes actually present in this exact, current chunk.\"\"\"\n    text = chunk['text']\n    hay = source_norm(text)\n    index = []\n    for i, char in enumerate(text):\n        index.extend(i for c in\
          \ unicodedata.normalize('NFKC', char) if not c.isspace())\n    valid, rejected, seen = [], [], set()\n    for leaf in citation_leaves(value):\n        needle = source_norm(leaf['text'])\n        if not needle or needle not in hay:\n            rejected.append(leaf['text'])\n            continue\n        if needle in seen:\n            continue\n        seen.add(needle)\n        spans = [[chunk['start'] + index[h.start()], chunk['start'] + index[h.end()-1]+1]\n                 for h in re.finditer(re.escape(needle), hay)]\n        anchored = dict(leaf, chunk_id=chunk['chunk_id'], document_hash=chunk['document_hash'],\n                        source_verified=True, chunk_start=chunk['start'], chunk_end=chunk['end'],\n                        source_spans=spans, page_index=None)\n        anchored.pop('source_start', None)\n        anchored.pop('source_end', None)\n        if len(spans) == 1:\n            anchored.update(source_start=spans[0][0], source_end=spans[0][1])\n        valid.append(anchored)\n\
          \    return valid, rejected"
