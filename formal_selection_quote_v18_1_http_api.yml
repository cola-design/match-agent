          \                requirements['rated_voltage_v'] = None\n        for key in ('nominal_discharge_current_ka', 'max_discharge_current_ka', 'test_class'):\n            found = [p[key] for p in [drawing] + parameters if p.get(key) not in (None, '')]\n            variants = {identity_spec(v).replace('类', '') for v in found}\n            if len(variants) > 1:\n                add_issue(issues, 'BLOCKER', '同一器件协议与图纸的' + key + '不同，需确认变更依据', row.get('scheme_group_id'), row.get('request_id'), stage='技术参数冲突', blocks_retrieval=True)\n            elif found:\n                requirements[key] = found[0]\n        text = clean(row.get('drawing_parameters')) + ' ' + clean(row.get('protocol_parameters'))\n        for rid in row.get('matched_protocol_rule_ids', []):\n            text += ' ' + clean(rules.get(rid, {}).get('parameters'))\n        if re.search('无附加触点|无辅助触点|不带(?:OF\\\\d*|辅助触点)|禁止(?:附加|辅助)触点', text, re.I):\n            requirements['forbidden_accessories'] = ['辅助触点']\n\ndef run_semantic_contract(previous,\
          \ llm_text, protocol_text='', drawing_text='', supplementary_notes='', raw_protocol_text=''):\n    try:\n        protocol, drawing, notes = normalize_source_contract(parse_object(protocol_text), parse_object(drawing_text))\n        out = previous(llm_text, wire_pack(protocol), wire_pack(drawing), supplementary_notes, raw_protocol_text)\n    except (ValueError, TypeError):\n        return previous(llm_text, protocol_text, drawing_text, supplementary_notes, raw_protocol_text)\n    payload = wire_loads(out['selection_request_json'])\n    if payload.get('capacity_blocked'):\n        return out\n    issues = payload.get('issues', [])\n    preserve_auxiliary_constraints(payload, issues)\n    for note in notes:\n        add_issue(issues, 'BLOCKER', note, stage='字段语义冲突', blocks_retrieval=True)\n    quantity_facts = []\n    for group in payload.get('protocol_scheme_groups', []):\n        if num(group.get('cabinet_quantity')) is not None:\n            quantity_facts.append({'source': 'PROTOCOL',\
          \ 'protocol_scheme_id': group.get('protocol_scheme_id'), 'quantity': group['cabinet_quantity'], 'basis': group.get('cabinet_quantity_basis', 'PROJECT'), 'evidence': group.get('evidence')})\n    payload['quantity_facts'] = quantity_facts\n    if drawing.get('drawing_validation_status') not in (None, '', 'VALID'):\n        add_issue(issues, 'BLOCKER', '图纸前置校验未通过，停止产品选型；请先处理图纸识别问题', stage='图纸前置校验', blocks_retrieval=True)\n    blocked_groups = {x.get('scheme_group_id') for x in payload.get('scheme_selections', []) if x.get('match_status') != 'UNIQUE'}\n    if quantity_facts:\n        for issue in issues:\n            if issue.get('stage') == '计量口径' and issue.get('scheme_group_id') in blocked_groups:\n                issue['message'] = '协议已提取柜数事实，但当前配置尚未唯一关联；先处理方案差异，不应要求重复补填资料中已有的柜数。'\n    out = publish_checked_output(out, payload, issues)\n    return transport_requirement_arrays(out)\n\ndef main__v16_before_1(llm_text, protocol_text='', drawing_text='', supplementary_notes='', raw_protocol_text=''):\n\
          \    return run_semantic_contract(_semantic_base_main, llm_text, protocol_text, drawing_text, supplementary_notes, raw_protocol_text)\n\ndef compare_extension(left, right):\n    \"\"\"Only call typed values incompatible; prose needs semantic/human review.\"\"\"\n    if isinstance(left, (int, float, bool)) and isinstance(right, (int, float, bool)):\n        return 'SAME' if left == right else 'CONFLICT'\n\n    def atom(v):\n        m = re.fullmatch('\\\\s*(AC|DC)?\\\\s*([0-9]+(?:\\\\.[0-9]+)?)\\\\s*(kV|V|mA|kA|A|Hz|kW|W|mm²|mm2|mm|cm|m)\\\\s*', str(v), re.I)\n        if not m:\n            return None\n        unit = m.group(3).lower()\n        family, scale = {'kv': ('V', 1000), 'v': ('V', 1), 'ma': ('A', 0.001), 'ka': ('A', 1000), 'a': ('A', 1), 'hz': ('Hz', 1), 'kw': ('W', 1000), 'w': ('W', 1), 'mm': ('mm', 1), 'cm': ('mm', 10), 'm': ('mm', 1000), 'mm²': ('mm2', 1), 'mm2': ('mm2', 1)}[unit]\n        return ((m.group(1) or '').upper(), float(m.group(2)) * scale, family)\n    a,\
          \ b = (atom(left), atom(right))\n    if a and b:\n        same = a[2] == b[2] and abs(a[1] - b[1]) < 1e-09 and (not a[0] or not b[0] or a[0] == b[0])\n        return 'SAME' if same else 'CONFLICT'\n    return 'TEXT'\n\ndef generic_item_kind(item):\n    if not isinstance(item, dict):\n        return 'other'\n    text = ' '.join((str(item.get(k) or '') for k in ('component_role', 'category', 'functional_position')))\n    if re.search('后备保护|后备断路|浪涌前级|防雷前级|surge.*backup', text, re.I):\n        return 'surge_backup'\n    if re.search('电涌保护|浪涌保护|surge protective', text, re.I):\n        return 'surge'\n    if '自动重合闸' in text or '重合闸保护' in text:\n        return 'recloser'\n    if '隔离开关' in text:\n        return 'isolator'\n    if '漏电' in text:\n        return 'leakage'\n    if '塑壳断路器' in text:\n        return 'main_breaker'\n    if '小型断路器' in text or '微型断路器' in text:\n        return 'branch_breaker'\n    if '断路器' in text:\n        return 'generic_breaker'\n    if '计量安装位' in text or '电能表安装位'\
          \ in text or '仅预留表位' in text:\n        return 'metering_space'\n    if '电能表' in text:\n        return 'meter'\n    if '接地排' in text or 'PE排' in text:\n        return 'pe_bar'\n    if '零线排' in text:\n        return 'neutral_bar'\n    if '箱内导线' in text or '铜排' in text:\n        return 'internal_conductor'\n    if '接线端子' in text:\n        return 'terminal'\n    if '防水接头' in text:\n        return 'gland'\n    if '门锁' in text or '铰链' in text:\n        return 'hardware'\n    if '铭牌' in text or '标识' in text:\n        return 'label'\n    return 'other'\nitem_kind = generic_item_kind\n_v16_requirement_base = main__v16_before_1\n\ndef _v163_root_base(llm_text, protocol_text='', drawing_text='', supplementary_notes='', raw_protocol_text=''):\n    out = _v16_requirement_base(llm_text, protocol_text, drawing_text, supplementary_notes, raw_protocol_text)\n    payload = wire_loads(out['selection_request_json'])\n    if payload.get('capacity_blocked'):\n        return out\n    issues = payload.get('issues',\
          \ [])\n    for label, text in [('协议', protocol_text), ('图纸', drawing_text), ('语义关联', llm_text)]:\n        source = parse_object(text)\n        for problem in source.get('_document_errors', []):\n            add_issue(issues, 'BLOCKER', label + '来源或处理不完整：' + str(problem), stage='来源完整性', blocks_retrieval=True)\n    rules = {r.get('rule_id'): r for r in payload.get('component_rules', []) if isinstance(r, dict)}\n    for row in payload.get('component_requirements', []):\n        if row.get('handling_mode') in ('EXCLUDED', 'SPACE_ONLY'):\n            continue\n        requirements = row.setdefault('requirements', {})\n        parameters = [row.get('drawing_parameters', {})] + [rules[r].get('parameters', {}) for r in row.get('matched_protocol_rule_ids', []) if r in rules]\n        existing_keys = set(requirements)\n        for parameter in parameters:\n            if not isinstance(parameter, dict):\n                continue\n            for key, value in parameter.items():\n       \
          \         if key not in requirements and value not in (None, '', [], {}):\n                    requirements[key] = copy.deepcopy(value)\n                elif key not in existing_keys and value not in (None, '', [], {}) and (requirements.get(key) not in (None, '', [], {})) and (identity_spec(requirements[key]) != identity_spec(value)):\n                    left, right = (identity_spec(requirements[key]), identity_spec(value))\n                    comparison = compare_extension(requirements[key], value)\n                    if comparison == 'SAME':\n                        pass\n                    elif comparison == 'TEXT' and left in right:\n                        requirements[key] = copy.deepcopy(value)\n                    elif comparison == 'TEXT' and right in left:\n                        pass\n                    else:\n                        incompatible = comparison == 'CONFLICT'\n                        message = '扩展参数来源有差异：' + str(key) + '，图纸/前序值=' + clean(requirements[key])\
          \ + '，协议/后序值=' + clean(value)\n                        add_issue(issues, 'BLOCKER' if incompatible else 'WARNING', message, row.get('scheme_group_id'), row.get('request_id'), stage='扩展参数冲突' if incompatible else '扩展描述复核', blocks_retrieval=incompatible)\n                        if not incompatible:\n                            requirements[key] = [requirements[key], copy.deepcopy(value)]\n        if num(row.get('quantity')) is not None and num(row['quantity']) > 0:\n            row['handling_mode'] = 'PRODUCT_SELECTION'\n            row['retrieval_required'] = True\n        if not clean(row.get('unit')):\n            add_issue(issues, 'BLOCKER', '物料缺少计量单位', row.get('scheme_group_id'), row.get('request_id'), stage='数量单位', blocks_retrieval=True)\n    payload['retrieval_requirements'] = [r for r in payload.get('component_requirements', []) if r.get('retrieval_required')]\n    out = publish_checked_output(out, payload, issues)\n    return transport_requirement_arrays(out)\n\ndef parameter_token(value):\n\
          \    return re.sub('[\\\\s_\\\\-（）()]+', '', unicodedata.normalize('NFKC', str(value))).casefold()\n\ndef canonical_physical_fields(params, notes):\n    if not isinstance(params, dict):\n        return\n    groups = {'continuous_operating_voltage_v': ('uc_v', 'spd_uc_v', 'max_continuous_operating_voltage_v', 'maximum_continuous_operating_voltage_v', 'Uc电压', '最大持续运行电压'), 'max_discharge_current_ka': ('imax_ka', 'Imax', '最大放电电流'), 'nominal_discharge_current_ka': ('in_ka', '标称放电电流')}\n    for target, aliases in groups.items():\n        tokens = {parameter_token(k) for k in (target,) + aliases}\n        keys = [k for k in params if parameter_token(k) in tokens and params[k] not in (None, '')]\n        if not keys:\n            continue\n        normalized = []\n        for k in keys:\n            text = str(params[k]).strip()\n            m = re.fullmatch('([0-9]+(?:\\\\.[0-9]+)?)\\\\s*(V|kV|kA|A)?', text, re.I)\n            if m:\n                value = float(m.group(1))\n       \
          \         unit = (m.group(2) or '').casefold()\n                if target.endswith('_v') and unit == 'kv':\n                    value *= 1000\n                elif target.endswith('_ka') and unit == 'a':\n                    value /= 1000\n                elif unit and unit not in (('v', 'kv') if target.endswith('_v') else ('a', 'ka')):\n                    value = ('invalid_unit', text)\n                if isinstance(value, float) and value.is_integer():\n                    value = int(value)\n            else:\n                value = ('text', parameter_token(text))\n            normalized.append(value)\n        if any((v != normalized[0] for v in normalized[1:])) or isinstance(normalized[0], tuple):\n            notes.append('参数别名的值或单位不一致：' + target + '；' + ' / '.join((str(params[k]) for k in keys)))\n            continue\n        params[target] = normalized[0]\n        for k in keys:\n            if k != target:\n                params.pop(k, None)\n\ndef audit_cabinet_entry(protocol,\
          \ raw_text):\n    \"\"\"Retain a missed labelled source row as unverified text, not an inferred value.\"\"\"\n    protocol = copy.deepcopy(protocol)\n    project = protocol.setdefault('project_requirements', {})\n    if not isinstance(project, dict):\n        return protocol\n    field = 'cabinet_cable_entry_exit'\n    if project.get(field):\n        return protocol\n    groups = [g for g in protocol.get('scheme_groups', []) if isinstance(g, dict)]\n    if groups and all((g.get(field) for g in groups)):\n        return protocol\n    raw = str(raw_text or '').replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    pattern = '(?:进线电缆孔|电缆(?:进出线|进出|进线|出线)(?:方向|方式|位置)|进出线(?:方向|位置|方式))'\n    rows = []\n    offset = 0\n    for line in raw.splitlines(keepends=True):\n        if re.search(pattern, line):\n            text = line.strip()\n            if text and text not in [r['text'] for r in rows]:\n                rows.append({'text': text, 'source_start': offset + len(line) - len(line.lstrip()),\
