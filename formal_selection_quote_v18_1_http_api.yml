          \        if k != target:\\n                params.pop(k, None)\\n\\ndef audit_cabinet_entry(protocol, raw_text):\\n    \"\"\"Retain a missed labelled source row as unverified text, not an inferred value.\"\"\"\\n    protocol = copy.deepcopy(protocol)\\n    project = protocol.setdefault(\\'project_requirements\\', {})\\n    if not isinstance(project, dict):\\n        return protocol\\n    field = \\'cabinet_cable_entry_exit\\'\\n    if project.get(field):\\n        return protocol\\n    groups = [g for g in protocol.get(\\'scheme_groups\\', []) if isinstance(g, dict)]\\n    if groups and all((g.get(field) for g in groups)):\\n        return protocol\\n    raw = str(raw_text or \\'\\').replace(\\'\\\\r\\\\n\\', \\'\\\\n\\').replace(\\'\\\\r\\', \\'\\\\n\\')\\n    pattern = \\'(?:进线电缆孔|电缆(?:进出线|进出|进线|出线)(?:方向|方式|位置)|进出线(?:方向|位置|方式))\\'\\n    rows = []\\n    offset = 0\\n    for line in raw.splitlines(keepends=True):\\n        if re.search(pattern, line):\\n            text = line.strip()\\\
          n            if text and text not in [r[\\'text\\'] for r in rows]:\\n                rows.append({\\'text\\': text, \\'source_start\\': offset + len(line) - len(line.lstrip()), \\'source_end\\': offset + len(line.rstrip()), \\'page_index\\': None, \\'source_type\\': \\'RAW_PROTOCOL_ROW\\'})\\n        offset += len(line)\\n    if not rows:\\n        return protocol\\n    project[\\'unmapped_cabinet_entry_requirements\\'] = rows\\n    if len(groups) == 1:\\n        project[\\'cabinet_cable_entry_exit_source_text\\'] = \\'；\\'.join((r[\\'text\\'] for r in rows))\\n        project[\\'cabinet_cable_entry_exit_review\\'] = \\'原文明确存在进出线要求，但模型未结构化；保留原文待工程师核对，不作为元器件接线方式\\'\\n    return protocol\\n\\ndef schema_parameters(params, notes):\\n    canonical_physical_fields(params, notes)\\n    return _v163_old_schema_parameters(params, notes)\\n\\ndef main(llm_text, protocol_text=\\'\\', drawing_text=\\'\\', supplementary_notes=\\'\\', raw_protocol_text=\\'\\'):\\n    try:\\n        protocol\
          \ = preserve_document_facts(normalize_rule_quantities(audit_cabinet_entry(parse_object(protocol_text), raw_protocol_text)), \\'PROTOCOL\\', raw_protocol_text)\\n        drawing = preserve_document_facts(parse_object(drawing_text), \\'DRAWING\\')\\n        out = _v163_root_base(llm_text, wire_pack(protocol), wire_pack(drawing), supplementary_notes, raw_protocol_text)\\n        payload = wire_loads(out[\\'selection_request_json\\'])\\n        if payload.get(\\'capacity_blocked\\'):\\n            return out\\n        issues = payload.get(\\'issues\\', [])\\n        project = protocol.get(\\'project_requirements\\', {})\\n        payload[\\'quantity_resolution_audit\\'] = copy.deepcopy(protocol.get(\\'quantity_resolution_audit\\', []))\\n        context = {k: copy.deepcopy(project[k]) for k in (\\'cabinet_cable_entry_exit\\', \\'cabinet_cable_entry_exit_source_text\\', \\'cabinet_cable_entry_exit_review\\', \\'unmapped_cabinet_entry_requirements\\') if project.get(k)}\\n        if\
