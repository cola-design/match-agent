    - data:
        title: 按原始BOM逐行核对确认回传
        type: code
        code_language: python3
        code: "import json, re, base64, gzip, io, math\nHEADERS = ['序号', '回路/位号', '元器件名称', '关键技术参数', '推荐型号', '物料编码', '数量', '系统状态', '工程师确认', '修改意见']\nPLACEHOLDERS = {'', '待确认', '【请工程师填写】', '【如需修改请填写】', '请工程师填写', '如需修改请填写'}\n\ndef text(v):\n    return '' if v is None else str(v).replace('\\u200b', '').replace('\\ufeff', '').strip()\n\ndef canonical(v):\n    return re.sub('\\\\s+', '', text(v)).replace('；', ';')\n\n\ndef canonical_parameters(value):\n    \"\"\"Only normalize the separators that the Excel writer changes.\n\n    Keep each parameter segment and its order. Do not remove labels, values,\n    units, signs or whole fields, and do not use an LLM to waive differences.\n    \"\"\"\n    value = text(value).replace('\\r\\n', '\\n').replace('\\r', '\\n')\n    return tuple(canonical(part) for part in re.split('[；;\\n]', value) if canonical(part))\n\ndef quantity_values(v):\n    values = set()\n    digits = {'零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九':\
          \ 9}\n    for token, unit in re.findall('([0-9]+(?:\\\\.[0-9]+)?|[零一二两三四五六七八九十百千]+)\\\\s*(台|只|个|件|套|根|支|组|块|颗|处|米|m)(?![A-Za-z])', text(v), re.I):\n        if re.fullmatch('[0-9]+(?:\\\\.[0-9]+)?', token):\n            number = float(token)\n        elif all((ch in digits for ch in token)):\n            number = float(''.join((str(digits[ch]) for ch in token)))\n        else:\n            number = 0\n            digit = 0\n            for ch in token:\n                if ch in digits:\n                    digit = digits[ch]\n                else:\n                    number += (digit or 1) * {'十': 10, '百': 100, '千': 1000}[ch]\n                    digit = 0\n            number += digit\n        values.add((number, unit.lower()))\n    return values\n\ndef obj(v):\n    if isinstance(v, dict):\n        return v\n    t = text(v)\n    a, b = (t.find('{'), t.rfind('}'))\n    x = json.loads(t[a:b + 1])\n    if not isinstance(x, dict):\n        raise ValueError('确认节点输出不是JSON对象')\n    return\
          \ x\n\ndef stored_selection(extracted):\n    matches = re.findall('PAYLOAD_B64_PART_(\\\\d{3}):\\\\s*([A-Za-z0-9+/=]{1,24000})', extracted)\n    chunks = {}\n    for n, value in matches:\n        if n in chunks and chunks[n] != value:\n            raise ValueError('系统上下文重复分段冲突')\n        chunks[n] = value\n    if not chunks:\n        raise ValueError('确认表未提取到完整系统数据；不能只凭模型生成的BOM进入报价')\n    ordered = sorted(chunks)\n    if ordered != ['%03d' % n for n in range(1, len(ordered) + 1)]:\n        raise ValueError('系统上下文分段不连续')\n    packed = base64.b64decode(''.join((chunks[n] for n in ordered)), validate=True)\n    with gzip.GzipFile(fileobj=io.BytesIO(packed)) as stream:\n        raw = stream.read(5000001)\n    if len(raw) > 5000000:\n        raise ValueError('确认表系统上下文超过处理容量')\n    result = json.loads(raw.decode('utf-8'))\n    if not isinstance(result, dict) or not isinstance(result.get('items'), list) or (not result['items']):\n        raise ValueError('系统数据不是原始BOM选型结果，可能上传了问题确认单')\n\
          \    return result\n\ndef main(reader_json, opinion_json, extracted_text):\n    try:\n        raw = obj(reader_json)\n        interpreted = obj(opinion_json)\n        if raw.get('form_type') != 'BOM_CONFIRMATION' or interpreted.get('form_type') != 'BOM_CONFIRMATION':\n            raise ValueError('确认表类型不是BOM_CONFIRMATION，请使用对应提交入口')\n        source = stored_selection(text(extracted_text))\n        original = source['items']\n        if source.get('workflow_version') not in ('V17', 'V17.1', 'V17.3'):\n            for prior in original:\n                notes = '；'.join((str(s) for s in prior.get('warnings') or []))\n                if '脱扣曲线未明确' in notes or '候选存在B/C/D差异' in notes or 'SPD持续运行电压Uc未明确' in notes:\n                    raise ValueError('旧版确认单含未明确关键参数的暂定推荐；请用原始协议图纸重新选型生成新版表，不能直接采用旧编码报价')\n        rows = raw.get('rows')\n        opinions = interpreted.get('rows')\n        if not isinstance(rows, list) or not isinstance(opinions, list) or len(rows) != len(original) or (len(opinions)\
          \ != len(rows)):\n            raise ValueError('确认行数与原始BOM不一致；不能漏读、增添或静默删除未确认行。取消项请保留并填写不配置。')\n        if len(rows) > 120:\n            raise ValueError('确认表超过每批120项范围，请按方案分批')\n        opinions_by_no = {text(r.get('序号')): r for r in opinions if isinstance(r, dict)}\n        if len(opinions_by_no) != len(rows):\n            raise ValueError('意见解释出现重复或空行号')\n        result = []\n        seen = set()\n        for index, (row, base) in enumerate(zip(rows, original), 1):\n            if not isinstance(row, dict) or not isinstance(base, dict):\n                raise ValueError('确认表包含非法记录')\n            no = text(row.get('序号'))\n            if no != str(index) or no in seen:\n                raise ValueError('确认表行号、顺序与原始清单不一致，请保留序号后再提交')\n            seen.add(no)\n            op = opinions_by_no.get(no)\n            if not op:\n                raise ValueError('缺少第' + no + '行的意见解释')\n            wanted = text(base.get('requirement_summary'))\n            if wanted and canonical_parameters(row.get('关键技术参数'))\
          \ != canonical_parameters(wanted):\n                raise ValueError('第' + no + '行关键技术要求与原始清单不一致；变更技术要求请重新选型，不直接确认报价')\n            expected_position = base.get('position_display')\n            if expected_position and canonical(row.get('回路/位号')) != canonical(expected_position):\n                raise ValueError('第' + no + '行回路/位号与原清单不一致；不能把确认意见关联到另一个器件')\n            if canonical(row.get('元器件名称')) != canonical(base.get('component_role')):\n                raise ValueError('第' + no + '行元器件名称与原始清单不一致，请核对行关联')\n            clean_row = {key: text(row.get(key)) for key in HEADERS}\n            for key in ('normalized_action', 'action_confidence', 'action_reason', 'final_model_spec', 'final_material_code', 'final_quantity'):\n                clean_row[key] = op.get(key)\n            actual_note = ' '.join((text(row.get(k)) for k in ('工程师确认', '修改意见') if text(row.get(k)) not in PLACEHOLDERS))\n            recommended = base.get('recommended') or {}\n            for column, original_value\
          \ in [('推荐型号', base.get('model_display') or recommended.get('material_name') or base.get('shown_model') or ''), ('物料编码', recommended.get('material_code') or '')]:\n                current = text(row.get(column))\n                if canonical(current) != canonical(original_value) and canonical(current) not in canonical(actual_note):\n                    raise ValueError('第' + no + '行' + column + '被改动但修改意见没有明确最终值；请在黄色意见栏说明')\n            if not actual_note:\n                clean_row.update(normalized_action='PENDING', action_confidence=0.0, action_reason='工程师确认栏尚未填写，模型推断不能代替人工确认')\n            original_qty = base.get('quantity_per_cabinet') if base.get('quantity_basis') == 'PER_CABINET' else base.get('project_quantity', base.get('quantity'))\n            match = re.fullmatch('([0-9]+(?:\\\\.[0-9]+)?)\\\\s*([^0-9\\\\s]*)', text(row.get('数量')))\n            if match and original_qty is not None and (clean_row.get('normalized_action') != 'EXCLUDE'):\n                changed = float(match.group(1))\
          \ != float(original_qty) or (match.group(2) and match.group(2) != text(base.get('unit')))\n                atoms = quantity_values(actual_note)\n                if changed and float(match.group(1)) not in {n for n, u in atoms}:\n                    raise ValueError('第' + no + '行数量或单位与原始清单不同；请在修改意见明确最终数量和单位')\n            for key in ('final_model_spec', 'final_material_code', 'final_quantity'):\n                val = text(clean_row.get(key))\n                if val and canonical(val) not in canonical(actual_note):\n                    if key == 'final_quantity' and quantity_values(val) and quantity_values(val).issubset(quantity_values(actual_note)):\n                        continue\n                    raise ValueError('第' + no + '行AI解释新增了工程师意见中没有的最终值：' + key)\n            clean_row['关键技术参数'] = wanted or clean_row['关键技术参数']\n            clean_row['original_requirements_json'] = json.dumps(base.get('requirements') or {}, ensure_ascii=False)\n            clean_row['original_request_id']\
          \ = base.get('request_id', '')\n            clean_row['scheme_group_id'] = base.get('scheme_group_id', '')\n            clean_row['quantity_basis'] = base.get('quantity_basis', 'PROJECT')\n            clean_row['project_cabinet_quantity'] = base.get('project_cabinet_quantity', base.get('cabinet_quantity'))\n            result.append(clean_row)\n        return {'text': json.dumps({'form_type': 'BOM_CONFIRMATION', 'rows': result, 'reconciled_with_original': True}, ensure_ascii=False), 'guard_status': 'VALID', 'guard_message': '已按原始清单逐行核对，AI仅用于理解工程师意见'}\n    except (ValueError, TypeError, KeyError, EOFError, OSError) as exc:\n        message = 'BOM回传核对失败：' + str(exc)\n        return {'text': json.dumps({'form_type': 'BOM_CONFIRMATION', 'rows': [], 'validation_error': message}, ensure_ascii=False), 'guard_status': 'INVALID', 'guard_message': message}\n"
