    - data:
        code: "import base64\nfrom copy import deepcopy\nfrom datetime import datetime,\
          \ timezone\nfrom decimal import Decimal, InvalidOperation, ROUND_HALF_UP\n\
          import gzip\nimport hashlib\nimport hmac\nimport io\nimport json\nimport\
          \ re\nimport uuid\nimport zipfile\nfrom xml.sax.saxutils import escape,\
          \ quoteattr\nSCOPES = {'OUR_PURCHASE', 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED',\
          \ 'RESERVED'}\nYES = {'是', '确认', '已确认', '同意', '采用', 'YES', 'yes'}\nSCOPE_NAMES\
          \ = {'OUR_PURCHASE': '我方采购', 'CUSTOMER_SUPPLIED': '甲供', 'UTILITY_SUPPLIED':\
          \ '供电局安装', 'RESERVED': '仅预留'}\nMAX_ITEMS = 100\nMAX_PAGES = 20\n\ndef j(value):\n\
          \    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef number(value, positive=False):\n    try:\n\
          \        value = Decimal(str(value))\n    except (InvalidOperation, ValueError,\
          \ TypeError):\n        raise ValueError('请填写有效数字') from None\n    if not\
          \ value.is_finite() or (positive and value <= 0):\n        raise ValueError('数字超出允许范围')\n\
          \    return value\n\ndef pack(state):\n    raw = j(state).encode()\n   \
          \ if len(raw) > 700000:\n        raise ValueError('项目数据过大，请按柜号拆分；未保留半份数据')\n\
          \    result = 'N20:' + base64.b64encode(gzip.compress(raw, mtime=0)).decode()\n\
          \    if len(result) > 55000:\n        raise ValueError('项目上下文超过Dify单变量预算，请按柜号拆分')\n\
          \    return result\n\ndef unpack(value):\n    if not value:\n        return\
          \ {}\n    if not str(value).startswith('N20:'):\n        raise ValueError('旧版本项目不能混用，请新建项目')\n\
          \    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(value[4:], validate=True)))\
          \ as stream:\n        raw = stream.read(700001)\n    if len(raw) > 700000:\n\
          \        raise ValueError('上下文超出处理上限')\n    state = json.loads(raw)\n  \
          \  if not isinstance(state, dict):\n        raise ValueError('项目上下文无效')\n\
          \    return state\n\ndef norm(value):\n    if value is None or str(value).strip()\
          \ in ('nan', 'NaN', 'None'):\n        return ''\n    return ' '.join(str(value).replace('|',\
          \ '／').split()).strip()\n\ndef parse_markdown(text):\n    records = {}\n\
          \    headers = None\n    for line in str(text or '').splitlines():\n   \
          \     if not line.strip().startswith('|'):\n            continue\n     \
          \   cells = [x.strip() for x in line.strip()[1:-1].split('|')]\n       \
          \ if cells and cells[0] == '记录类型':\n            headers = cells\n      \
          \      continue\n        if not headers or not cells or re.fullmatch(':?-+:?',\
          \ cells[0]):\n            continue\n        if cells[0] not in ('ISSUE',\
          \ 'BOM', 'PRICE', 'CHANGE', 'CAB', 'SETTINGS', 'CAD', 'META', 'PREVIEW'):\n\
          \            continue\n        if len(cells) != len(headers):\n        \
          \    raise ValueError('确认表含分隔符或结构变化，请勿在单元格中填写竖线符号')\n        row = {k: norm(v)\
          \ for k, v in zip(headers, cells)}\n        key = (row['记录类型'], row['行ID'])\n\
          \        if key in records:\n            raise ValueError('确认表行ID重复，不能关联答复')\n\
          \        records[key] = row\n    return records\n\ndef equal_cell(a, b):\n\
          \    if norm(a) == norm(b):\n        return True\n    try:\n        return\
          \ number(a) == number(b)\n    except ValueError:\n        return False\n\
          \ndef parse_form(state, text, kind):\n    records = parse_markdown(text)\n\
          \    pieces = sorted(((rid, row['值']) for (typ, rid), row in records.items()\
          \ if typ == 'META' and rid.startswith('PART_')))\n    if [rid for rid, _\
          \ in pieces] != ['PART_' + str(i).zfill(4) for i in range(1, len(pieces)\
          \ + 1)] or not pieces:\n        raise ValueError('系统上下文缺段；请使用本项目最新确认表')\n\
          \    encoded = ''.join((value for _, value in pieces))\n    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded,\
          \ validate=True))) as stream:\n        raw = stream.read(700001)\n    if\
          \ len(raw) > 700000:\n        raise ValueError('确认表上下文超出容量')\n    packet\
          \ = json.loads(raw)\n    signature = records.get(('META', 'SIGNATURE'),\
          \ {}).get('值', '')\n    expected = hmac.new(state['sign_key'].encode(),\
          \ raw, hashlib.sha256).hexdigest()\n    if not hmac.compare_digest(signature,\
          \ expected):\n        raise ValueError('确认单签名无效，固定数据可能被改动')\n    if packet['project_id']\
          \ != state['project_id'] or packet['kind'] != kind:\n        raise ValueError('确认表所属项目或类型不匹配')\n\
          \    if packet['revision'] != state['revision']:\n        raise ValueError('确认表已过期，请回传最新版本')\n\
          \    readonly = packet['readonly']\n    allowed = {(x['type'], x['id'])\
          \ for x in readonly}\n    if {(t, r) for t, r in records if t != 'META'}\
          \ != allowed:\n        raise ValueError('确认表行数/行ID发生变化，请下载最新表重填')\n    for\
          \ record in readonly:\n        row = records[record['type'], record['id']]\n\
          \        for key, value in record['values'].items():\n            if key\
          \ not in row or not equal_cell(row[key], value):\n                raise\
          \ ValueError('固定字段被改动：' + key + '；请在修订JSON说明变更')\n    approver = records.get(('SETTINGS',\
          \ 'APPROVER'), {}).get('确认人', '')\n    if len(approver) < 2:\n        raise\
          \ ValueError('请在填写说明中填写实际确认人')\n    return (records, approver)\n\ndef read_return(state_json,\
          \ text, kind):\n    original = state_json\n    try:\n        state = unpack(state_json)\n\
          \        expected = 'NEEDS_CLARIFICATION' if kind == 'ISSUES' else 'BOM_REVIEW'\n\
          \        if state.get('stage') != expected:\n            raise ValueError('确认阶段不匹配，请回传当前阶段最新表格')\n\
          \        records, approver = parse_form(state, text, kind)\n        packed\
          \ = {typ + ':' + rid: row for (typ, rid), row in records.items() if typ\
          \ != 'META'}\n        projection = [{'issue_id': rid, 'raw_answer': row.get('答复',\
          \ ''), 'confirmed': row.get('确认', '')} for (typ, rid), row in records.items()\
          \ if typ == 'ISSUE']\n        context = {'records': packed, 'approver':\
          \ approver}\n        state['_return'] = context\n        prompt = j({'issues':\
          \ [{'id': x['id'], 'question': x['message'], 'kind': x['kind']} for x in\
          \ state['issues']], 'answers': projection}) if kind == 'ISSUES' else '{}'\n\
          \        if len(prompt) > 45000:\n            raise ValueError('问题答复超过模型输入预算，请按柜号分批')\n\
          \        return {'state_json': pack(state), 'projection_json': prompt, 'valid':\
          \ 'YES', 'message': ''}\n    except Exception as exc:\n        return {'state_json':\
          \ original, 'projection_json': '{}', 'valid': 'NO', 'message': str(exc)}\n\
          \ndef main(state_json, text, kind):\n    return read_return(state_json,\
          \ text, kind)\n"
