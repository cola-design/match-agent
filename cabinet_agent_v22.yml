          import gzip\nimport hashlib\nimport hmac\nimport io\nimport json\nimport\
          \ re\nimport uuid\nimport zipfile\nfrom xml.sax.saxutils import escape,\
          \ quoteattr\nSCOPES = {'OUR_PURCHASE', 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED',\
          \ 'RESERVED'}\nYES = {'是', '确认', '已确认', '同意', '采用', 'YES', 'yes'}\nSCOPE_NAMES\
          \ = {'OUR_PURCHASE': '我方采购', 'CUSTOMER_SUPPLIED': '甲供', 'UTILITY_SUPPLIED':\
          \ '供电局安装', 'RESERVED': '仅预留'}\nMAX_ITEMS = 100\nMAX_PAGES = 20\n\ndef j(value):\n\
          \    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef obj(value):\n    if isinstance(value, (dict,\
          \ list)):\n        return deepcopy(value)\n    text = re.sub('^```(?:json)?\\\
          \\s*|\\\\s*```$', '', str(value or '').strip())\n    return json.loads(text)\n\
          \ndef conversion_manifest(stats, images, input_files, role):\n    values\
          \ = obj(stats)\n    if isinstance(values, dict):\n        values = [values]\n\
          \    candidates = [x for x in values if isinstance(x, dict) and x.get('success')\
          \ is True and isinstance(x.get('images'), list)]\n    if len(candidates)\
          \ != 1:\n        raise ValueError('PDF转图片未返回完整结果，请核对插件是否安装和文件是否可读')\n  \
          \  result = candidates[0]\n    meta = result['images']\n    if len(images)\
          \ != len(meta) or result.get('total_images') != len(meta) or result.get('total_pages')\
          \ != len(meta):\n        raise ValueError('PDF转换页数不完整，本次不使用缺页图纸')\n    if\
          \ not 1 <= len(meta) <= MAX_PAGES:\n        raise ValueError('每批图片页数应为1至20页，请拆分项目')\n\
          \    groups = {}\n    for row in meta:\n        f = row.get('file_index')\n\
          \        p = row.get('page_number')\n        if not isinstance(f, int) or\
          \ not isinstance(p, int):\n            raise ValueError('转换页码格式无效')\n  \
          \      groups.setdefault(f, []).append(p)\n    if set(groups) != set(range(1,\
          \ len(input_files) + 1)):\n        raise ValueError('有PDF未完成转换，请重新导出或分开上传')\n\
          \    for pages in groups.values():\n        if sorted(pages) != list(range(1,\
          \ len(pages) + 1)):\n            raise ValueError('PDF转换存在漏页或重复页')\n   \
          \ return [{'document_id': ('T' if role == 'technical_agreement' else 'D')\
          \ + str(x['file_index']), 'page': x['page_number'], 'image_index': i, 'filename':\
          \ x['filename'], 'role': role} for i, x in enumerate(meta)]\n\ndef page_guard(stats,\
          \ images, input_files, role):\n    try:\n        manifest = conversion_manifest(stats,\
          \ images, input_files, role)\n        return {'valid': 'YES', 'manifest_json':\
          \ j(manifest), 'message': ''}\n    except Exception as exc:\n        return\
          \ {'valid': 'NO', 'manifest_json': '[]', 'message': str(exc)}\n\ndef main(stats,\
          \ images, input_files, role):\n    return page_guard(stats, images, input_files,\
          \ role)\n"
