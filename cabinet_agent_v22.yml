app:
  description: 业务逻辑全部内嵌Dify：PDF逐页千问视觉→问题确认回传→BOM确认→采购/报价/排产Excel；技术协议可选。复用现有产品API，无需project_service。DWG依赖实际格式转换接口与工程校核。
  icon: 📐
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 成套柜项目助手 V22（明确操作入口与千问3-VL-Plus）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.3@966063fe991c50e5ac82106e65fc1949f852b2989ab2433ac028f0d25c6f92b1
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: wonendieee/generic_excel_template_filler:0.4.0@c8505d2c93171753828b3d15decd20de46b9229352da057a5598e2dd921c4e63
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: atoy0m0/pdf-to-images:1.0.1@bfd6805409081d0ce320c6ecfdd0cc74a3b5e07b9d3ee2450bd53226f9ce40ae
kind: app
version: 0.4.0
workflow:
  conversation_variables:
  - description: 当前项目事实、阶段、签名和确认记录。仅在本会话使用，不传完整状态给模型。
    id: 9bf338a4-83a3-5295-bf18-4657fbcded60
    name: project_state
    selector:
    - conversation
    - project_state
    value: ''
    value_type: string
  environment_variables:
  - description: 已部署的产品查询API根地址，末尾不加斜杠。
    id: 401bd228-f8fb-568c-812d-9950a46414d9
    name: MONGODB_API_BASE_URL
    selector:
    - env
    - MONGODB_API_BASE_URL
    value: ''
    value_type: string
  - description: 原产品查询API的X-API-Key，不是MongoDB密码。
    id: 41784955-66c9-5923-b6fb-2026fec3bce0
    name: MONGODB_API_KEY
    selector:
    - env
    - MONGODB_API_KEY
    value: ''
    value_type: secret
  - description: 报价表预填加成率，仍需工程师确认。
    id: b081ad23-de0c-584f-bfb2-0b4effd0000b
    name: MATERIAL_MARKUP_RATE
    selector:
    - env
    - MATERIAL_MARKUP_RATE
    value: '0.15'
    value_type: string
  - description: 报价表预填折扣率，仍需工程师确认。
    id: b87541c0-3d65-5c32-b659-7446e3e89088
    name: QUOTE_DISCOUNT_RATE
    selector:
    - env
    - QUOTE_DISCOUNT_RATE
    value: '0'
    value_type: string
  - description: 可留空。转换接口接收JSON中的dxf_base64并直接返回DWG附件；业务与DXF生成均在本流程内。
    id: 39aa5a26-ec5d-5935-aa32-7817f1d0a85e
    name: CAD_CONVERT_URL
    selector:
    - env
    - CAD_CONVERT_URL
    value: ''
    value_type: string
  - description: 可留空。未来CAD转换服务的访问密钥。
    id: ff5f1368-2de0-5992-b21a-3e7564767bed
    name: CAD_API_KEY
    selector:
    - env
    - CAD_API_KEY
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .PDF
      - .xlsx
      - .XLSX
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 5
    opening_statement: '**先确认问题，再确认BOM，最后生成交付资料。**


      - **开始选型**：上方填写项目并上传图纸PDF，技术协议可选，再点“开始选型”。

      - **提交问题清单**：填写问题确认表，在聊天框上传XLSX，输入“提交问题清单”并发送。

      - **提交BOM表**：问题解决后填写BOM确认表，在聊天框上传XLSX，输入“提交BOM表”并发送。

      - **查看项目**：查看当前进度和下一步。

      - **生成DWG**：BOM、工程参数确认且CAD接口接通后使用；接口待接。


      **确认表与指令须在同一条消息，用聊天框发送按钮提交；上方只传PDF。**'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始选型
    - 提交问题清单
    - 提交BOM表
    - 查看项目
    - 生成DWG
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
