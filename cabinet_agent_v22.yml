          \        elif len(files) != 1 or not str(files[0].get('filename') or '').lower().endswith('.xlsx'):\n\
          \            message = '请上传一份本项目最新BOM确认单XLSX。'\n        else:\n        \
          \    route = 'BOM'\n    elif q in ('生成交付文件', '生成CAD'):\n        if state.get('stage')\
