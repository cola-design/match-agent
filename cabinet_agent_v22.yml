    nodes:
    - data:
        desc: ''
        selected: false
        title: 首次填写项目资料；确认表在下方聊天框回传
        type: start
        variables:
        - label: 开始选型｜项目名称
          max_length: 100
          options: []
          required: false
          type: text-input
          variable: project_name
        - variable: drawing_files
          label: 开始选型｜客户图纸PDF（最多5份）
          type: file-list
          required: false
          max_length: 5
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          - .PDF
          allowed_file_upload_methods:
          - local_file
          options: []
        - allowed_file_extensions:
          - .pdf
          - .PDF
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          label: 开始选型｜技术协议PDF
          max_length: 3
          options: []
          required: false
          type: file-list
          variable: technical_files
        - label: 开始选型｜项目补充说明
          max_length: 4000
          options: []
          required: false
          type: paragraph
          variable: notes
      height: 142
      id: '2020000000001'
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import base64\nfrom copy import deepcopy\nfrom datetime import datetime,\
          \ timezone\nfrom decimal import Decimal, InvalidOperation, ROUND_HALF_UP\n\
          import gzip\nimport hashlib\nimport hmac\nimport io\nimport json\nimport\
          \ re\nimport uuid\nimport zipfile\nfrom xml.sax.saxutils import escape,\
          \ quoteattr\nSCOPES = {'OUR_PURCHASE', 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED',\
          \ 'RESERVED'}\nYES = {'是', '确认', '已确认', '同意', '采用', 'YES', 'yes'}\nSCOPE_NAMES\
          \ = {'OUR_PURCHASE': '我方采购', 'CUSTOMER_SUPPLIED': '甲供', 'UTILITY_SUPPLIED':\
          \ '供电局安装', 'RESERVED': '仅预留'}\nMAX_ITEMS = 100\nMAX_PAGES = 20\n\ndef j(value):\n\
          \    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef pack(state):\n    raw = j(state).encode()\n\
          \    if len(raw) > 700000:\n        raise ValueError('项目数据过大，请按柜号拆分；未保留半份数据')\n\
          \    result = 'N20:' + base64.b64encode(gzip.compress(raw, mtime=0)).decode()\n\
          \    if len(result) > 55000:\n        raise ValueError('项目上下文超过Dify单变量预算，请按柜号拆分')\n\
          \    return result\n\ndef unpack(value):\n    if not value:\n        return\
          \ {}\n    if not str(value).startswith('N20:'):\n        raise ValueError('旧版本项目不能混用，请新建项目')\n\
          \    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(value[4:], validate=True)))\
          \ as stream:\n        raw = stream.read(700001)\n    if len(raw) > 700000:\n\
          \        raise ValueError('上下文超出处理上限')\n    state = json.loads(raw)\n  \
          \  if not isinstance(state, dict):\n        raise ValueError('项目上下文无效')\n\
          \    return state\n\ndef new_state(name, files, technical_files):\n\n  \
          \  def refs(values, role):\n        return [{'id': str(f.get('upload_file_id')\
          \ or f.get('id') or ''), 'filename': str(f.get('filename') or f.get('name')\
          \ or ''), 'role': role} for f in values if isinstance(f, dict)]\n    return\
          \ {'schema': 'dify-native-v20', 'project_id': uuid.uuid4().hex, 'name':\
          \ str(name or '电气成套项目')[:100], 'revision': 1, 'stage': 'READING', 'sign_key':\
          \ uuid.uuid4().hex + uuid.uuid4().hex, 'documents': refs(files, 'drawing')\
          \ + refs(technical_files, 'technical_agreement'), 'pages': [], 'facts':\
          \ {'cabinets': [], 'items': [], 'notes': [], 'rules': [], 'connections':\
          \ [], 'recognition_issues': []}, 'issues': [], 'bom': [], 'source_reviewed':\
          \ False, 'history': []}\n\ndef status_message(state):\n    if not state:\n\
          \        return '请上传图纸PDF，发送“新建项目”；技术协议可选。'\n    labels = {'READING': '正在读取资料',\
          \ 'REVIEWING': '待工程复核', 'ASSESS': '待产品匹配，可发送“继续处理”', 'NEEDS_CLARIFICATION':\
          \ '待问题确认单回传', 'BOM_REVIEW': '待BOM逐项确认', 'CONFIRMED': 'BOM已确认，可生成交付文件', 'DELIVERED':\
          \ '交付文件已生成'}\n    return '**' + state['name'] + '**\\n\\n项目：`' + state['project_id']\
          \ + '`；版本：' + str(state['revision']) + '；' + labels.get(state['stage'],\
          \ state['stage']) + '。'\n\ndef router(query, state_json, files, technical_files,\
          \ project_name, notes):\n    state = unpack(state_json)\n    files = files\
          \ or []\n    technical_files = technical_files or []\n    q = str(query\
          \ or '').strip()\n    route = 'STATUS'\n    message = ''\n    aliases =\
          \ {'开始选型': '新建项目', '开始项目': '新建项目', '提交确认BOM': '提交BOM确认', '生成报价': '生成交付文件',\
          \ '生成排产': '生成交付文件', '查看进度': '查看项目'}\n    q = aliases.get(q, q)\n    if q\
          \ in ('新建项目', '重新选型'):\n        if not 1 <= len(files) <= 5 or any((not\
          \ str(f.get('filename') or f.get('name') or '').lower().endswith('.pdf')\
          \ for f in files)):\n            return {'route': 'STATUS', 'state_json':\
          \ state_json or '', 'message': '请在聊天输入框上传1至5份图纸PDF，再发送“新建项目”。技术协议在开始表单选填。'}\n\
          \        if len(technical_files) > 3:\n            raise ValueError('技术协议最多3份PDF')\n\
          \        state = new_state(project_name, files, technical_files)\n     \
          \   state['user_notes'] = str(notes or '')[:4000]\n        route = 'NEW'\n\
          \    elif q == '提交问题确认':\n        if not state or state.get('stage') !=\
          \ 'NEEDS_CLARIFICATION':\n            message = '当前不在问题确认阶段，请先新建项目或查看项目状态。'\n\
          \        elif len(files) != 1 or not str(files[0].get('filename') or '').lower().endswith('.xlsx'):\n\
          \            message = '请在聊天输入框上传一份本项目最新问题确认单XLSX。'\n        else:\n   \
          \         route = 'ISSUES'\n    elif q == '提交BOM确认':\n        if not state\
