          \   else:\n            message = '必须先完成问题确认和BOM逐项确认，再生成报价、排产资料与CAD。'\n \
          \   elif q == '继续处理':\n        if state.get('stage') == 'ASSESS':\n    \
          \        route = 'ASSESS'\n        elif state.get('stage') == 'REVIEWING':\n\
          \            expected = sum((1 for d in state.get('documents', []) if d['role']\
          \ == 'technical_agreement'))\n            seen = {p['document_id'] for p\
          \ in state.get('pages', []) if p['role'] == 'technical_agreement'}\n   \
          \         route = 'TECH' if expected and len(seen) < expected else 'REVIEW'\n\
          \        else:\n            message = '当前状态无需重新匹配，请按项目提示完成对应确认。'\n    elif\
          \ q in ('补充交付参数', '补充价格', '补充CAD参数'):\n        if state.get('stage') in\
          \ ('CONFIRMED', 'DELIVERED'):\n            state['stage'] = 'BOM_REVIEW'\n\
          \            state['revision'] += 1\n            route = 'FORM'\n      \
          \  else:\n            message = '请先完成本轮问题与BOM确认。'\n    elif q not in ('查看项目',\
          \ ''):\n        message = '操作入口：开始选型、提交问题清单、提交BOM表、查看项目、生成DWG。重新下载交付文件可发送“生成交付资料”。'\n\
          \    return {'route': route, 'state_json': pack(state) if state else '',\
          \ 'message': message or status_message(state)}\n\ndef main(query, state_json,\
          \ files, technical_files, project_name, notes):\n    return router(query,\
          \ state_json, files, technical_files, project_name, notes)\n\n\n_submit_router_v20\
          \ = main\n\ndef main(query, state_json, files, technical_files, project_name,\
