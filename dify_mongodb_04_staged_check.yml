          \     uri, connect=False, retryReads=False, retryWrites=False,\n            serverSelectionTimeoutMS=1500, connectTimeoutMS=1500,\n            socketTimeoutMS=1500, timeoutMS=2500\n        )\n        db = client[db_name.strip()]\n        stage = \"read_products\"\n        with pymongo.timeout(2.5):\n            product = db.products.find_one(\n                {\"data_status\": \"ACTIVE\", \"source_status\": \"有效\"},\n                {\"_id\": 0, \"material_code\": 1}, max_time_ms=1000)\n        stage = \"read_prices\"\n        with pymongo.timeout(2.5):\n            price = db.prices.find_one(\n                {\"status\": \"ACTIVE\"},\n                {\"_id\": 0, \"material_code\": 1}, max_time_ms=1000)\n        stage = \"client_close\"\n        client.close()\n        client = None\n        return emit({\"ok\": True, \"stage\": \"completed\", \"product\": product or {}, \"price\": price or {}})\n    except Exception as exc:\n        data = {\"ok\": False, \"stage\": stage, \"\
          error_type\": type(exc).__name__}\n        if isinstance(getattr(exc, \"code\", None), int):\n            data[\"error_code\"] = exc.code\n        return emit(data)\n    finally:\n        if client is not None:\n            client.close()\n"
