    - data:
        code: "import json\n\ndef main(mongo_uri: str, db_name: str, previous_result: str = \"\") -> dict:\n    client = None\n    stage = \"validate_input\"\n    def emit(data):\n        return {\"result\": json.dumps(data, ensure_ascii=False)}\n    try:\n        if previous_result and not json.loads(previous_result).get(\"ok\"):\n            return emit({\"ok\": False, \"stage\": \"skipped\", \"previous\": json.loads(previous_result)})\n        uri = mongo_uri.strip()\n        if not uri.startswith(\"mongodb://\") or \"\\n\" in uri or \"\\r\" in uri or chr(92) + \"n\" in uri:\n            return emit({\"ok\": False, \"stage\": stage, \"reason\": \"Use a single-line mongodb:// URI without newline characters.\"})\n        if not db_name.strip():\n            return emit({\"ok\": False, \"stage\": stage, \"reason\": \"Database name is required.\"})\n        stage = \"import_pymongo\"\n        import pymongo\n        return emit({\"ok\": True, \"stage\": \"import_pymongo\", \"version\": str(pymongo.version)})\n\
          \    except Exception as exc:\n        data = {\"ok\": False, \"stage\": stage, \"error_type\": type(exc).__name__}\n        if isinstance(getattr(exc, \"code\", None), int):\n            data[\"error_code\"] = exc.code\n        return emit(data)\n    finally:\n        if client is not None:\n            client.close()\n"
