    nodes:
    - data:
        desc: 填写只读 MongoDB 连接字符串和数据库名称。
        selected: false
        title: 输入 MongoDB 参数
        type: start
        variables:
        - label: MongoDB连接字符串
          max_length: 500
          options: []
          required: true
          type: paragraph
          variable: mongo_uri
        - label: 数据库名称
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: db_name
      height: 160
      id: '1800000001001'
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(mongo_uri: str, db_name: str) -> dict:\n    client = None\n    stage = \"import_pymongo\"\n    try:\n        from pymongo import MongoClient, timeout\n        stage = \"client_setup\"\n        client = MongoClient(\n            mongo_uri, connect=False, retryReads=False,\n            serverSelectionTimeoutMS=1500, connectTimeoutMS=1500,\n            socketTimeoutMS=1500, timeoutMS=2500\n        )\n        stage = \"ping\"\n        with timeout(2.5):\n            client[db_name].command(\"ping\")\n        stage = \"read_products\"\n        with timeout(2.5):\n            product = client[db_name].products.find_one(\n                {\"data_status\": \"ACTIVE\", \"source_status\": \"有效\"},\n                {\"_id\": 0, \"material_code\": 1}, max_time_ms=1000\n            )\n        stage = \"read_prices\"\n        with timeout(2.5):\n            price = client[db_name].prices.find_one(\n                {\"status\": \"ACTIVE\"},\n                {\"_id\"\
          : 0, \"material_code\": 1}, max_time_ms=1000\n            )\n        data = {\"ok\": True, \"stage\": \"completed\", \"product\": product or {}, \"price\": price or {}}\n    except Exception as exc:\n        # Do not echo exception text: it may contain connection details.\n        data = {\"ok\": False, \"stage\": stage, \"error_type\": type(exc).__name__}\n        if isinstance(getattr(exc, \"code\", None), int):\n            data[\"error_code\"] = exc.code\n    finally:\n        if client is not None:\n            client.close()\n    return {\"result\": json.dumps(data, ensure_ascii=False)}\n"
        code_language: python3
        desc: 分阶段返回错误类型；使用超时，不执行全库计数。
        isInIteration: false
        isInLoop: false
        iteration_id: ''
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: MongoDB诊断2：连接与少量只读查询
        type: code
        variables:
        - value_selector:
          - '1800000001001'
