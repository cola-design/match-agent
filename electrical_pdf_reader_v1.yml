    - id: '2700000000006'
      type: custom
      data:
        type: code
        title: 检查全部PDF和页码，不接受缺页结果
        desc: ''
        selected: false
        code_language: python3
        code: "import re\nimport unicodedata\nimport base64\nimport gzip\nimport hashlib\n\
          import hmac\nimport io\nimport json\nimport zipfile\nfrom xml.sax.saxutils\
          \ import escape, quoteattr\nimport math\nimport uuid\nVERSION = '0.1.0'\n\
          SOURCES = {'MCB': 'https://electrification.us.abb.com/back-to-basics/circuit-breaker-basics',\
          \ 'RCD': 'https://www.se.com/us/en/faqs/FA89258/', 'WDZB': 'https://www.qrunning.com/products/view?id=1795&lang=cn'}\n\
          CATEGORY_NAMES = {'unclassified': '保留原文，尚未分类', 'protective_device': '断路器/保护器件',\
          \ 'wire_or_cable': '电线/电缆标注', 'phase': '相别', 'circuit_number': '回路编号', 'transfer_switch':\
          \ '转换开关', 'voltage_ratio': '两侧电压', 'apparent_power': '视在功率', 'power_supply_marking':\
          \ '电源参数', 'device_tag': '器件位号', 'calculation_marking': '计算参数', 'residual_current_marking':\
          \ '剩余电流动作值'}\ndef j(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False)\ndef conversion(stats, images,\
          \ files):\n    try:\n        values = json.loads(stats) if isinstance(stats,\
          \ str) else stats\n        if isinstance(values, dict):\n            values\
          \ = [values]\n        matches = [x for x in values or [] if isinstance(x,\
          \ dict) and x.get('success') is True and isinstance(x.get('images'), list)]\n\
          \        if len(matches) != 1:\n            raise ValueError('PDF插件没有返回完整转换统计，请检查插件1.0.1及文件访问')\n\
          \        result = matches[0]\n        meta = result['images']\n        if\
          \ not 1 <= len(meta) <= 8:\n            raise ValueError('本轮PDF合计应为1至8页，请拆分后上传；本次不截取前几页')\n\
          \        if len(images) != len(meta) or result.get('total_images') != len(meta)\
          \ or result.get('total_pages') != len(meta):\n            raise ValueError('转换缺页或图片数量不一致，未开始识别')\n\
          \        groups = {}\n        manifest = []\n        batch_id = uuid.uuid4().hex\n\
          \        for index, (m, image) in enumerate(zip(meta, images)):\n      \
          \      f = m.get('file_index')\n            p = m.get('page_number')\n \
          \           if type(f) is not int or type(p) is not int or (not 1 <= f <=\
          \ len(files)) or (p < 1):\n                raise ValueError('插件文件编号或页码无效')\n\
          \            groups.setdefault(f, []).append(p)\n            expected =\
          \ str(m.get('filename') or '')\n            actual = str(image.get('filename')\
          \ or image.get('name') or '')\n            if not expected or actual !=\
          \ expected:\n                raise ValueError('图片文件名与转换统计不一致，不能猜测来源页')\n\
          \            manifest.append({'batch_id': batch_id, 'document_id': 'D' +\
          \ str(f), 'source_filename': str(files[f - 1].get('filename') or files[f\
          \ - 1].get('name') or ''), 'page': p, 'image_index': index, 'image_filename':\
          \ expected, 'width_px': m.get('width'), 'height_px': m.get('height')})\n\
          \        if set(groups) != set(range(1, len(files) + 1)):\n            raise\
          \ ValueError('有PDF未成功转换，未使用缺文件结果')\n        for pages in groups.values():\n\
          \            if sorted(pages) != list(range(1, len(pages) + 1)):\n     \
          \           raise ValueError('PDF存在缺页或重复页')\n        return {'valid': 'YES',\
          \ 'manifest_json': j(manifest), 'message': ''}\n    except (ValueError,\
          \ TypeError, KeyError) as exc:\n        return {'valid': 'NO', 'manifest_json':\
          \ '[]', 'message': str(exc)}\n\ndef main(stats, images, files):\n    return\
          \ conversion(stats, images, files)\n"
        variables:
        - variable: stats
          value_selector:
          - '2700000000005'
          - json
        - variable: images
          value_selector:
          - '2700000000005'
          - files
        - variable: files
          value_selector:
          - sys
          - files
        outputs:
          valid:
            type: string
            children: null
          manifest_json:
            type: string
            children: null
          message:
            type: string
            children: null
