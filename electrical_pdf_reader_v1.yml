      type: custom
      data:
        type: code
        title: 二次失败保留失败原因，继续保存其他页
        desc: ''
        selected: false
        code_language: python3
        code: "import re\nimport unicodedata\nimport base64\nimport gzip\nimport hashlib\n\
          import hmac\nimport io\nimport json\nimport zipfile\nfrom xml.sax.saxutils\
          \ import escape, quoteattr\nimport math\nimport uuid\nVERSION = '0.1.0'\n\
          SOURCES = {'MCB': 'https://electrification.us.abb.com/back-to-basics/circuit-breaker-basics',\
          \ 'RCD': 'https://www.se.com/us/en/faqs/FA89258/', 'WDZB': 'https://www.qrunning.com/products/view?id=1795&lang=cn'}\n\
          CATEGORY_NAMES = {'unclassified': '保留原文，尚未分类', 'protective_device': '断路器/保护器件',\
          \ 'wire_or_cable': '电线/电缆标注', 'phase': '相别', 'circuit_number': '回路编号', 'transfer_switch':\
          \ '转换开关', 'voltage_ratio': '两侧电压', 'apparent_power': '视在功率', 'power_supply_marking':\
          \ '电源参数', 'device_tag': '器件位号', 'calculation_marking': '计算参数', 'residual_current_marking':\
          \ '剩余电流动作值'}\ndef j(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False)\ndef box_ok(box):\n    return\
          \ isinstance(box, list) and len(box) == 4 and all((type(x) in (int, float)\
          \ and math.isfinite(x) and (0 <= x <= 1) for x in box)) and (box[0] < box[2])\
          \ and (box[1] < box[3])\ndef strict_json(raw):\n\n    def pairs(values):\n\
          \        result = {}\n        for key, value in values:\n            if\
          \ key in result:\n                raise ValueError('JSON存在重复字段')\n     \
          \       result[key] = value\n        return result\n    text = str(raw or\
          \ '').strip()\n    if len(text.encode()) > 52000:\n        raise ValueError('本页结果超过输出预算，需要拆分图纸，不采用截断JSON')\n\
          \    if text.startswith('```'):\n        match = re.fullmatch('```(?:json)?\\\
          \\s*([\\\\s\\\\S]*?)\\\\s*```', text)\n        if not match:\n         \
          \   raise ValueError('JSON代码块未闭合')\n        text = match.group(1)\n    return\
          \ json.loads(text, object_pairs_hook=pairs, parse_constant=lambda _: (_\
          \ for _ in ()).throw(ValueError('JSON存在非有限数')))\ndef checked(raw, context_json):\n\
          \    source = json.loads(context_json)\n    try:\n        data = strict_json(raw)\n\
          \        if not isinstance(data, dict):\n            raise ValueError('输出必须是JSON对象')\n\
          \        if data.get('document_id') != source['document_id'] or type(data.get('page'))\
          \ is not int or data.get('page') != source['page']:\n            raise ValueError('模型返回的来源编号或页码不一致')\n\
          \        if type(data.get('page_readable')) is not bool or data.get('coverage')\
          \ not in ('complete', 'partial', 'unreadable'):\n            raise ValueError('缺少明确的图面可读状态或覆盖状态')\n\
          \        if not data['page_readable'] and data['coverage'] != 'unreadable':\n\
          \            raise ValueError('不可读页面不能标记为完整识别')\n        if data['page_readable']\
          \ and data['coverage'] == 'unreadable':\n            raise ValueError('可读状态与覆盖状态矛盾')\n\
          \        for key, limit in (('drawings', 30), ('items', 80), ('notes', 40),\
          \ ('issues', 40)):\n            if not isinstance(data.get(key), list) or\
          \ len(data[key]) > limit:\n                raise ValueError(key + '数组缺失或超过本页预算，需要拆分图纸')\n\
          \        drawing_ids = set()\n        for drawing in data['drawings']:\n\
          \            if not isinstance(drawing, dict) or not isinstance(drawing.get('id'),\
          \ str) or (not drawing['id']) or (drawing['id'] in drawing_ids) or (not\
          \ box_ok(drawing.get('bbox'))):\n                raise ValueError('子图索引需要唯一编号和图片位置')\n\
          \            drawing_ids.add(drawing['id'])\n        ids = set()\n     \
          \   for item in data['items']:\n            if not isinstance(item, dict)\
          \ or not isinstance(item.get('id'), str) or (not item['id']) or (item['id']\
          \ in ids):\n                raise ValueError('条目编号缺失或重复')\n            ids.add(item['id'])\n\
          \            if item.get('drawing_id') and item['drawing_id'] not in drawing_ids:\n\
          \                raise ValueError('条目引用了不存在的子图')\n            if not isinstance(item.get('raw_text'),\
          \ str) or not box_ok(item.get('bbox')):\n                raise ValueError('每条标注必须保留原文及0至1图片位置')\n\
          \            if not isinstance(item.get('parameters'), dict) or not isinstance(item.get('uncertainties'),\
          \ list):\n                raise ValueError('每条标注需要parameters对象和uncertainties数组')\n\
          \            for field in ('kind', 'meaning', 'cabinet_id', 'circuit_no',\
          \ 'phase', 'device_tag', 'unit'):\n                if not isinstance(item.get(field),\
          \ str):\n                    raise ValueError('条目缺少字符串字段：' + field)\n  \
          \          quantity = item.get('quantity_per_cabinet')\n            if quantity\
          \ is not None and (type(quantity) not in (int, float) or not math.isfinite(quantity)\
          \ or (not 0 < quantity < 100000000.0)):\n                raise ValueError('单柜数量必须为明确的正数或null')\n\
          \        for note in data['notes']:\n            if not isinstance(note,\
          \ dict) or not isinstance(note.get('raw_text'), str) or (not box_ok(note.get('bbox'))):\n\
          \                raise ValueError('技术说明需要原文和图片位置')\n        for issue in\
          \ data['issues']:\n            if not isinstance(issue, dict) or not isinstance(issue.get('message'),\
          \ str) or issue.get('kind') not in ('unclear', 'missing', 'conflict', 'recognition_limit'):\n\
          \                raise ValueError('疑问需要明确内容和类别')\n            if issue.get('item_id')\
          \ and issue['item_id'] not in ids:\n                raise ValueError('疑问引用了不存在的条目')\n\
          \            if issue.get('bbox') is not None and (not box_ok(issue['bbox'])):\n\
          \                raise ValueError('疑问图片位置无效')\n            if issue['kind']\
          \ == 'conflict':\n                observations = issue.get('observations',\
          \ [])\n                if not isinstance(observations, list) or len(observations)\
          \ < 2 or any((not isinstance(x, dict) or not isinstance(x.get('raw_text'),\
          \ str) or (not x['raw_text'].strip()) or (not box_ok(x.get('bbox'))) for\
          \ x in observations)):\n                    issue['kind'] = 'recognition_limit'\n\
          \                    issue['message'] = 'AI提出疑似冲突但缺少两处原文依据，应先复核识别，不能认定客户图纸错误：'\
          \ + issue['message']\n        if data['coverage'] == 'complete' and (not\
          \ data['drawings']) and (not data['items']) and (not data['notes']):\n \
          \           raise ValueError('空结果不能声称本页已完整识别')\n        packet = {'source':\
          \ source, 'status': 'extracted', 'data': data, 'engineering_verified': False}\n\
          \        return {'valid': 'YES', 'packet_json': j(packet), 'message': ''}\n\
          \    except (ValueError, TypeError, KeyError) as exc:\n        packet =\
          \ {'source': source, 'status': 'failed', 'data': {'page_readable': False,\
          \ 'coverage': 'unreadable', 'drawings': [], 'items': [], 'notes': [], 'issues':\
          \ [{'kind': 'recognition_limit', 'message': '模型两次未能形成可校验结果；请对照原图或拆分PDF。最后校验原因：'\
          \ + str(exc)[:250]}]}, 'engineering_verified': False}\n        return {'valid':\
          \ 'NO', 'packet_json': j(packet), 'message': str(exc)[:300]}\n\ndef main(raw,\
          \ context_json):\n    return checked(raw, context_json)\n"
        variables:
        - variable: raw
          value_selector:
          - '2700000000016'
          - text
        - variable: context_json
          value_selector:
          - '2700000000012'
          - context_json
        outputs:
          valid:
            type: string
            children: null
          packet_json:
            type: string
            children: null
          message:
            type: string
            children: null
