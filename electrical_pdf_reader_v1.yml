    - id: '2700000000019'
      type: custom
      data:
        type: code
        title: 解释MCB、RCB、WDZB等；保留原文及参数差异
        desc: ''
        selected: false
        code_language: python3
        code: "import re\nimport unicodedata\nimport base64\nimport gzip\nimport hashlib\n\
          import hmac\nimport io\nimport json\nimport zipfile\nfrom xml.sax.saxutils\
          \ import escape, quoteattr\nimport math\nimport uuid\nVERSION = '0.1.0'\n\
          SOURCES = {'MCB': 'https://electrification.us.abb.com/back-to-basics/circuit-breaker-basics',\
          \ 'RCD': 'https://www.se.com/us/en/faqs/FA89258/', 'WDZB': 'https://www.qrunning.com/products/view?id=1795&lang=cn'}\n\
          CATEGORY_NAMES = {'unclassified': '保留原文，尚未分类', 'protective_device': '断路器/保护器件',\
          \ 'wire_or_cable': '电线/电缆标注', 'phase': '相别', 'circuit_number': '回路编号', 'transfer_switch':\
          \ '转换开关', 'voltage_ratio': '两侧电压', 'apparent_power': '视在功率', 'power_supply_marking':\
          \ '电源参数', 'device_tag': '器件位号', 'calculation_marking': '计算参数', 'residual_current_marking':\
          \ '剩余电流动作值'}\ndef normalized(text):\n    text = unicodedata.normalize('NFKC',\
          \ str(text)).strip()\n    return re.sub('[‐‑‒–—−]', '-', text).replace('×',\
          \ 'x').replace('＊', '*')\ndef decode(text):\n    raw = str(text)\n    s\
          \ = normalized(raw)\n    upper = s.upper()\n    result = {'raw': raw, 'normalized':\
          \ s, 'category': 'unclassified', 'meaning': '', 'parameters': {}, 'uncertainties':\
          \ [], 'basis': '原图文字；规则解读不等于完成产品选型'}\n    p = result['parameters']\n   \
          \ protection = re.search('(?<![A-Z0-9])(MCCB|MCB|RCBO|RCCB|RCB|RCD)(?=[\\\
          \\d\\\\s/\\\\-]|$)', upper)\n    if protection:\n        prefix = protection.group(1)\n\
          \        names = {'MCCB': '塑壳断路器', 'MCB': '小型断路器', 'RCB': '剩余电流保护器件（保留图纸缩写RCB）',\
          \ 'RCCB': '不带过电流保护的剩余电流动作断路器', 'RCBO': '带过电流保护的剩余电流动作断路器', 'RCD': '剩余电流保护器件统称'}\n\
          \        result.update(category='protective_device', meaning=names[prefix])\n\
          \        p['drawing_abbreviation'] = prefix\n        poles = re.search('(?<!\\\
          \\d)([1-4]P(?:\\\\+N)?)(?![A-Z0-9])', upper)\n        if poles:\n      \
          \      p['pole_count'] = poles.group(1)\n        curve = re.search('(?:^|[/\\\
          \\-\\\\s])([BCD])\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*A(?=$|[/\\\\s])', upper)\n\
          \        if curve:\n            p.update(trip_curve=curve.group(1), rated_current_a=float(curve.group(2)))\n\
          \        else:\n            currents = re.findall('(?<![\\\\d.])(\\\\d+(?:\\\
          \\.\\\\d+)?)\\\\s*A(?=$|[/\\\\s])', upper)\n            if len(currents)\
          \ == 1:\n                p['rated_current_a'] = float(currents[0])\n   \
          \     leak = re.search('(?<![\\\\d.])(\\\\d+(?:\\\\.\\\\d+)?)\\\\s*MA(?=$|[/\\\
          \\s])', upper)\n        if leak:\n            p['residual_operating_current_ma']\
          \ = float(leak.group(1))\n        if prefix == 'RCB':\n            result['uncertainties'].append('RCB缩写不能单独确定RCCB/RCBO订货类别；结合图例、完整型号和器件资料核对')\n\
          \        if prefix == 'MCB' and leak:\n            result['uncertainties'].append('同一标注同时出现MCB和剩余电流值，保留原文，待确认保护类型；不自动改写为RCBO')\n\
          \        if prefix == 'MCCB' and re.search('-MA\\\\d', upper):\n       \
          \     p['trip_marking_raw'] = re.search('MA\\\\d+(?:\\\\.\\\\d+)?A', upper).group()\n\
          \            result['uncertainties'].append('MA为图纸脱扣标识；不得按MCB的B/C/D曲线解释，具体保护功能查原型号资料')\n\
          \    elif re.search('(?<![A-Z0-9])(?:WDZ[A-D1]*N?|NHBV|ZR[BNC]*BV|ZNBV|BV[RV]?|RVV[P]?|UTP/CAT\\\
          \\d)', upper):\n        result.update(category='wire_or_cable', meaning='电线、电缆或通信线标注')\n\
          \        prefix = re.search('WDZB1|WDZBN|WDZB|WDZAN|WDZA|WDZCN|WDZC|WDZN|WDZ',\
          \ upper)\n        if prefix:\n            p['fire_marking_raw'] = prefix.group()\n\
          \            p['halogen_free'] = True\n            p['low_smoke'] = True\n\
          \            p['flame_retardant'] = True\n            if prefix.group()\
          \ == 'WDZB1':\n                p['combustion_performance_grade'] = 'B1'\n\
          \                result['meaning'] = '无卤低烟、燃烧性能B1级电线电缆标识'\n            else:\n\
          \                grade = re.search('WDZ([ABC])', prefix.group())\n     \
          \           if grade:\n                    p['bundled_flame_retardant_category']\
          \ = grade.group(1)\n                if 'N' in prefix.group():\n        \
          \            p['fire_resistant_marked'] = True\n                result['meaning']\
          \ = '无卤低烟阻燃' + (p.get('bundled_flame_retardant_category', '') + '类' if grade\
          \ else '') + '电线电缆标识'\n        family = re.search('(?:WDZ[A-Z0-9]*-)(BYJ|YJY|YJV|RYJS|RYJSP|RYJ|KYJY|KYJYP)(?=-|$)',\
          \ upper)\n        if family:\n            p['wire_family'] = family.group(1)\n\
          \            if family.group(1) == 'BYJ':\n                p['family_meaning']\
          \ = '交联聚烯烃绝缘布电线；线数规格不直接解释成多芯电缆'\n            elif family.group(1) == 'YJY':\n\
          \                p['family_meaning'] = '交联聚乙烯绝缘、聚烯烃护套电力电缆；导体及电压按完整型号/资料核对'\n\
          \        specs = re.search('(?<![\\\\d.])(\\\\d+\\\\s*[X*]\\\\s*\\\\d+(?:\\\
          \\.\\\\d+)?(?:\\\\s*\\\\+\\\\s*\\\\d+\\\\s*[X*]\\\\s*\\\\d+(?:\\\\.\\\\\
          d+)?)*)', upper)\n        if specs:\n            p['conductor_groups'] =\
          \ [{'count': int(n), 'cross_section_mm2': float(a)} for n, a in re.findall('(\\\
          \\d+)\\\\s*[X*]\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)', specs.group())]\n      \
          \      p['conductor_spec_raw'] = specs.group()\n        routes = []\n  \
          \      for match in re.finditer('(?<![A-Z])(JDG|SC|CT)(\\\\d+(?:\\\\.\\\\\
          d+)?)?(?![A-Z])', upper):\n            names = {'JDG': '套接紧定式钢导管', 'SC':\
          \ '钢管敷设标识', 'CT': '电缆桥架敷设标识'}\n            routes.append({'code': match.group(1),\
          \ 'meaning': names[match.group(1)], 'size_marking_raw': match.group(2) or\
          \ ''})\n        if routes:\n            p['containment'] = routes\n    \
          \    locations = {'CC': '顶板内暗敷', 'WC': '墙内暗敷', 'FC': '地板或地坪内暗敷', 'CE': '沿天棚面或顶板面敷设',\
          \ 'WE': '沿墙面敷设'}\n        p['installation_markings'] = [{'code': x, 'common_meaning':\
          \ locations[x]} for x in locations if re.search('(?<![A-Z])' + x + '(?![A-Z])',\
          \ upper)]\n        result['uncertainties'].append('敷设代号含义按项目图例优先；未标注的线路长度、电压等级和N/PE分配不推算')\n\
          \        if upper.startswith('ZNBV'):\n            result['uncertainties'].append('ZNBV保持原文，需核对项目图例；不擅自纠正为其他电线型号')\n\
          \    elif re.fullmatch('L[123](?:\\\\s*[~\\\\-]\\\\s*L[123])?', upper):\n\
          \        result.update(category='phase', meaning='三相交流电相别标识；不作为唯一元件位号')\n\
          \        p['phase_raw'] = s\n    elif re.fullmatch('\\\\d+\\\\s*[#＃]', s):\n\
          \        result.update(category='circuit_number', meaning='图中回路编号；需结合图面确定所属柜体')\n\
          \    elif re.search('\\\\bATS[-\\\\s]', upper):\n        result.update(category='transfer_switch',\
          \ meaning='自动转换开关标识')\n        m = re.search('(\\\\d+(?:\\\\.\\\\d+)?)A',\
          \ upper)\n        if m:\n            p['rated_current_marked_a'] = float(m.group(1))\n\
          \    elif re.fullmatch('\\\\d+(?:\\\\.\\\\d+)?\\\\s*/\\\\s*\\\\d+(?:\\\\\
