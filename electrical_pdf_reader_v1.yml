            L1/L2/L3在相别语境中不是唯一器件位号；1#等通常是回路号，必须结合图例和位置。柜数、单柜用量、标注出现次数分开；两个柜号并列不能推出一个柜里两个相同器件。quantity_per_cabinet只在有明确数量依据时填写，否则null。

            ATS、SPD、变压器、电源、时间控制器、接触器、继电器、接线端子等按实际可见符号识别；不要求每张图都存在它们。重复触点和线圈不一定是不同实物。DC24V电源输出不能误作SPD持续工作电压Uc；不能把交流输入侧断路器推断成直流输出故障。

            技术说明notes保留完整原文和位置。已明确的负载名称或技术要求无需重复提问；不同回路MCB/RCB并存不是设计冲突。疑问issues只写具体unclear/missing/conflict/recognition_limit，给实际位置，不能凭不完整连线宣布设计错误。内部识别不足与客户资料疑问分开描述。

            每页最多80条器件/标注、40条说明、40条疑问。只输出必要简短字段，不长篇推理。若图面过密或重要小字/符号看不清，保留看清的条目，coverage=partial并指出需要局部PDF的区域；不能强行输出完整。整页不可读则page_readable=false、coverage=unreadable。coverage=complete仅为你的覆盖自评，不能代表工程师已验收。

            输出紧凑完整JSON，不加代码块。所有id本页唯一，不得把示例当真实结果：

            {"document_id":"输入实际值","page":1,"page_readable":true,"coverage":"complete/partial/unreadable","drawings":[{"id":"S1","title":"原图标题或可见柜号","bbox":[0.1,0.1,0.9,0.9]}],"items":[{"id":"R001","drawing_id":"S1","raw_text":"实际原文","kind":"器件/线缆/标注类别","meaning":"基于可见符号的简短中文解释","cabinet_id":"明确柜号或空","circuit_no":"明确回路号或空","phase":"明确相别或空","device_tag":"明确位号或空","quantity_per_cabinet":null,"unit":"原图单位或空","parameters":{},"bbox":[0.1,0.1,0.2,0.2],"uncertainties":[]}],"notes":[{"raw_text":"说明原文","meaning":"简短含义","bbox":[0.1,0.1,0.2,0.2]}],"issues":[{"item_id":"实际相关条目或空","kind":"unclear","message":"实际具体疑问","bbox":null}]}。

            参数尽量使用这些字段且保留单位语义：rated_current_a、residual_operating_current_ma、pole_count、trip_curve、breaking_capacity_ka；其他型号参数按原图保留，不猜测缺失字段。

            上次输出未通过校验，请重新查看同一图片，完整输出；校验原因：{{#2700000000014.message#}}'
