    - id: '2700000000022'
      type: custom
      data:
        type: code
        title: 显示真实页数、失败和待核对，不宣称精准验收
        desc: ''
        selected: false
        code_language: python3
        code: "import re\nimport unicodedata\nimport base64\nimport gzip\nimport hashlib\n\
          import hmac\nimport io\nimport json\nimport zipfile\nfrom xml.sax.saxutils\
          \ import escape, quoteattr\nimport math\nimport uuid\nVERSION = '0.1.0'\n\
          SOURCES = {'MCB': 'https://electrification.us.abb.com/back-to-basics/circuit-breaker-basics',\
          \ 'RCD': 'https://www.se.com/us/en/faqs/FA89258/', 'WDZB': 'https://www.qrunning.com/products/view?id=1795&lang=cn'}\n\
          CATEGORY_NAMES = {'unclassified': '保留原文，尚未分类', 'protective_device': '断路器/保护器件',\
          \ 'wire_or_cable': '电线/电缆标注', 'phase': '相别', 'circuit_number': '回路编号', 'transfer_switch':\
          \ '转换开关', 'voltage_ratio': '两侧电压', 'apparent_power': '视在功率', 'power_supply_marking':\
          \ '电源参数', 'device_tag': '器件位号', 'calculation_marking': '计算参数', 'residual_current_marking':\
          \ '剩余电流动作值'}\ndef summary(pages, manifest_json):\n    expected = json.loads(manifest_json\
          \ or '[]')\n    values = [json.loads(x) for x in pages]\n    failed = sum((x['status']\
          \ == 'failed' for x in values))\n    partial = sum((x['data']['coverage']\
          \ != 'complete' for x in values))\n    count = sum((len(x['data']['items'])\
          \ for x in values))\n    issues = sum((len(x['data']['issues']) + sum((bool(i['uncertainties'])\
          \ for i in x['data']['items'])) for x in values))\n    missing = len(expected)\
          \ - len(values)\n    text = '已保存 ' + str(len(values)) + '/' + str(len(expected))\
          \ + ' 页；提取 ' + str(count) + ' 条器件或标注，' + str(issues) + ' 项疑问/不确定记录。'\n \
          \   if missing:\n        text += ' 尚有 ' + str(missing) + ' 页未保存，本次结果不完整。'\n\
          \    if partial:\n        text += ' ' + str(partial) + ' 页为部分识别或不可读，其中 '\
          \ + str(failed) + ' 页未形成可校验结果；请查看对应页的待核对表。'\n    text += '\\n每页分别输出一份Excel，包含子图索引、识别明细、技术说明和待核对。数量不是文字出现次数；结果尚未经过工程师验收。'\n\
          \    if values:\n        samples = [i['raw_text'] for p in values for i\
          \ in p['data']['items'] if i['raw_text']][:8]\n        if samples:\n   \
          \         text += '\\n标注预览：' + '；'.join(samples)\n    return {'message':\
          \ text}\n\ndef main(pages, manifest_json):\n    return summary(pages, manifest_json)\n"
        variables:
        - variable: pages
          value_selector:
          - conversation
          - pdf_pages
        - variable: manifest_json
          value_selector:
          - conversation
          - pdf_manifest
        outputs:
          message:
            type: string
            children: null
