          \    encoded = j(ctx)\n    if len(encoded) > 60000:\n        raise ValueError('单页辅助上下文超过预算，未截断')\n\
          \    return {'context_json': encoded}\n\ndef main(index,manifest_compact):\n\
          \    return page_context(index,manifest_compact)\n"
