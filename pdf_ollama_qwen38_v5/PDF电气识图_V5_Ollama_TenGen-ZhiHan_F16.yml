          \ o['meaning'], str(o['circuit'] or '') + '/' + str(o['phase'] or ''), j(o['literal_parameters']),\
          \ j({'关联': o['associated_parameters'], '支路要求': o['branch_requirements']}),\
          \ '；'.join(o['warnings'])])) + '|')\n    if failed:\n        lines += ['',\
          \ '模型回复失败：'] + ['- 第%d页：%s' % (r['page'], cell(r['error'])) for r in failed]\n\
          \    if unresolved:\n        lines += ['', '识图待核对（不是设计问题单）：'] + ['- 第%d页：%s'\
          \ % (r['page'], cell(r['text'])) for r in unresolved]\n    if not p['native_text'].strip():\n\
          \        lines.append('未获得内置提取文字，本次完全依赖视觉转写，需逐项对照原图。')\n    if len(items)\
