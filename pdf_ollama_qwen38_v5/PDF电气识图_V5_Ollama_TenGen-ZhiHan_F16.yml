          \ '剩余电流保护器件，具体订货类别未明确', 'ATS': '自动转换开关，II后缀不能作为2P依据', 'SPD': '浪涌保护器件候选',\
          \ 'controller': '控制/监测设备，具体功能待核对', 'contactor': '接触器或其图面触点标识', 'relay':\
          \ '继电器或其触点标识', 'timer': '时控器件/功能标识', 'transformer': '变压器', 'dc_power_supply':\
          \ '直流电源规格标识', 'fuse': '熔断保护器件候选', 'cable': '电线、电缆或通信线标注', 'unknown': '类别待核对'}\n\
          \nROUTES = {'CE': '沿顶板面敷设', 'WE': '沿墙面敷设', 'WC': '墙内暗敷', 'CC': '顶板内暗敷',\
          \ 'FC': '地面/地板下敷设，以项目图例为准'}\n\ndef j(v):\n    return json.dumps(v, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False)\n\ndef bind_pages(tool_json, images,\
          \ document_text, notes):\n    try:\n        records = [x for x in tool_json\
          \ or [] if isinstance(x, dict) and 'images' in x]\n        if len(records)\
          \ != 1 or records[0].get('success') is not True:\n            raise ValueError('未收到PDF-to-Images成功记录，请查看现有转图节点')\n\
          \        stats = records[0]\n        pages = stats['images']\n        if\
          \ type(stats.get('total_pages')) is not int or not 1 <= stats['total_pages']\
          \ <= 12:\n            raise ValueError('本次试用支持1至12页，未截取部分页冒充整份识别')\n   \
          \     if stats.get('total_images') != stats['total_pages'] or len(pages)\
          \ != stats['total_pages']:\n            raise ValueError('PDF页数与转图数量不一致，停止识别')\n\
          \        names = [str(x.get('filename') or x.get('name') or '') for x in\
          \ images or []]\n        expected = [x['filename'] for x in pages]\n   \
          \     if len(set(names)) != len(names) or len(set(expected)) != len(expected)\
          \ or set(names) != set(expected):\n            raise ValueError('PDF页图文件缺失或重复，停止识别')\n\
          \        numbers = [x.get('page_number') for x in pages]\n        if any((type(n)\
          \ is not int for n in numbers)) or set(numbers) != set(range(1, len(pages)\
          \ + 1)):\n            raise ValueError('PDF页码缺失或重复')\n        if any((x.get('file_index')\
          \ != 1 for x in pages)):\n            raise ValueError('本次仅允许一份PDF，不混合不同文件的页图')\n\
          \        if isinstance(document_text, list):\n            if any((not isinstance(x,\
          \ str) for x in document_text)):\n                raise ValueError('文字辅助结构无效')\n\
          \            text = '\\n'.join(document_text)\n        elif isinstance(document_text,\
          \ str):\n            text = document_text\n        else:\n            text\
          \ = ''\n        if len(text) > 60000:\n            raise ValueError('PDF全文超过本次上下文预算，未删去后半部分继续识别')\n\
          \        if len(text) + len(str(notes or '')[:3000]) + 1000 > 60000:\n \
          \           raise ValueError('全文和补充说明超过单页上下文预算，尚未调用模型')\n        packet\
          \ = {'schema_version': 'pdf-ollama-page/5', 'images': pages, 'uploaded_names':\
          \ names, 'native_text': text, 'notes': str(notes or '')[:3000], 'page_count':\
          \ len(pages)}\n        encoded = base64.b64encode(zlib.compress(j(packet).encode('utf8'))).decode('ascii')\n\
          \        if len(encoded) > 60000:\n            raise ValueError('整份说明超过节点传输预算')\n\
          \        return {'valid': 'YES', 'manifest_compact': encoded, 'message':\
          \ ''}\n    except (ValueError, TypeError, KeyError, AttributeError) as exc:\n\
          \        return {'valid': 'NO', 'manifest_compact': '', 'message': str(exc)}\n\
          \ndef main(tool_json,images,document_text,notes):\n    return bind_pages(tool_json,images,document_text,notes)\n"
