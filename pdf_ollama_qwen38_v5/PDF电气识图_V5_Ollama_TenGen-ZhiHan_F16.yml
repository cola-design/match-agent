          \nROUTES = {'CE': '沿顶板面敷设', 'WE': '沿墙面敷设', 'WC': '墙内暗敷', 'CC': '顶板内暗敷',\
          \ 'FC': '地面/地板下敷设，以项目图例为准'}\n\ndef j(v):\n    return json.dumps(v, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False)\n\ndef canonical(s):\n    return\
          \ re.sub('\\\\s+', '', norm(s)).upper().replace('×', 'X')\n\ndef checked(raw,\
          \ context_json):\n    ctx = json.loads(context_json)\n    try:\n       \
          \ if not isinstance(raw, str) or not raw.strip() or len(raw) > 45000:\n\
          \            raise ValueError('模型回复为空或过长，请核对Ollama模型和输出预算')\n        s =\
          \ raw.strip()\n        if s.startswith('<think>'):\n            end = s.find('</think>')\n\
          \            if end < 0:\n                raise ValueError('模型仅输出未结束的思考内容，请确认think=false')\n\
          \            s = s[end + len('</think>'):].strip()\n            if not s:\n\
          \                raise ValueError('思考结束后没有JSON正文')\n        if s.startswith('```')\
