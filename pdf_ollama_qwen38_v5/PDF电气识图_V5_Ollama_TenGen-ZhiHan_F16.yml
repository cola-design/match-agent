        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\nMODEL_NAME = 'TenGen-ZhiHan:F16'\n\nCATEGORIES = {'MCB', 'MCCB',\
