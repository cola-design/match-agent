          \            if cat == 'contactor':\n                warnings.append('触点/位号与实体数量、线圈规格仍需核对')\n\
          \            support = 'document_text_present' if native and canonical(label)\
          \ in native else 'image_transcription_only'\n            if support != 'document_text_present':\n\
          \                warnings.append('此转写未在内置提取文字中完整匹配，需对照原图核对')\n         \
