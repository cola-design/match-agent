        code_language: python3
        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\nMODEL_NAME = 'TenGen-ZhiHan:F16'\n\nCATEGORIES = {'MCB', 'MCCB',\
          \ 'RCBO', 'RCCB', 'residual_current_device_unspecified', 'ATS', 'SPD', 'controller',\
          \ 'contactor', 'relay', 'timer', 'transformer', 'dc_power_supply', 'fuse',\
          \ 'cable', 'unknown'}\n\nMEANING = {'MCB': '小型断路器', 'MCCB': '塑壳断路器', 'RCBO':\
          \ '带过电流保护的剩余电流动作断路器', 'RCCB': '不带过电流保护的剩余电流动作断路器', 'residual_current_device_unspecified':\
          \ '剩余电流保护器件，具体订货类别未明确', 'ATS': '自动转换开关，II后缀不能作为2P依据', 'SPD': '浪涌保护器件候选',\
          \ 'controller': '控制/监测设备，具体功能待核对', 'contactor': '接触器或其图面触点标识', 'relay':\
          \ '继电器或其触点标识', 'timer': '时控器件/功能标识', 'transformer': '变压器', 'dc_power_supply':\
          \ '直流电源规格标识', 'fuse': '熔断保护器件候选', 'cable': '电线、电缆或通信线标注', 'unknown': '类别待核对'}\n\
          \nROUTES = {'CE': '沿顶板面敷设', 'WE': '沿墙面敷设', 'WC': '墙内暗敷', 'CC': '顶板内暗敷',\
          \ 'FC': '地面/地板下敷设，以项目图例为准'}\n\ndef j(v):\n    return json.dumps(v, ensure_ascii=False,\
          \ separators=(',', ':'), allow_nan=False)\n\ndef uncompress(value):\n  \
          \  obj = zlib.decompressobj()\n    raw = obj.decompress(base64.b64decode(value,\
          \ validate=True), 600001)\n    if len(raw) > 600000 or not obj.eof or obj.unused_data:\n\
          \        raise ValueError('整份说明超出预算或结构无效')\n    return json.loads(raw)\n\
          \ndef page_context(index, manifest_compact):\n    p = uncompress(manifest_compact)\n\
          \    if isinstance(index, bool) or not isinstance(index, (int, float)) or\
          \ (not math.isfinite(index)) or (index != int(index)) or (not 0 <= index\
          \ < len(p['uploaded_names'])):\n        raise ValueError('页图序号无效')\n   \
          \ name = p['uploaded_names'][int(index)]\n    image = next((x for x in p['images']\
          \ if x['filename'] == name))\n    ctx = {'page': image['page_number'], 'image_name':\
          \ name, 'page_count': p['page_count'], 'whole_document_text': p['native_text'],\
