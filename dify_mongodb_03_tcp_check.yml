app:
  description: 仅检查Dify代码沙箱到MongoDB IPv4地址的TCP端口连通性，不使用账号密码，不访问数据库记录。
  icon: 🧪
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: MongoDB诊断3：TCP端口连通性
  use_icon_as_answer_icon: false
