      positionAbsolute:
        x: 360
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: TCP连通性检查结果：{{#1800000001002.result#}}
        desc: 输出 MongoDB 测试结果。
        selected: false
        title: 输出端口检查结果
        type: answer
