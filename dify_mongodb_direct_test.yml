app:
  description: 仅用于验证 Dify Python 代码节点是否可以访问 MongoDB；不连接正式报价流程。
  icon: 🧪
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: MongoDB直连测试
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    retriever_resource:
      enabled: false
    opening_statement: 请输入 MongoDB 连接字符串和数据库名进行测试。
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: 1800000001001-source-1800000001002-target
      source: '1800000001001'
      sourceHandle: source
      target: '1800000001002'
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: answer
      id: 1800000001002-source-1800000001003-target
      source: '1800000001002'
      sourceHandle: source
      target: '1800000001003'
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 填写只读 MongoDB 连接字符串和数据库名称。
        selected: false
        title: 输入 MongoDB 参数
        type: start
        variables:
        - label: MongoDB连接字符串
          max_length: 500
          options: []
          required: true
          type: paragraph
          variable: mongo_uri
        - label: 数据库名称
          max_length: 100
          options: []
          required: true
          type: text-input
          variable: db_name
      height: 160
      id: '1800000001001'
      position:
        x: 30
        y: 200
      positionAbsolute:
        x: 30
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: "import json\n\ndef main(mongo_uri: str, db_name: str) -> dict:\n    try:\n        from pymongo import MongoClient\n        client = MongoClient(mongo_uri, serverSelectionTimeoutMS=3000)\n        client.admin.command(\"ping\")\n        db = client[db_name]\n        result = {\n            \"ok\": True,\n            \"products\": db.products.count_documents({}),\n            \"prices\": db.prices.count_documents({}),\n            \"active_products\": db.products.count_documents({\"data_status\": \"ACTIVE\", \"source_status\": \"有效\"}),\n            \"active_prices\": db.prices.count_documents({\"status\": \"ACTIVE\"})\n        }\n        return {\"result\": json.dumps(result, ensure_ascii=False)}\n    except Exception as e:\n        return {\"result\": json.dumps({\"ok\": False, \"error\": type(e).__name__ + \": \" + str(e)}, ensure_ascii=False)}\n"
        code_language: python3
        desc: 测试 PyMongo、MongoDB 连通性和 products/prices 计数。
        isInIteration: false
        isInLoop: false
        iteration_id: ''
        outputs:
          result:
            children: null
            type: string
        selected: false
        title: Python 直连 MongoDB 测试
        type: code
        variables:
        - value_selector:
          - '1800000001001'
          - mongo_uri
          value_type: string
          variable: mongo_uri
        - value_selector:
          - '1800000001001'
          - db_name
          value_type: string
          variable: db_name
      height: 130
      id: '1800000001002'
      position:
        x: 360
        y: 200
      positionAbsolute:
        x: 360
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: MongoDB测试结果：{{#1800000001002.result#}}
        desc: 输出 MongoDB 测试结果。
        selected: false
        title: 输出测试结果
        type: answer
        variables: []
      height: 120
      id: '1800000001003'
      position:
        x: 700
        y: 200
      positionAbsolute:
        x: 700
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 1
