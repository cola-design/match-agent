          \            if cat not in CATEGORIES:\n                cat = 'unknown'\n\
          \            if drawing not in drawing_by_id:\n                drawing =\
          \ None\n            literal = decode(label)\n            p = dict(literal['explicit_parameters'])\n\
          \            source_cat = p.get('drawing_abbreviation')\n            if\
          \ literal['kind'] in ('phase', 'circuit_tag', 'calculation', 'ats_class',\
