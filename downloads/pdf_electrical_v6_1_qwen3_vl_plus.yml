    - id: '3100000000023'
      type: custom
      data:
        type: code
        title: 统一汇总中文解释与回路核对
        desc: ''
        selected: false
        code_language: python3
        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\nCATEGORIES = {'MCB', 'MCCB', 'RCBO', 'RCCB', 'residual_current_device_unspecified',\
          \ 'ATS', 'SPD', 'controller', 'contactor', 'relay', 'timer', 'transformer',\
          \ 'dc_power_supply', 'fuse', 'cable', 'unknown'}\n\nVIEWS = {'single_line',\
          \ 'control', 'layout', 'schedule', 'mixed', 'unknown'}\n\ndef issue(code,\
          \ message, item_id=None, repairable=False):\n    return {'code': code, 'message':\
          \ message, 'item_id': item_id, 'repairable': repairable}\n\ndef literal_key(raw):\n\
          \    s = canonical(raw)\n    m = re.fullmatch('\\\\d+[X*]\\\\((.*)\\\\)',\
          \ s)\n    return m[1] if m else s\n\ndef same_label(a, b):\n    if literal_key(a)\
          \ == literal_key(b):\n        return True\n    pa, pb = (decode(a)['explicit_parameters'],\
          \ decode(b)['explicit_parameters'])\n    if 'category_raw' in pa and 'category_raw'\
          \ in pb and (('UTP' in norm(a).upper()) == ('UTP' in norm(b).upper())):\n\
          \        return pa['category_raw'] == pb['category_raw']\n    return False\n\
          \ndef source_inventory(text):\n    \"\"\"Unordered source-text mentions,\
          \ not geometry or purchase quantities.\"\"\"\n    source = norm(text)\n\
          \    candidates = []\n    markers = []\n    occupied = []\n    patterns\
          \ = ['(?<![A-Z0-9])(?:\\\\d+\\\\s*[*x×]\\\\s*\\\\()?WDZ[A-Z0-9]*-[A-Z0-9.*x×/+(),\\\
          \\-]+(?:\\\\s+(?:CE|WE|WC|CC|FC)\\\\b)*', '(?<![A-Z0-9])(?:NHBV|ZNBV|BVR?)-[A-Z0-9.*x×/+,\\\
          \\-]+', '(?<![A-Z0-9])(?:UTP|STP)\\\\s*/\\\\s*CAT\\\\s*[5-8](?:E|A)?(?![A-Z0-9])',\
