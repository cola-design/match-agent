          \ 'fuse', 'cable': 'cable', 'wire': 'cable', 'unknown': 'unknown', '小型断路器':\
          \ 'MCB', '塑壳断路器': 'MCCB', '剩余电流保护器件': 'residual_current_device_unspecified',\
          \ '漏电保护器': 'residual_current_device_unspecified', '自动转换开关': 'ATS', '双电源转换开关':\
          \ 'ATS', '浪涌保护器': 'SPD', '电涌保护器': 'SPD', '控制器': 'controller', '接触器': 'contactor',\
          \ '继电器': 'relay', '时间控制器': 'timer', '时控开关': 'timer', '变压器': 'transformer',\
          \ '直流电源': 'dc_power_supply', '熔断器': 'fuse', '线缆': 'cable', '电缆': 'cable',\
          \ '电线': 'cable', '通信线': 'cable', '未知': 'unknown'}\n\ndef main(tool_json,images,document_text,notes):\n\
          \    return bind_pages(tool_json,images,document_text,notes)\n"
        variables:
