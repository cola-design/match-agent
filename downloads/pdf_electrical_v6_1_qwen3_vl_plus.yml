          \ [])\n        if not isinstance(drawings, list) or not 1 <= len(drawings)\
          \ <= 6:\n            raise ValueError('子图信息无效')\n        if not isinstance(circuits,\
          \ list) or len(circuits) > 20:\n            raise ValueError('回路表结构或数量无效')\n\
          \        keys = set()\n        ds = []\n        for row in drawings:\n \
          \           key = short(row.get('id'), '子图ID', 16, False)\n            if\
