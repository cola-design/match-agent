          \ 12), 'cable_labels': strings(row.get('cable_labels', []), '回路线缆原文', 8)})\n\
          \        plan = {'status': 'parsed', 'readable': d['readable'], 'view':\
          \ d['view'], 'drawings': ds, 'circuits': cs, 'unresolved': strings(d.get('unresolved',\
          \ []), '回路识别待确认', 12), 'diagnostics': {'stage': 'outline_parsed', 'drawing_ids':\
          \ sorted(keys), 'circuit_drawing_references': [{'id': c['id'], 'drawing_id':\
          \ c['drawing_id']} for c in cs]}}\n        encoded = j(plan)\n        if\
          \ len(encoded) > 20000:\n            raise ValueError('回路表超过当前节点预算')\n \
          \       return {'outline_json': encoded}\n    except (ValueError, TypeError,\
          \ KeyError, AttributeError) as exc:\n        return {'outline_json': j({'status':\
          \ 'failed', 'error': str(exc), 'view': 'unknown', 'drawings': [], 'circuits':\
          \ [], 'diagnostics': response_diagnostics(raw, 'outline_unusable', exc)})}\n\
          \nfrom collections import Counter\n\nimport base64\n\nimport html\n\nimport\
          \ json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport zlib\n\
          \ndef j(v):\n    return json.dumps(v, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef canonical(s):\n    return re.sub('\\\\s+',\
          \ '', norm(s)).upper().replace('×', 'X')\n\ndef norm(s):\n    return re.sub('[‐‑‒–—−]',\
          \ '-', unicodedata.normalize('NFKC', str(s))).strip().replace('×', 'x')\n\
          \nimport json\n\nimport math\n\nimport unicodedata\n\nALIASES = {'mcb':\
          \ 'MCB', 'mccb': 'MCCB', 'rcbo': 'RCBO', 'rccb': 'RCCB', 'rcb': 'residual_current_device_unspecified',\
          \ 'rcd': 'residual_current_device_unspecified', 'residual_current_device_unspecified':\
          \ 'residual_current_device_unspecified', 'ats': 'ATS', 'spd': 'SPD', 'controller':\
          \ 'controller', 'contactor': 'contactor', 'relay': 'relay', 'timer': 'timer',\
          \ 'transformer': 'transformer', 'dc_power_supply': 'dc_power_supply', 'fuse':\
          \ 'fuse', 'cable': 'cable', 'wire': 'cable', 'unknown': 'unknown', '小型断路器':\
          \ 'MCB', '塑壳断路器': 'MCCB', '剩余电流保护器件': 'residual_current_device_unspecified',\
          \ '漏电保护器': 'residual_current_device_unspecified', '自动转换开关': 'ATS', '双电源转换开关':\
          \ 'ATS', '浪涌保护器': 'SPD', '电涌保护器': 'SPD', '控制器': 'controller', '接触器': 'contactor',\
          \ '继电器': 'relay', '时间控制器': 'timer', '时控开关': 'timer', '变压器': 'transformer',\
          \ '直流电源': 'dc_power_supply', '熔断器': 'fuse', '线缆': 'cable', '电缆': 'cable',\
          \ '电线': 'cable', '通信线': 'cable', '未知': 'unknown'}\n\ndef response_diagnostics(raw,\
          \ stage, error=None, adaptation=None, plan=None):\n    text = raw if isinstance(raw,\
          \ str) else json.dumps(raw, ensure_ascii=False, default=str)\n    out =\
          \ {'stage': stage, 'raw_response_chars': len(text), 'raw_response_excerpt':\
          \ text[:1800], 'excerpt_truncated': len(text) > 1800}\n    if error is not\
          \ None:\n        out.update(error_type=type(error).__name__, error=str(error))\n\
          \        pos = getattr(error, 'pos', None)\n        if isinstance(pos, int):\n\
          \            out['parse_error_context'] = text[max(0, pos - 160):pos + 160]\n\
          \    if adaptation:\n        out['item_metadata'] = adaptation['item_metadata']\n\
          \        out['unparsed_records'] = adaptation['unparsed_records']\n    \
          \    out['unbound_circuits'] = adaptation['unbound_circuits']\n        out['defined_drawing_ids']\
          \ = adaptation['defined_drawing_ids']\n    if plan:\n        out['outline_status']\
          \ = plan.get('status')\n        if plan.get('error'):\n            out['outline_error']\
          \ = plan['error']\n        if plan.get('diagnostics'):\n            out['outline_diagnostics']\
          \ = plan['diagnostics']\n    return out\n\ndef main(raw,context_json):\n\
          \    return parse_outline(raw,context_json)\n"
