          \   s = '\\n'.join(s.splitlines()[1:-1]).strip()\n\n    def pairs(values):\n\
          \        d = {}\n        for k, v in values:\n            if k in d:\n \
          \               raise ValueError('JSON有重复字段：' + k)\n            d[k] = v\n\
          \        return d\n\n    def constant(_):\n        raise ValueError('JSON含非有限数值')\n\
          \    d = json.loads(s, object_pairs_hook=pairs, parse_constant=constant)\n\
          \    if not isinstance(d, dict):\n        raise ValueError('模型顶层不是JSON对象')\n\
