          \            o['source_text_supported'] = bool(canonical(label) in canonical(ctx['whole_document_text'])\
          \ or any((same_label(label, x['raw']) for x in ctx['source_inventory']['candidates'])))\n\
          \            items.append(o)\n            by_id[iid] = o\n        cs = []\n\
          \        cids = set()\n        scopes = set()\n        assigned = {}\n \
