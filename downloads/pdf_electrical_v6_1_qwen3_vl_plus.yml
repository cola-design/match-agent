          \ 'ATS', 'SPD', 'controller', 'contactor', 'relay', 'timer', 'transformer',\
          \ 'dc_power_supply', 'fuse', 'cable', 'unknown'}\n\nVIEWS = {'single_line',\
          \ 'control', 'layout', 'schedule', 'mixed', 'unknown'}\n\ndef read_json(raw):\n\
          \    if not isinstance(raw, str) or not raw.strip() or len(raw) > 50000:\n\
          \        raise ValueError('模型回复为空或超过预算')\n    s = raw.strip()\n    if s.startswith('<think>'):\n\
          \        end = s.find('</think>')\n        if end < 0:\n            raise\
