          \   return [short(x, name, 180, False) for x in value]\n\ndef literal_key(raw):\n\
          \    s = canonical(raw)\n    m = re.fullmatch('\\\\d+[X*]\\\\((.*)\\\\)',\
          \ s)\n    return m[1] if m else s\n\ndef same_label(a, b):\n    if literal_key(a)\
