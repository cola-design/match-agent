          \ or len(value) > limit:\n        raise ValueError(name + '结构或数量无效')\n \
          \   return [short(x, name, 180, False) for x in value]\n\ndef parse_outline(raw,\
          \ context_json):\n    ctx = json.loads(context_json)\n    try:\n       \
          \ d = read_json(raw)\n        if type(d.get('readable')) is not bool or\
