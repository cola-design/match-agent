          \ cid in ids or drawing not in keys:\n                raise ValueError('回路ID重复或子图引用无效')\n\
          \            ids.add(cid)\n            tag = short(row.get('tag'), '图面回路号',\
          \ 40, False)\n            if (drawing, canonical(tag)) in tag_scopes:\n\
          \                raise ValueError('同一子图重复列出相同回路号')\n            tag_scopes.add((drawing,\
          \ canonical(tag)))\n            cs.append({'id': cid, 'drawing_id': drawing,\
          \ 'tag': tag, 'phase': short(row.get('phase'), '相别', 40), 'load': short(row.get('load'),\
