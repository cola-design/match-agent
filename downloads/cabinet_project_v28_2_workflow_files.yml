          \ = json.loads(context_json)\n    issues = []\n    rows = []\n    anchors\
          \ = []\n    drawings = []\n    links = []\n    ids = set()\n    rect = ctx.get('crop_audit',\
          \ {}).get('actual_rect', ctx['rect'])\n    packet = {'job': ctx, 'status':\
          \ 'parsed', 'observations': rows, 'anchors': anchors, 'drawings': drawings,\
          \ 'links': links, 'issues': issues}\n    packet['job'] = {k: v for k, v\
          \ in ctx.items() if k not in ('source_text', 'source_text_scope', 'notes')}\n\
          \    try:\n        data = read_object(raw)\n        if type(data.get('readable'))\
          \ is not bool or type(data.get('view_complete')) is not bool:\n        \
          \    raise ValueError('回复缺少可读状态和当前视图完整状态')\n        if data['readable']\
          \ is False:\n            packet['status'] = 'unreadable'\n            issues.append(problem('view_unreadable',\
          \ '模型报告当前视图不可读；保留已有文字，不认定本视图通过'))\n        for key, limit in [('objects',\
          \ 64), ('anchors', 30), ('drawings', 8), ('links', 120)]:\n            if\
          \ not isinstance(data.get(key, []), list) or len(data.get(key, [])) > limit:\n\
          \                raise ValueError(key + '结构或数量超过协议预算；未截去后续记录')\n       \
          \ object_ids = Counter((clean_text(v.get('id'), 50) for v in data.get('objects',\
          \ []) if isinstance(v, dict)))\n        anchor_ids = Counter((clean_text(v.get('id'),\
          \ 50) for v in data.get('anchors', []) if isinstance(v, dict)))\n      \
          \  ambiguous_refs = {key for key, count in object_ids.items() if key is\
          \ not None and count > 1}\n        ambiguous_refs.update((key for key, count\
          \ in anchor_ids.items() if key is not None and count > 1))\n        for\
          \ index, value in enumerate(data.get('objects', []), 1):\n            if\
          \ not isinstance(value, dict) or not clean_text(value.get('raw')):\n   \
          \             issues.append(problem('unparsed_observation', '第%d条标注缺少可读原文，已保留诊断'\
          \ % index, raw_excerpt=j(value)[:400]))\n                continue\n    \
          \        local_id = clean_text(value.get('id'), 50)\n            if local_id\
          \ is None or local_id in ids:\n                local_id = 'UNBOUND%d' %\
          \ index\n                issues.append(problem('ambiguous_local_id', '缺失或重复ID已另存；引用原ID的关系不能据此自动确认'))\n\
          \            ids.add(local_id)\n            row = {'local_id': local_id,\
          \ 'raw': value['raw'].strip(), 'kind': value.get('kind'), 'category': clean_text(value.get('category'),\
          \ 60) or 'unknown', 'bbox': map_box(value.get('bbox'), rect), 'local_bbox':\
          \ value.get('bbox'), 'symbol': clean_text(value.get('symbol'), 60)}\n  \
          \          row['kind'] = kind_of(row)\n            row['job_id'] = ctx['job_id']\n\
          \            row['page'] = ctx['page']\n            if row['bbox'] is None:\n\
          \                issues.append(problem('position_unknown', '“%s”缺少有效位置；文字保留，不能据此合并或绑定回路'\
          \ % row['raw']))\n            rows.append(row)\n        for index, value\
          \ in enumerate(data.get('anchors', []), 1):\n            if not isinstance(value,\
          \ dict) or not clean_text(value.get('tag'), 60):\n                issues.append(problem('anchor_unparsed',\
          \ '有回路号记录缺少原文'))\n                continue\n            tag = value['tag'].strip()\n\
          \            if tag.upper() in ('I/O', 'IO', 'PE', 'N', 'L1', 'L2', 'L3')\
          \ or tag in ('回路总线', '总线'):\n                issues.append(problem('not_outgoing_circuit',\
          \ '“%s”作为端口/相别/说明保留，不编造为出线回路' % tag))\n                continue\n      \
          \      local_id = clean_text(value.get('id'), 50) or 'A%d' % index\n   \
          \         if anchor_ids.get(local_id, 0) > 1:\n                local_id\
          \ = 'UNBOUND_ANCHOR%d' % index\n                issues.append(problem('ambiguous_anchor_id',\
          \ '回路记录ID重复，保留回路位置但不使用歧义引用'))\n            tag_box = map_box(value.get('bbox'),\
          \ rect)\n            if tag_box is None:\n                issues.append(problem('anchor_position_unknown',\
          \ '回路%s缺少可用的图面位置，未按顺序补号' % tag))\n                continue\n           \
          \ anchors.append({'local_id': local_id, 'tag': tag, 'bbox': tag_box, 'page':\
          \ ctx['page'], 'load': clean_text(value.get('load')), 'phase': clean_text(value.get('phase'),\
          \ 40), 'load_bbox': map_box(value.get('load_bbox'), rect), 'direction':\
          \ value.get('direction') if value.get('direction') in ('horizontal', 'vertical')\
          \ else 'unknown', 'job_id': ctx['job_id']})\n        for index, value in\
          \ enumerate(data.get('drawings', []), 1):\n            if not isinstance(value,\
          \ dict):\n                continue\n            tags = value.get('cabinet_tags',\
          \ [])\n            drawings.append({'id': 'D%d' % index, 'model_id': clean_text(value.get('id'),\
          \ 50), 'bbox': map_box(value.get('bbox'), rect), 'title': clean_text(value.get('title')),\
          \ 'cabinet_tags': [x for x in tags if clean_text(x, 80)] if isinstance(tags,\
          \ list) else [], 'page': ctx['page'], 'job_id': ctx['job_id']})\n      \
          \  for value in data.get('links', []):\n            if not isinstance(value,\
          \ dict) or value.get('type') not in ('member', 'parameter'):\n         \
          \       continue\n            source, target = (clean_text(value.get('source'),\
          \ 50), clean_text(value.get('target'), 50))\n            if source in ambiguous_refs\
          \ or target in ambiguous_refs:\n                issues.append(problem('ambiguous_relation',\
          \ '有关系引用了重复ID，未猜测它指向哪个位置'))\n                continue\n            if source\
          \ and target:\n                links.append({'type': value['type'], 'source':\
          \ source, 'target': target, 'trace_visible': value.get('trace_visible')\
          \ is True, 'reason': clean_text(value.get('reason')), 'job_id': ctx['job_id'],\
          \ 'page': ctx['page']})\n        if data.get('view_complete') is not True:\n\
          \            issues.append(problem('view_incomplete', '当前视图未完整读取；不会用本视图替代整页验收'))\n\
          \        for text in data.get('unresolved', []) if isinstance(data.get('unresolved',\
