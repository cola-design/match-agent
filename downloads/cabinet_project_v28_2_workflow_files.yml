          \ import urlsplit\nfrom xml.etree import ElementTree as ET\nSCOPES = {'OUR_PURCHASE',\
          \ 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED', 'RESERVED'}\nYES = {'是', '确认',\
          \ '已确认', '同意', '采用', 'YES', 'yes'}\nSCOPE_NAMES = {'OUR_PURCHASE': '我方采购',\
          \ 'CUSTOMER_SUPPLIED': '甲供', 'UTILITY_SUPPLIED': '供电局安装', 'RESERVED': '仅预留'}\n\
          MAX_ITEMS = 100\nMAX_PAGES = 20\nSTAGE_NAMES = {'READING': '读取项目资料', 'SOURCE_REVIEW':\
          \ '待图纸和问题清单核对', 'MATCH_PENDING': '待数据库选型', 'SELECTION_REVIEW': '待选型清单确认',\
          \ 'PRICE_PENDING': '待查询报价参考价', 'QUOTE_REVIEW': '待采购报价表确认回传', 'QUOTE_CONFIRMED':\
          \ '报价已确认，可生成排产资料', 'PRODUCTION_READY': '排产资料已生成，待企业工艺复核'}\nROLE_NAMES =\
          \ {'MCB': '小型断路器', 'MCCB': '塑壳断路器', 'RCBO': '漏电断路器', 'RCCB': '剩余电流动作保护器',\
          \ 'residual_current_device_unspecified': '剩余电流保护器件', 'ATS': '自动转换开关', 'SPD':\
          \ '电涌保护器', 'controller': '控制器', 'contactor': '接触器', 'relay': '继电器', 'timer':\
          \ '时间控制器', 'transformer': '变压器', 'dc_power_supply': '直流电源', 'fuse': '熔断器',\
          \ 'cable': '线缆', 'unknown': '待确认器件'}\ndef j(value):\n    return json.dumps(value,\
          \ ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False)\n\
          def number(value, positive=False):\n    try:\n        value = Decimal(str(value))\n\
          \    except (InvalidOperation, ValueError, TypeError):\n        raise ValueError('请填写有效数字')\
          \ from None\n    if not value.is_finite() or (positive and value <= 0):\n\
          \        raise ValueError('数字超出允许范围')\n    return value\ndef pack(state):\n\
          \    raw = j(state).encode()\n    if len(raw) > 700000:\n        raise ValueError('项目数据过大，请按柜号拆分；未保留半份数据')\n\
          \    result = 'N20:' + base64.b64encode(gzip.compress(raw, mtime=0)).decode()\n\
          \    if len(result) > 55000:\n        raise ValueError('项目上下文超过Dify单变量预算，请按柜号拆分')\n\
          \    return result\ndef unpack(value):\n    if not value:\n        return\
          \ {}\n    if not str(value).startswith('N20:'):\n        raise ValueError('旧版本项目不能混用，请新建项目')\n\
          \    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(value[4:], validate=True)))\
          \ as stream:\n        raw = stream.read(700001)\n    if len(raw) > 700000:\n\
          \        raise ValueError('上下文超出处理上限')\n    state = json.loads(raw)\n  \
          \  if not isinstance(state, dict):\n        raise ValueError('项目上下文无效')\n\
          \    return state\ndef stamp(state, action, approver=''):\n    state.setdefault('history',\
          \ []).append({'action': action, 'approver': approver, 'revision': state['revision'],\
          \ 'at': datetime.now(timezone.utc).isoformat(timespec='seconds')})\n   \
          \ state['history'] = state['history'][-25:]\ndef norm(value):\n    if value\
          \ is None or str(value).strip() in ('nan', 'NaN', 'None'):\n        return\
          \ ''\n    return ' '.join(str(value).replace('|', '／').split()).strip()\n\
          def parse_markdown(text):\n    records = {}\n    headers = None\n    for\
          \ line in str(text or '').splitlines():\n        if not line.strip().startswith('|'):\n\
          \            continue\n        cells = [x.strip() for x in line.strip()[1:-1].split('|')]\n\
          \        if cells and cells[0] == '记录类型':\n            headers = cells\n\
          \            continue\n        if not headers or not cells or re.fullmatch(':?-+:?',\
          \ cells[0]):\n            continue\n        if cells[0] not in ('ISSUE',\
          \ 'BOM', 'PRICE', 'CHANGE', 'CAB', 'SETTINGS', 'CAD', 'META', 'PREVIEW',\
          \ 'SOURCE', 'SOURCEADD', 'QUOTE', 'TECH'):\n            continue\n     \
          \   if len(cells) != len(headers):\n            raise ValueError('确认表含分隔符或结构变化，请勿在单元格中填写竖线符号')\n\
          \        row = {k: norm(v) for k, v in zip(headers, cells)}\n        key\
          \ = (row['记录类型'], row['行ID'])\n        if key in records:\n            raise\
          \ ValueError('确认表行ID重复，不能关联答复')\n        records[key] = row\n    return\
          \ records\ndef equal_cell(a, b):\n    if norm(a) == norm(b):\n        return\
          \ True\n    try:\n        return number(a) == number(b)\n    except ValueError:\n\
          \        return False\ndef parse_form(state, text, kind):\n    records =\
          \ parse_markdown(text)\n    pieces = sorted(((rid, row['值']) for (typ, rid),\
          \ row in records.items() if typ == 'META' and rid.startswith('PART_')))\n\
          \    if [rid for rid, _ in pieces] != ['PART_' + str(i).zfill(4) for i in\
          \ range(1, len(pieces) + 1)] or not pieces:\n        raise ValueError('系统上下文缺段；请使用本项目最新确认表')\n\
          \    encoded = ''.join((value for _, value in pieces))\n    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(encoded,\
          \ validate=True))) as stream:\n        raw = stream.read(700001)\n    if\
          \ len(raw) > 700000:\n        raise ValueError('确认表上下文超出容量')\n    packet\
          \ = json.loads(raw)\n    signature = records.get(('META', 'SIGNATURE'),\
          \ {}).get('值', '')\n    expected = hmac.new(state['sign_key'].encode(),\
          \ raw, hashlib.sha256).hexdigest()\n    if not hmac.compare_digest(signature,\
          \ expected):\n        raise ValueError('确认单签名无效，固定数据可能被改动')\n    if packet['project_id']\
          \ != state['project_id'] or packet['kind'] != kind:\n        raise ValueError('确认表所属项目或类型不匹配')\n\
          \    if packet['revision'] != state['revision']:\n        raise ValueError('确认表已过期，请回传最新版本')\n\
          \    readonly = packet['readonly']\n    allowed = {(x['type'], x['id'])\
          \ for x in readonly}\n    if {(t, r) for t, r in records if t != 'META'}\
          \ != allowed:\n        raise ValueError('确认表行数/行ID发生变化，请下载最新表重填')\n    for\
          \ record in readonly:\n        row = records[record['type'], record['id']]\n\
          \        for key, value in record['values'].items():\n            if key\
          \ not in row or not equal_cell(row[key], value):\n                raise\
          \ ValueError('固定字段被改动：' + key + '；请在修订JSON说明变更')\n    approver = records.get(('SETTINGS',\
          \ 'APPROVER'), {}).get('确认人', '')\n    if len(approver) < 2:\n        raise\
          \ ValueError('请在填写说明中填写实际确认人')\n    return (records, approver)\ndef full_status(state):\n\
          \    if not state:\n        return '先填写项目名称并上传完整图纸PDF，发送“开始选型”。技术协议可选。'\n\
          \    return '项目：%s；版本：%s；阶段：%s。\\n流程：识图核对 → 数据库选型 → 选型确认 → 采购报价表 → 报价确认回传\
          \ → 排产技术资料。' % (state['name'], state['revision'], STAGE_NAMES.get(state['stage'],\
          \ state['stage']))\ndef approval_text(value):\n    text = str(value or '').strip()\n\
          \    return len(text) >= 4 and (not re.search('尚未|未完成|未核对|未确认|待核对|待确认|不通过|不同意|不确认|未通过',\
          \ text))\ndef reviewed_source_item(item, row, cabinets):\n    if row['确认']\
          \ not in YES:\n        raise ValueError('所有保留或补录条目都需核对并明确确认')\n    if row['确认柜组']\
          \ not in cabinets:\n        raise ValueError('元件所属柜组不在已确认柜组中')\n    req\
          \ = json.loads(row['确认技术参数JSON'] or '{}')\n    if not isinstance(req, dict):\n\
          \        raise ValueError('技术参数JSON必须为对象')\n    q = number(row['确认单柜数量'],\
          \ True)\n    scope = row['供货范围']\n    mode = row['采购方式']\n    if scope not\
          \ in ('OUR_PURCHASE', 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED', 'RESERVED'):\n\
          \        raise ValueError('供货范围代码不正确')\n    if mode not in ('CATALOG', 'NON_CATALOG'):\n\
          \        raise ValueError('采购方式必须为CATALOG或NON_CATALOG')\n    if mode ==\
          \ 'NON_CATALOG' and (not row['非标依据'].strip()):\n        raise ValueError('非标采购需明确规格和依据')\n\
          \    if not row['确认型号'].strip() or not row['确认元件类别'].strip() or (not row['计量单位'].strip()):\n\
          \        raise ValueError('型号、类别和单位必须填写')\n    if '待确认' in row['确认元件类别']:\n\
