          \ 'cable': '线缆', 'unknown': '待确认器件'}\nimport json\nimport re\nfrom decimal\
          \ import Decimal, InvalidOperation\nCODE_RE = re.compile('物料编码\\\\s*[:：]\\\
          \\s*([A-Z][A-Z0-9_-]{5,}|\\\\d{8,16})(?![A-Z0-9_-])', re.I)\nFIELDS = ('物料编码',\
