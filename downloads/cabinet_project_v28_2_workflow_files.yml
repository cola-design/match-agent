          \ [], 'anchors': [], 'drawings': [], 'links': [], 'issues': [problem('view_failed',\
          \ '视图结果超过传输预算，未假称完整')]})}\n    return {'packet_json': result}\n\ndef main(raw,context_json):\n\
          \    return parse_view(raw,context_json)\n"
