  environment_variables:
  - id: 77a5f317-0fef-5830-a3c5-0664a84c91d1
    name: MONGODB_API_BASE_URL
    value_type: string
    value: ''
    description: 产品只读API根地址，不包含/v1或/live
    selector:
    - env
    - MONGODB_API_BASE_URL
  - id: c9e460e3-0b9e-5ac1-b6fb-f0c00c7d177f
    name: MONGODB_API_KEY
    value_type: secret
    value: ''
    description: 产品API访问密钥
    selector:
    - env
    - MONGODB_API_KEY
  - id: adf2e013-4b1d-50fb-9e4d-7ceea0d333ca
    name: MATERIAL_MARKUP_RATE
    value_type: string
    value: '0.15'
    description: 仅用于待确认报价表的参考预填，仍需确认
    selector:
    - env
    - MATERIAL_MARKUP_RATE
  - id: 76c31e54-132e-5c9e-93b9-f5cdb4b474b1
    name: QUOTE_DISCOUNT_RATE
    value_type: string
    value: '0'
    description: 参考折扣率，仍需确认
    selector:
    - env
    - QUOTE_DISCOUNT_RATE
  - id: 47a71957-e3f4-41c4-9130-66ba076a57ac
    name: DIFY_FILES_BASE_URL
    value_type: string
    value: http://api:5001
    selector:
    - env
    - DIFY_FILES_BASE_URL
    description: 插件读取Dify自身文件的根地址，默认标准Docker内部地址；不是产品查询API地址。
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .xlsx
      allowed_file_types:
      - document
      allowed_file_upload_methods:
      - local_file
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 5
    opening_statement: 填写项目名称并上传图纸PDF，技术协议可选，发送“开始选型”。下载问题清单核对后上传并发送“提交问题清单”；随后依次回传“提交选型确认”“提交报价表”。报价确认后使用“生成排产资料”获取表格。可随时“查看项目”。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始选型
    - 提交问题清单
    - 提交选型确认
    - 提交报价表
    - 查看项目
    - 生成排产资料
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '2800000000001'
      type: custom
      data:
        type: start
        title: 首次填写项目；各阶段确认表在聊天框回传
        desc: ''
        selected: false
        variables:
        - variable: project_name
          label: 项目名称（新建时填写）
          type: text-input
          required: false
          max_length: 100
          options: []
        - variable: pdf_files
          label: 客户图纸PDF（首次上传；也可在聊天框上传）
          type: file-list
          required: false
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          allowed_file_upload_methods:
          - local_file
        - variable: technical_files
          label: 技术协议PDF（选填，原件由Dify保存）
          type: file-list
          required: false
          max_length: 3
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .pdf
          allowed_file_upload_methods:
          - local_file
        - variable: notes
          label: 项目补充说明（选填）
          type: paragraph
          required: false
          max_length: 3000
          options: []
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 260
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '2800000000002'
      type: custom
      data:
        type: code
        title: 识别明确操作，严格区分项目阶段
        desc: ''
        selected: false
        code_language: python3
        code: "import base64\nfrom copy import deepcopy\nfrom datetime import datetime,\
          \ timezone\nfrom decimal import Decimal, InvalidOperation, ROUND_HALF_UP\n\
          import gzip\nimport hashlib\nimport hmac\nimport io\nimport json\nimport\
          \ re\nimport uuid\nimport zipfile\nfrom xml.sax.saxutils import escape,\
          \ quoteattr\nfrom decimal import Decimal, ROUND_HALF_UP\nfrom urllib.parse\
          \ import urlsplit\nfrom xml.etree import ElementTree as ET\nSCOPES = {'OUR_PURCHASE',\
          \ 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED', 'RESERVED'}\nYES = {'是', '确认',\
          \ '已确认', '同意', '采用', 'YES', 'yes'}\nSCOPE_NAMES = {'OUR_PURCHASE': '我方采购',\
          \ 'CUSTOMER_SUPPLIED': '甲供', 'UTILITY_SUPPLIED': '供电局安装', 'RESERVED': '仅预留'}\n\
          MAX_ITEMS = 100\nMAX_PAGES = 20\nSTAGE_NAMES = {'READING': '读取项目资料', 'SOURCE_REVIEW':\
          \ '待图纸和问题清单核对', 'MATCH_PENDING': '待数据库选型', 'SELECTION_REVIEW': '待选型清单确认',\
          \ 'PRICE_PENDING': '待查询报价参考价', 'QUOTE_REVIEW': '待采购报价表确认回传', 'QUOTE_CONFIRMED':\
          \ '报价已确认，可生成排产资料', 'PRODUCTION_READY': '排产资料已生成，待企业工艺复核'}\nROLE_NAMES =\
          \ {'MCB': '小型断路器', 'MCCB': '塑壳断路器', 'RCBO': '漏电断路器', 'RCCB': '剩余电流动作保护器',\
          \ 'residual_current_device_unspecified': '剩余电流保护器件', 'ATS': '自动转换开关', 'SPD':\
          \ '电涌保护器', 'controller': '控制器', 'contactor': '接触器', 'relay': '继电器', 'timer':\
          \ '时间控制器', 'transformer': '变压器', 'dc_power_supply': '直流电源', 'fuse': '熔断器',\
          \ 'cable': '线缆', 'unknown': '待确认器件'}\ndef j(value):\n    return json.dumps(value,\
          \ ensure_ascii=False, sort_keys=True, separators=(',', ':'), allow_nan=False)\n\
          def pack(state):\n    raw = j(state).encode()\n    if len(raw) > 700000:\n\
          \        raise ValueError('项目数据过大，请按柜号拆分；未保留半份数据')\n    result = 'N20:'\
          \ + base64.b64encode(gzip.compress(raw, mtime=0)).decode()\n    if len(result)\
          \ > 55000:\n        raise ValueError('项目上下文超过Dify单变量预算，请按柜号拆分')\n    return\
          \ result\ndef unpack(value):\n    if not value:\n        return {}\n   \
          \ if not str(value).startswith('N20:'):\n        raise ValueError('旧版本项目不能混用，请新建项目')\n\
          \    with gzip.GzipFile(fileobj=io.BytesIO(base64.b64decode(value[4:], validate=True)))\
          \ as stream:\n        raw = stream.read(700001)\n    if len(raw) > 700000:\n\
          \        raise ValueError('上下文超出处理上限')\n    state = json.loads(raw)\n  \
          \  if not isinstance(state, dict):\n        raise ValueError('项目上下文无效')\n\
          \    return state\ndef stamp(state, action, approver=''):\n    state.setdefault('history',\
          \ []).append({'action': action, 'approver': approver, 'revision': state['revision'],\
          \ 'at': datetime.now(timezone.utc).isoformat(timespec='seconds')})\n   \
          \ state['history'] = state['history'][-25:]\ndef new_state(name, files,\
          \ technical_files):\n\n    def refs(values, role):\n        return [{'id':\
          \ str(f.get('upload_file_id') or f.get('id') or ''), 'filename': str(f.get('filename')\
          \ or f.get('name') or ''), 'role': role} for f in values if isinstance(f,\
          \ dict)]\n    return {'schema': 'dify-native-v20', 'project_id': uuid.uuid4().hex,\
          \ 'name': str(name or '电气成套项目')[:100], 'revision': 1, 'stage': 'READING',\
          \ 'sign_key': uuid.uuid4().hex + uuid.uuid4().hex, 'documents': refs(files,\
          \ 'drawing') + refs(technical_files, 'technical_agreement'), 'pages': [],\
          \ 'facts': {'cabinets': [], 'items': [], 'notes': [], 'rules': [], 'connections':\
          \ [], 'recognition_issues': []}, 'issues': [], 'bom': [], 'source_reviewed':\
          \ False, 'history': []}\ndef full_status(state):\n    if not state:\n  \
          \      return '先填写项目名称并上传完整图纸PDF，发送“开始选型”。技术协议可选。'\n    return '项目：%s；版本：%s；阶段：%s。\\\
          n流程：识图核对 → 数据库选型 → 选型确认 → 采购报价表 → 报价确认回传 → 排产技术资料。' % (state['name'], state['revision'],\
          \ STAGE_NAMES.get(state['stage'], state['stage']))\ndef route_action(query,\
          \ state_json, chat_files, pdf_files, technical_files, project_name, notes,\
          \ action):\n    try:\n        state = unpack(state_json)\n    except ValueError:\n\
          \        return {'route': 'STATUS', 'state_json': state_json, 'message':\
          \ '项目上下文不可读取，请在新对话开始。', 'upload_source': 'FORM', 'has_technical': 'NO'}\n\
          \    text = str(query or '').strip() or str(action or '').strip()\n    aliases\
          \ = {'新建项目': '开始选型', '开始识图': '开始选型', '开始PDF识图': '开始选型', '提交问题确认': '提交问题清单',\
          \ '提交BOM确认': '提交选型确认', '提交bom表': '提交选型确认', '提交报价确认': '提交报价表', '生成排产': '生成排产资料',\
          \ '生成交付文件': '生成排产资料', '继续': '继续处理', '重新核对': '修订资料', '修改选型': '修订资料'}\n  \
          \  text = aliases.get(text, text)\n    route = 'STATUS'\n    message = ''\n\
          \    source = 'CHAT' if chat_files else 'FORM'\n    if text in ('提交', '继续处理',\
          \ '继续选型') and state:\n        if chat_files and text == '提交':\n        \
          \    text = {'SOURCE_REVIEW': '提交问题清单', 'SELECTION_REVIEW': '提交选型确认', 'QUOTE_REVIEW':\
          \ '提交报价表'}.get(state['stage'], text)\n        else:\n            route =\
          \ {'MATCH_PENDING': 'MATCH', 'PRICE_PENDING': 'PRICE', 'SOURCE_REVIEW':\
          \ 'FORM', 'SELECTION_REVIEW': 'FORM', 'QUOTE_REVIEW': 'FORM', 'QUOTE_CONFIRMED':\
          \ 'PRODUCTION', 'PRODUCTION_READY': 'PRODUCTION', 'READING': 'NEW'}.get(state['stage'],\
          \ 'STATUS')\n    if text == '开始选型':\n        if state:\n            message\
          \ = '当前对话已有项目。请先查看项目；新项目请使用新对话，避免覆盖。'\n        else:\n            files\
          \ = chat_files or pdf_files\n            if not isinstance(files, list)\
          \ or len(files) != 1 or (not str(files[0].get('filename') or files[0].get('name')\
          \ or '').lower().endswith('.pdf')):\n                message = '请上传一份完整图纸PDF，再发送“开始选型”。'\n\
          \            else:\n                state = new_state(project_name, files,\
          \ technical_files or [])\n                state['schema'] = 'cabinet-native-v28'\n\
          \                state['notes'] = str(notes or '')[:3000]\n            \
          \    state['technical_text'] = ''\n                route = 'NEW'\n    expected\
          \ = {'提交问题清单': ('SOURCE_REVIEW', 'SOURCE_RETURN'), '提交选型确认': ('SELECTION_REVIEW',\
          \ 'SELECT_RETURN'), '提交报价表': ('QUOTE_REVIEW', 'QUOTE_RETURN')}\n    if text\
          \ in expected:\n        stage, target = expected[text]\n        if not state\
          \ or state['stage'] != stage:\n            message = '当前阶段不接受此类表格，请先“查看项目”。'\n\
          \        elif not isinstance(chat_files, list) or len(chat_files) != 1 or\
          \ (not str(chat_files[0].get('filename') or chat_files[0].get('name') or\
          \ '').lower().endswith('.xlsx')):\n            message = '请在聊天框上传当前版本的一份XLSX确认表，再提交。'\n\
          \        else:\n            route = target\n    if text == '生成排产资料':\n \
          \       if state.get('stage') in ('QUOTE_CONFIRMED', 'PRODUCTION_READY'):\n\
          \            route = 'PRODUCTION'\n        else:\n            message =\
          \ '采购报价表尚未确认回传，不能生成排产技术资料。'\n    if text == '保存项目资料' and state:\n      \
          \  route = 'ARCHIVE'\n    if text == '修订资料':\n        if state.get('stage')\
          \ and state['stage'] != 'READING':\n            state['stage'] = 'SOURCE_REVIEW'\n\
          \            state['revision'] += 1\n            state['bom'] = []\n   \
          \         for key in ('confirmed_quote_hash', 'quote_approver', 'selection_approver',\
          \ 'engineering', 'form'):\n                state.pop(key, None)\n      \
          \      for item in state['facts']['items']:\n                item.pop('selected',\
          \ None)\n            stamp(state, 'source_revision_requested')\n       \
          \     route = 'FORM'\n        else:\n            message = '请先完成图纸读取，再修订项目资料。'\n\
          \    return {'route': route, 'state_json': pack(state) if state else '',\
          \ 'message': message or full_status(state), 'upload_source': source, 'has_technical':\
          \ 'YES' if technical_files else 'NO'}\n\ndef original_main(query,state_json,chat_files,pdf_files,technical_files,project_name,notes):\n\
          \    fallback={'route': 'STATUS', 'state_json': '', 'message': '', 'upload_source':\
          \ '', 'has_technical': ''}\n    fallback[\"state_json\"]=state_json\n  \
          \  try:\n        value=route_action(query,state_json,chat_files,pdf_files,technical_files,project_name,notes,action='开始选型')\n\
          \        value.setdefault(\"valid\",\"YES\")\n        return {k:value.get(k,v)\
          \ for k,v in fallback.items()}\n    except Exception as exc:\n        fallback[\"\
          message\"]=str(exc)[:3000]\n        return {k:fallback[k] for k in ['route',\
          \ 'state_json', 'message', 'upload_source', 'has_technical']}\n\ndef main(query,state_json,chat_files,pdf_files,technical_files,project_name,notes):\n\
          \    try: state=unpack(state_json)\n    except Exception: state={}\n   \
          \ if query==\"查看项目\" and state.get(\"stage\") in (\"SOURCE_REVIEW\",\"SELECTION_REVIEW\"\
          ,\"QUOTE_REVIEW\"):\n        query=\"继续处理\"\n    if query==\"开始选型\" and\
          \ state.get(\"stage\") in (\"MATCH_PENDING\",\"PRICE_PENDING\"):\n     \
          \   query=\"继续处理\"\n    return original_main(query,state_json,chat_files,pdf_files,technical_files,project_name,notes)\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: state_json
          value_selector:
          - conversation
          - project_state
        - variable: chat_files
          value_selector:
          - sys
          - files
        - variable: pdf_files
          value_selector:
          - '2800000000001'
          - pdf_files
        - variable: technical_files
          value_selector:
          - '2800000000001'
          - technical_files
        - variable: project_name
          value_selector:
          - '2800000000001'
          - project_name
        - variable: notes
          value_selector:
          - '2800000000001'
          - notes
        outputs:
          route:
            type: string
            children: null
          state_json:
            type: string
            children: null
          message:
            type: string
            children: null
          upload_source:
            type: string
            children: null
          has_technical:
            type: string
            children: null
      position:
        x: 350
        y: 0
      positionAbsolute:
        x: 350
        y: 0
