          \ math\n\nimport re\n\ndef job_context(job_json, manifest_compact):\n  \
          \  job = json.loads(job_json)\n    packet = uncompress(manifest_compact)\n\
          \    source = packet['native_text']\n    context = dict(job, source_text=source,\
          \ source_text_scope='全文件无序文字；不是位置证据', notes=packet['notes'])\n    return\
          \ {'file_serial': str(job['file_serial']), 'mode': job['mode'], 'context_json':\
          \ j(context), 'job_json': job_json}\n\ndef main(job_json,manifest_compact):\n\
          \    return job_context(job_json,manifest_compact)\n"
