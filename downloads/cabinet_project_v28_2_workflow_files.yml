          \      state['stage'] = 'SELECTION_REVIEW'\n            state['revision']\
          \ += 1\n    else:\n        for row in state['bom']:\n            record\
          \ = by.get(row['row_id'])\n            row['price_references'] = record['prices']\
          \ if record else []\n        state['stage'] = 'QUOTE_REVIEW'\n        state['revision']\
          \ += 1\n    stamp(state, 'lookup_' + mode)\n    return {'state_json': pack(state),\
