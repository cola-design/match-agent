          \ import urlsplit\nfrom xml.etree import ElementTree as ET\nSCOPES = {'OUR_PURCHASE',\
          \ 'CUSTOMER_SUPPLIED', 'UTILITY_SUPPLIED', 'RESERVED'}\nYES = {'是', '确认',\
