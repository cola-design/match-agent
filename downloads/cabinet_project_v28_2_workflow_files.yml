        desc: ''
        selected: false
        code_language: python3
        code: "from urllib.parse import urlsplit\ndef main(files,base_url,serial=1):\n\
          \    if not isinstance(files,list) or not files:raise ValueError(\"没有收到待读取附件\"\
          )\n    index=int(serial or 1)-1\n    if not 0<=index<len(files):raise ValueError(\"\
          文件序号超出范围\")\n    def normalize(f):\n      url=str(f.get(\"url\") or f.get(\"\
          remote_url\") or \"\")\n      if url.startswith(\"/files/\"):\n        base=str(base_url\
          \ or \"\").strip().rstrip(\"/\");p=urlsplit(base)\n        if p.scheme not\
          \ in (\"http\",\"https\") or not p.netloc or p.path or p.query or p.fragment\
          \ or p.username or p.password:\n            raise ValueError(\"请在流程环境变量\
          \ DIFY_FILES_BASE_URL 填写Dify文件服务根地址\")\n        url=base+url\n      elif\
          \ urlsplit(url).scheme not in (\"http\",\"https\"):\n        raise ValueError(\"\
          附件地址不完整，不能读取\")\n      return dict(f,dify_model_identity=\"__dify__file__\"\
          ,url=url,remote_url=url,transfer_method=\"remote_url\")\n    return {\"\
          file_parameter\":normalize(files[index]),\"file_parameters\":[normalize(f)\
          \ for f in files]}\n"
