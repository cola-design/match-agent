          \ → 排产技术资料。' % (state['name'], state['revision'], STAGE_NAMES.get(state['stage'],\
          \ state['stage']))\ndef finish_lookup(state_json, results, mode):\n    state\
          \ = unpack(state_json)\n    rows = [json.loads(x) for x in results]\n  \
          \  by = {x['row_id']: x for x in rows}\n    expected = {x['row_id'] for\
          \ x in state['facts']['items'] if x['supply_scope'] == 'OUR_PURCHASE' and\
          \ x['procurement_mode'] != 'NON_CATALOG'} if mode == 'MATCH' else {x['row_id']\
