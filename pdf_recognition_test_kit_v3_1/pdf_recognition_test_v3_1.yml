    - id: '2800000000008'
      type: custom
      data:
        type: code
        title: 按图片序号绑定原文与项目要求（Dify1.8兼容）
        desc: ''
        selected: false
        code_language: python3
        code: "import html\n\nimport json\n\nimport math\n\nimport re\n\nSCHEMA =\
          \ 'pdf-recognition-test/3'\n\ndef bind_image(index, manifest_json):\n  \
          \  packet = json.loads(manifest_json)\n    names = packet.get('uploaded_image_names')\n\
          \    if not isinstance(names, list) or isinstance(index, bool) or (not isinstance(index,\
          \ (int, float))) or (not 0 <= index < len(names)) or (index != int(index)):\n\
          \        raise ValueError('当前图片序号与上传列表不一致，请重新上传本批材料')\n    name = names[int(index)].casefold()\n\
          \    unit = next((u for u in packet['units'] if u['image_name'].casefold()\
          \ == name))\n    context = dict(unit['context'], user_requirements=packet['user_requirements'],\
          \ image_name=unit['image_name'], source_id=packet['source_id'])\n    return\
          \ {'context_json': json.dumps(context, ensure_ascii=False, separators=(',',\
