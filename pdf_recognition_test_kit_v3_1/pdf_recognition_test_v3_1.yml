app:
  description: 配套本机测试包：上传同批解析说明和局部图片，调用工作区已有千问；代码只接收图片序号和文字，图片对象直接交给视觉节点。不调用产品、价格或CAD服务。
  icon: 📐
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: PDF电气识图测试 V3.1（Dify1.8文件对象修正）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.3@966063fe991c50e5ac82106e65fc1949f852b2989ab2433ac028f0d25c6f92b1
kind: app
version: 0.4.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .png
      - .txt
      allowed_file_types:
      - image
      - document
      allowed_file_upload_methods:
      - local_file
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 5
    opening_statement: 先在电脑运行prepare_test.py。然后在上方表单上传同一个batch里的evidence.txt和全部PNG，选择已确认的要求范围，发送“开始识图”。每批新开对话。此应用先测识图，不做产品选型、报价或出图。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始识图
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '2800000000001'
      type: custom
      data:
        type: start
        title: 上传同一batch内的说明和图片；先单独测识图
        desc: ''
        selected: false
        variables:
        - variable: evidence_files
          label: ① 本批解析说明 evidence.txt（只选一个）
          type: file-list
          required: true
          max_length: 1
          options: []
          allowed_file_types:
          - document
          allowed_file_extensions:
          - .txt
          allowed_file_upload_methods:
          - local_file
        - variable: region_images
          label: ② 同一batch内全部PNG局部图（最多4张）
          type: file-list
          required: true
          max_length: 4
          options: []
          allowed_file_types:
          - image
          allowed_file_extensions:
          - .png
          allowed_file_upload_methods:
          - local_file
        - variable: overload_scope
          label: ③ 项目确有“过载只报警、不切断”要求时，选择已确认范围
          type: select
          required: true
          default: 未指定
          options:
          - 未指定
          - 指定回路（在补充说明中写明）
          - 整柜各回路
        - variable: notes
          label: ④ 其他已确认的项目要求（选填，不填猜测）
          type: paragraph
          required: false
          max_length: 3000
          options: []
