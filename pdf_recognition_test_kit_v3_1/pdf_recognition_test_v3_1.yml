    - id: '2800000000013'
      type: custom
      data:
        type: code
        title: 第二次校验，仍失败则保留失败区
        desc: ''
        selected: false
        code_language: python3
        code: "import html\n\nimport json\n\nimport math\n\nimport re\n\nSCHEMA =\
          \ 'pdf-recognition-test/3'\n\ndef checked_model(raw, context_json):\n  \
          \  context = json.loads(context_json)\n    try:\n        if not isinstance(raw,\
          \ str) or len(raw.encode()) > 120000:\n            raise ValueError('模型文本为空或超出分区预算')\n\
          \        checked = validate(raw, {'unit_id': context['unit_id'], 'context':\
          \ context})\n        for item in checked['data']['items']:\n           \
          \ if not isinstance(item.get('meaning'), str):\n                raise ValueError('每个对象必须返回中文含义meaning；不确定时写明不确定')\n\
          \            if item.get('object_type') not in ('device', 'cable', 'interface',\
          \ 'symbol', 'unknown'):\n                raise ValueError('对象类型object_type无效')\n\
          \        review = checked['data'].get('engineering_review', [])\n      \
          \  if not isinstance(review, list):\n            raise ValueError('engineering_review必须是数组')\n\
          \        known = {a['id'] for a in context['native_or_ocr_anchors']}\n \
          \       for q in review:\n            if not isinstance(q, dict) or not\
          \ isinstance(q.get('question'), str) or (not q['question'].strip()) or (not\
          \ isinstance(q.get('basis'), str)) or (not q['basis'].strip()):\n      \
          \          raise ValueError('工程问题必须有具体问题和资料依据')\n            ids = q.get('native_anchor_ids')\n\
          \            if not isinstance(ids, list) or not ids or any((not isinstance(x,\
          \ str) or x not in known for x in ids)):\n                raise ValueError('工程问题必须引用当前分区中实际存在的原文；识别缺项请写recognition_gaps')\n\
          \        record = {'status': 'response_validated', 'unit_id': context['unit_id'],\
          \ 'image_name': context['image_name'], **checked}\n        text = json.dumps(record,\
          \ ensure_ascii=False, separators=(',', ':'))\n        if len(text) > 60000:\n\
          \            raise ValueError('单区输出过长，需要更细分区，不采用截断结果')\n        return {'valid':\
          \ 'YES', 'packet_json': text, 'message': ''}\n    except (ValueError, TypeError,\
          \ KeyError) as exc:\n        record = {'status': 'failed', 'unit_id': context['unit_id'],\
          \ 'image_name': context['image_name'], 'error': str(exc), 'engineering_verified':\
          \ False}\n        return {'valid': 'NO', 'packet_json': json.dumps(record,\
          \ ensure_ascii=False), 'message': str(exc)}\n\ndef _bbox(value):\n    return\
          \ isinstance(value, list) and len(value) == 4 and all((isinstance(x, (int,\
          \ float)) and (not isinstance(x, bool)) and math.isfinite(x) and (0 <= x\
          \ <= 1) for x in value)) and (value[0] < value[2]) and (value[1] < value[3])\n\
          \ndef validate(raw, unit):\n    if not isinstance(raw, str):\n        raise\
          \ ValueError('模型未返回文本')\n    s = raw.strip()\n    if s.startswith('```')\
          \ and s.endswith('```'):\n        lines = s.splitlines()\n        s = '\\\
          n'.join(lines[1:-1])\n\n    def bad_constant(value):\n        raise ValueError('模型JSON含非有限数值')\n\
          \n    def unique_fields(pairs):\n        row = {}\n        for key, value\
          \ in pairs:\n            if key in row:\n                raise ValueError('模型JSON有重复字段：'\
          \ + key)\n            row[key] = value\n        return row\n    obj = json.loads(s,\
          \ parse_constant=bad_constant, object_pairs_hook=unique_fields)\n    if\
          \ not isinstance(obj, dict) or type(obj.get('readable')) is not bool:\n\
          \        raise ValueError('模型JSON结构错误')\n    coordinate_system = obj.get('coordinate_system')\n\
          \    if coordinate_system not in ('normalized_1000', 'normalized'):\n  \
          \      raise ValueError('模型未明确声明受支持的坐标单位')\n    divisor = 1000 if coordinate_system\
          \ == 'normalized_1000' else 1\n    anchors = {a['id']: a for a in unit['context']['native_or_ocr_anchors']}\n\
          \    conflicts = []\n    ids = set()\n    for group in ('items', 'notes',\
          \ 'connections', 'recognition_gaps'):\n        if not isinstance(obj.get(group),\
          \ list):\n            raise ValueError('模型JSON缺少数组：' + group)\n    if obj.get('drawing_type')\
          \ not in ('single_line', 'multiline_power', 'secondary_wiring', 'assembly',\
          \ 'schedule', 'mixed', 'unknown'):\n        raise ValueError('模型未声明受支持的图面类型')\n\
          \    for group in ('items', 'notes', 'connections'):\n        for row in\
          \ obj[group]:\n            if not isinstance(row, dict) or not isinstance(row.get('bbox'),\
          \ list):\n                raise ValueError('模型位置结构错误')\n            rawbox\
          \ = row['bbox']\n            if len(rawbox) != 4 or not all((isinstance(x,\
          \ (int, float)) and (not isinstance(x, bool)) for x in rawbox)):\n     \
          \           raise ValueError('模型位置非数值')\n            row['bbox_raw'] = list(rawbox)\n\
          \            row['bbox'] = [x / divisor for x in rawbox]\n            if\
          \ not _bbox(row['bbox']):\n                raise ValueError('模型位置超出声明单位范围')\n\
          \    obj['coordinate_system'] = 'normalized'\n    for item in obj['items']:\n\
          \        if not isinstance(item, dict) or not isinstance(item.get('id'),\
          \ str) or (not item['id']) or (item['id'] in ids):\n            raise ValueError('器件实例编号缺失或重复')\n\
          \        ids.add(item['id'])\n        if not _bbox(item.get('bbox')):\n\
          \            raise ValueError('器件位置无效')\n        if not isinstance(item.get('kind'),\
          \ str) or not item['kind'] or (not isinstance(item.get('observed_label'),\
          \ str)) or (not isinstance(item.get('native_anchor_ids'), list)):\n    \
          \        raise ValueError('器件原文或原文引用无效')\n        for aid in item['native_anchor_ids']:\n\
          \            if not isinstance(aid, str) or aid not in anchors:\n      \
          \          raise ValueError('引用了当前分区外的原文编号')\n        params = item.get('explicit_parameters')\n\
          \        if not isinstance(params, dict):\n            raise ValueError('器件参数不是对象')\n\
          \        if not isinstance(item.get('recognition_gaps', []), list):\n  \
          \          raise ValueError('器件识别缺项不是数组')\n        native = [anchors[aid]\
          \ for aid in item['native_anchor_ids'] if anchors[aid]['source'] == 'native_pdf_text']\n\
          \        comparable = lambda text: re.sub('\\\\s+', '', str(text)).replace('－',\
          \ '-').replace('–', '-').upper()\n        if native and comparable(item['observed_label'])\
          \ and (comparable(item['observed_label']) not in comparable(' '.join((a['raw']\
          \ for a in native)))):\n            conflicts.append({'type': 'model_native_transcription_conflict',\
          \ 'item_id': item['id'], 'native_values': [a['raw'] for a in native], 'model_value':\
          \ item['observed_label']})\n        aliases = {'leakage_current_ma': 'residual_current_ma',\
          \ 'pole_count': 'pole_marking', 'rated_current': 'rated_current_a'}\n  \
          \      canonical = {aliases.get(k, k): v for k, v in params.items()}\n \
          \       if isinstance(canonical.get('pole_marking'), int):\n           \
          \ canonical['pole_marking'] = str(canonical['pole_marking']) + 'P'\n   \
          \     for aid in item['native_anchor_ids']:\n            a = anchors[aid]\n\
          \            if a['source'] != 'native_pdf_text':\n                continue\n\
          \            for key, value in a['literal_parameters'].items():\n      \
          \          if key in canonical and canonical[key] != value:\n          \
          \          conflicts.append({'type': 'model_native_parameter_conflict',\
          \ 'item_id': item['id'], 'anchor_id': aid, 'field': key, 'native_value':\
          \ value, 'model_value': canonical[key]})\n        if native and 'pole_marking'\
          \ in canonical and (not any(('pole_marking' in a['literal_parameters'] for\
          \ a in native))):\n            conflicts.append({'type': 'pole_marking_without_native_support',\
          \ 'item_id': item['id'], 'model_value': canonical['pole_marking'], 'message':\
          \ '所引用原文未明确极数；不能从ATS后缀II等推定，需回看图像证据'})\n    for note in obj['notes']:\n\
          \        if not isinstance(note, dict) or not _bbox(note.get('bbox')) or\
          \ (not isinstance(note.get('raw'), str)):\n            raise ValueError('说明原文或位置无效')\n\
          \        aids = note.get('native_anchor_ids', [])\n        if not isinstance(aids,\
          \ list) or any((not isinstance(aid, str) or aid not in anchors for aid in\
          \ aids)):\n            raise ValueError('说明引用了分区外的原文')\n    for edge in\
          \ obj['connections']:\n        if not isinstance(edge, dict) or edge.get('from_item')\
          \ not in ids or edge.get('to_item') not in ids or (not _bbox(edge.get('bbox'))):\n\
          \            raise ValueError('连接引用或线路位置无效')\n    return {'data': obj, 'validation_conflicts':\
          \ conflicts, 'engineering_verified': False, 'unit_id': unit['unit_id']}\n\
          \ndef main(raw, context_json):\n    return checked_model(raw, context_json)\n"
