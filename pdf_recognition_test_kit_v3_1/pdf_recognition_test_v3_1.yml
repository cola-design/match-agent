    - id: '2800000000003'
      type: custom
      data:
        type: code
        title: 核对图片数量、文件名和来源，混批时停止
        desc: ''
        selected: false
        code_language: python3
        code: "import html\n\nimport json\n\nimport math\n\nimport re\n\nSCHEMA =\
          \ 'pdf-recognition-test/3'\n\ndef filename(file):\n    if not isinstance(file,\
          \ dict):\n        raise ValueError('未收到Dify文件对象')\n    name = str(file.get('filename')\
          \ or file.get('name') or '').replace('\\\\', '/').rsplit('/', 1)[-1]\n \
          \   if not name:\n        raise ValueError('上传文件缺少文件名')\n    return name\n\
          \ndef read_manifest(texts, images, notes, overload_scope):\n    try:\n \
          \       if not isinstance(texts, list) or len(texts) != 1:\n           \
          \ raise ValueError('请只上传本批的一个evidence.txt')\n        if not isinstance(texts[0],\
          \ str) or len(texts[0]) > 110000:\n            raise ValueError('本批说明过长或为空，请使用本机生成的原文件')\n\
          \        packet = json.loads(texts[0].lstrip('\\ufeff').strip())\n     \
          \   if not isinstance(packet, dict) or packet.get('schema_version') != SCHEMA:\n\
          \            raise ValueError('说明版本不匹配，请用本测试包重新生成材料')\n        units = packet.get('units')\n\
          \        if not isinstance(units, list) or not 1 <= len(units) <= 4:\n \
          \           raise ValueError('每批应有1至4个分区')\n        for key in ('batch_index',\
          \ 'batch_count', 'total_units'):\n            if type(packet.get(key)) is\
          \ not int or packet[key] < 1:\n                raise ValueError('批次/总分区统计无效')\n\
          \        if packet['batch_index'] > packet['batch_count'] or packet['total_units']\
          \ < len(units):\n            raise ValueError('批次与全文件统计不一致')\n        if\
          \ not isinstance(images, list) or len(images) != len(units):\n         \
          \   raise ValueError('请上传同一batch目录内的全部PNG，数量必须与说明一致')\n        actual =\
          \ [filename(f).casefold() for f in images]\n        expected = [u['image_name'].casefold()\
          \ for u in units]\n        if len(set(actual)) != len(actual) or len(set(expected))\
          \ != len(expected) or set(actual) != set(expected):\n            raise ValueError('图片文件名不匹配或重复；请不要改名、漏传或混用不同批次的材料')\n\
          \        packet['uploaded_image_names'] = [filename(f) for f in images]\n\
          \        ids = [u['unit_id'] for u in units]\n        if len(set(ids)) !=\
          \ len(ids):\n            raise ValueError('分区编号重复')\n        for u in units:\n\
          \            if not isinstance(u.get('context', {}).get('native_or_ocr_anchors'),\
          \ list):\n                raise ValueError('原文证据结构无效')\n            if u['context'].get('unit_id')\
          \ != u['unit_id']:\n                raise ValueError('分区归属不一致')\n      \
          \  if overload_scope not in ('未指定', '指定回路（在补充说明中写明）', '整柜各回路'):\n      \
          \      raise ValueError('请选择有效的过载要求适用范围')\n        packet['user_requirements']\
          \ = {'notes': str(notes or ''), 'overload_alarm_only_scope': overload_scope,\
          \ 'source': 'Dify开始表单用户输入', 'engineering_verified': False}\n        text\
          \ = json.dumps(packet, ensure_ascii=False, separators=(',', ':'))\n    \
          \    if len(text) > 60000:\n            raise ValueError('本批说明超过Dify安全预算，请用--batch-size\
          \ 1重新生成材料')\n        return {'valid': 'YES', 'manifest_json': text, 'message':\
          \ ''}\n    except (ValueError, TypeError, KeyError) as exc:\n        return\
          \ {'valid': 'NO', 'manifest_json': '', 'message': str(exc) + '。尚未调用模型。'}\n\
          \ndef main(texts, images, notes, overload_scope):\n    return read_manifest(texts,\
          \ images, notes, overload_scope)\n"
        variables:
        - variable: texts
          value_selector:
          - '2800000000002'
          - text
        - variable: images
          value_selector:
          - '2800000000001'
          - region_images
        - variable: notes
          value_selector:
          - '2800000000001'
          - notes
        - variable: overload_scope
          value_selector:
          - '2800000000001'
          - overload_scope
        outputs:
          valid:
            type: string
            children: null
          manifest_json:
            type: string
            children: null
          message:
            type: string
            children: null
