    - id: '2800000000015'
      type: custom
      data:
        type: code
        title: 汇总识图结果：核对表、缺项、冲突及结构化结果
        desc: ''
        selected: false
        code_language: python3
        code: "import html\n\nimport json\n\nimport math\n\nimport re\n\nSCHEMA =\
          \ 'pdf-recognition-test/3'\n\ndef collect_results(packets, manifest_json):\n\
          \    manifest = json.loads(manifest_json)\n    units = {u['unit_id']: u\
          \ for u in manifest['units']}\n    responses = [json.loads(x) for x in packets]\n\
          \    if len(responses) != len(units) or {r['unit_id'] for r in responses}\
          \ != set(units):\n        raise ValueError('分区结果不完整或归属错误，未声称处理完毕')\n   \
          \ items = []\n    connections = []\n    notes = []\n    gaps = []\n    conflicts\
          \ = []\n    engineering = []\n    failed = []\n    coverage = set()\n  \
          \  identity = {}\n\n    def pagebox(b, u):\n        r = u['bbox_page']\n\
          \        return [r[0] + b[0] * (r[2] - r[0]), r[1] + b[1] * (r[3] - r[1]),\
          \ r[0] + b[2] * (r[2] - r[0]), r[1] + b[3] * (r[3] - r[1])]\n\n    def overlap(a,\
          \ b):\n        area = max(0, min(a[2], b[2]) - max(a[0], b[0])) * max(0,\
          \ min(a[3], b[3]) - max(a[1], b[1]))\n        small = min((a[2] - a[0])\
          \ * (a[3] - a[1]), (b[2] - b[0]) * (b[3] - b[1]))\n        return small\
          \ > 0 and area / small > 0.5\n    for response in responses:\n        uid\
          \ = response['unit_id']\n        u = units[uid]\n        if response['status']\
          \ != 'response_validated':\n            failed.append(response)\n      \
          \      continue\n        data = response['data']\n        conflicts.extend((dict(x,\
          \ unit_id=uid) for x in response['validation_conflicts']))\n        if not\
          \ data['readable']:\n            gaps.append({'unit_id': uid, 'type': 'region_not_readable'})\n\
          \        gaps.extend(({'unit_id': uid, 'detail': x} for x in data['recognition_gaps']))\n\
          \        engineering.extend(({'unit_id': uid, 'detail': x} for x in data.get('engineering_review',\
          \ [])))\n        remap = {}\n        for original in data['items']:\n  \
          \          item = dict(original, id=uid + ':' + original['id'], unit_id=uid,\
          \ image_name=u['image_name'], page=u['page'], bbox_page=pagebox(original['bbox'],\
          \ u), physical_quantity=None, engineering_verified=False)\n            aids\
          \ = tuple(sorted(item['native_anchor_ids']))\n            coverage.update(aids)\n\
          \            key = (item['page'], aids) if aids else None\n            old\
          \ = identity.get(key) if key else None\n            if old is not None:\n\
          \                same = all((old.get(k) == item.get(k) for k in ('observed_label',\
          \ 'object_type', 'kind', 'explicit_parameters', 'circuit_tag', 'phase')))\n\
          \                if same and overlap(old['bbox_page'], item['bbox_page']):\n\
          \                    old.setdefault('also_seen_in', []).append(uid)\n  \
          \                  remap[original['id']] = old['id']\n                 \
          \   continue\n                conflicts.append({'type': 'overlap_disagreement',\
          \ 'unit_id': uid, 'native_anchor_ids': list(aids), 'message': '同一原文在不同局部图的归属或参数不同，保留双方等待核对'})\n\
          \            items.append(item)\n            remap[original['id']] = item['id']\n\
          \            if key:\n                identity[key] = item\n           \
          \ gaps.extend(({'unit_id': uid, 'item_id': item['id'], 'detail': x} for\
          \ x in item.get('recognition_gaps', [])))\n        for edge in data['connections']:\n\
          \            connections.append(dict(edge, unit_id=uid, page=u['page'],\
          \ from_item=remap[edge['from_item']], to_item=remap[edge['to_item']], bbox_page=pagebox(edge['bbox'],\
          \ u), engineering_verified=False))\n        for note in data['notes']:\n\
          \            coverage.update(note.get('native_anchor_ids', []))\n      \
          \      notes.append(dict(note, unit_id=uid, page=u['page'], bbox_page=pagebox(note['bbox'],\
          \ u)))\n    expected = {a['id']: a for u in units.values() for a in u['context']['native_or_ocr_anchors']\
          \ if a.get('literal_kind') in ('device_model', 'unclassified_model', 'device_tag',\
          \ 'function_label', 'voltage_ratio', 'power_marking')}\n    missing = [{'id':\
          \ aid, 'raw': expected[aid]['raw']} for aid in sorted(set(expected) - coverage)]\n\
          \    requirements = manifest['user_requirements']\n    if requirements['overload_alarm_only_scope']\
          \ == '整柜各回路':\n        mcb = {a['id']: a['raw'] for u in units.values()\
          \ for a in u['context']['native_or_ocr_anchors'] if a['literal_parameters'].get('drawing_abbreviation')\
          \ == 'MCB'}\n        if mcb:\n            engineering.append({'type': 'overload_requirement_device_review',\
          \ 'source': '用户表单与原生MCB标记', 'requirement': '整柜各回路过载保护只报警、不切断', 'native_evidence':\
          \ mcb, 'message': '常规MCB一般具有过载脱扣功能，需设计人员核对具体保护方案；未改写器件或保护设置，短路与漏电动作另行核对。'})\n\
          \    summary = {'source_id': manifest['source_id'], 'source_filename': manifest['source_filename'],\
          \ 'batch_index': manifest['batch_index'], 'batch_count': manifest['batch_count'],\
          \ 'batch_units': len(units), 'total_source_units': manifest['total_units'],\
          \ 'failed_units': len(failed), 'candidate_objects': len(items), 'candidate_connections':\
          \ len(connections), 'unassociated_native_markings': len(missing), 'recognition_gap_count':\
          \ len(gaps), 'conflict_count': len(conflicts), 'engineering_review_count':\
          \ len(engineering), 'all_batch_responses_validated': not failed, 'recognition_accuracy_verified':\
          \ False, 'terminal_connectivity_verified': False, 'engineering_verified':\
          \ False}\n    result = {'schema_version': SCHEMA, 'summary': summary, 'project_requirements':\
          \ requirements, 'items': items, 'connections': connections, 'notes': notes,\
          \ 'recognition_gaps': gaps, 'conflicts': conflicts, 'engineering_review':\
          \ engineering, 'unassociated_native_markings': missing, 'failed_units':\
          \ failed, 'source_issues': manifest.get('native_extraction_issues', []),\
          \ 'scope': '局部视觉识图待核对结果；不连接产品库、价格库或绘图服务；未生成批准采购数量'}\n\n    def cell(value):\n\
          \        return html.escape(str(value if value is not None else '未明确')).replace('|',\
          \ '&#124;').replace('\\n', '<br>')\n    md = [f\"本批 {manifest['batch_index']}/{manifest['batch_count']}：处理\
          \ {len(units)} 个局部图。\", '这些是待核对候选；格式通过不等于图纸已完整看懂。', '', '|页/分区|原图标注|中文含义|回路/相别|明确参数|',\
          \ '|---|---|---|---|---|']\n    labels = {'rated_current_a': '额定电流(A)',\
          \ 'residual_current_ma': '剩余动作电流(mA)', 'leakage_current_ma': '剩余动作电流(mA)',\
          \ 'pole_marking': '极数标记', 'pole_count': '极数', 'trip_curve': '脱扣特性', 'voltage_v':\
          \ '电压(V)', 'voltage_pair_v': '电压标记(V)', 'apparent_power_va': '视在功率(VA)',\
          \ 'breaking_capacity_ka': '分断能力(kA)', 'drawing_abbreviation': '图面缩写', 'trip_marking_raw':\
          \ '脱扣器原标记'}\n    for item in items:\n        params = '；'.join((labels.get(k,\
          \ k) + '：' + (json.dumps(v, ensure_ascii=False) if isinstance(v, (list,\
          \ dict)) else str(v)) for k, v in item['explicit_parameters'].items()))\
          \ or '未明确'\n        md.append('|' + '|'.join((cell(x) for x in [str(item['page'])\
          \ + '/' + item['unit_id'], item['observed_label'], item['meaning'], str(item.get('circuit_tag')\
          \ or '') + '/' + str(item.get('phase') or ''), params])) + '|')\n    md\
          \ += ['', '识别缺项：' + cell(len(gaps)) + '；原文未关联：' + cell(len(missing)) + '；模型分歧：'\
          \ + cell(len(conflicts)) + '；失败分区：' + cell(len(failed)) + '。']\n    for\
          \ label, values in [('识别缺项', gaps), ('原文尚未关联', missing), ('模型与原文/跨区分歧',\
          \ conflicts), ('工程待核对', engineering), ('失败分区', failed)]:\n        if values:\n\
          \            md += ['', label + '：'] + ['- ' + cell(json.dumps(v, ensure_ascii=False))\
          \ for v in values]\n    if manifest['batch_count'] > 1:\n        md += ['',\
          \ '本文件还有其他批次。请新开对话上传下一批材料；本轮未声称整份图纸识别完成。']\n    report = '\\n'.join(md)\n\
          \    result_json = json.dumps(result, ensure_ascii=False, separators=(',',\
          \ ':'))\n    if len(report) > 60000 or len(result_json) > 60000:\n     \
          \   raise ValueError('本批完整结果超过预算，请用--batch-size 1生成更小批次；未截断冒充成功')\n    return\
          \ {'report': report, 'result_json': result_json}\n\ndef main(packets, manifest_json):\n\
          \    return collect_results(packets, manifest_json)\n"
        variables:
        - variable: packets
          value_selector:
          - '2800000000006'
          - output
        - variable: manifest_json
          value_selector:
          - '2800000000003'
          - manifest_json
        outputs:
          report:
            type: string
            children: null
          result_json:
            type: string
            children: null
      position:
        x: 4290
        y: 0
      positionAbsolute:
        x: 4290
        y: 0
      width: 260
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
