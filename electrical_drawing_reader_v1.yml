    - id: '2600000000006'
      type: custom
      data:
        type: code
        title: 读取项目编号
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\ndef checked_body(status_code, body):\n    if\
          \ int(status_code) != 200:\n        raise ValueError('图纸解析工具请求失败，HTTP '\
          \ + str(status_code) + '；请查看该HTTP节点的响应，未伪造识别结果。')\n    value = json.loads(body)\n\
          \    if not isinstance(value, dict):\n        raise ValueError('解析工具未返回JSON对象')\n\
          \    return value\ndef created(status_code, body):\n    value = checked_body(status_code,\
          \ body)\n    pid = value.get('project_id')\n    if not isinstance(pid, str)\
          \ or not re.fullmatch('[a-f0-9]{32}', pid):\n        raise ValueError('解析工具没有返回有效项目编号')\n\
          \    return {'project_id': pid}\n\ndef main(status_code, body):\n    return\
          \ created(status_code, body)\n"
        variables:
        - variable: status_code
          value_selector:
          - '2600000000005'
          - status_code
        - variable: body
          value_selector:
          - '2600000000005'
          - body
        outputs:
          project_id:
            type: string
            children: null
