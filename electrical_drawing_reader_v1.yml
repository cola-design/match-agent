    - id: '2600000000019'
      type: custom
      data:
        type: code
        title: 校验原文引用、分区归属和JSON；未通过则重看同一图
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\ndef checked_model(raw, context_json):\n   \
          \ context = json.loads(context_json)\n    message = ''\n    try:\n\n   \
          \     def pairs(values):\n            result = {}\n            for key,\
          \ value in values:\n                if key in result:\n                \
          \    raise ValueError('JSON出现重复字段')\n                result[key] = value\n\
          \            return result\n        text = str(raw or '').strip()\n    \
          \    if len(text.encode()) > 60000:\n            raise ValueError('模型输出超过分区预算，不采用截断内容')\n\
          \        if text.startswith('```'):\n            match = re.fullmatch('```(?:json)?\\\
          \\s*([\\\\s\\\\S]*?)\\\\s*```', text)\n            if not match:\n     \
          \           raise ValueError('JSON代码块不完整')\n            text = match.group(1)\n\
          \        data = json.loads(text, object_pairs_hook=pairs, parse_constant=lambda\
          \ _: (_ for _ in ()).throw(ValueError('非有限数')))\n        if not isinstance(data,\
          \ dict) or data.get('unit_id') != context['unit_id'] or (not isinstance(data.get('page_understood'),\
          \ bool)):\n            raise ValueError('分区编号或读取状态无效')\n        if not isinstance(data.get('items'),\
          \ list) or not isinstance(data.get('issues'), list):\n            raise\
          \ ValueError('缺少items或issues数组')\n        if len(data['items']) > 80:\n\
          \            raise ValueError('本区超过80项，需要更细分图')\n        if context['kind']\
          \ == 'overview' and data['items']:\n            raise ValueError('概览只做柜体/图面索引，items必须为空')\n\
          \        anchors = {a['anchor_id']: a['raw'] for a in context['anchors']}\n\
          \n        def comparable(s):\n            return re.sub('\\\\s+', '', str(s)).replace('–',\
          \ '-').replace('－', '-').upper()\n        for row in data['items']:\n  \
          \          if not isinstance(row, dict) or not isinstance(row.get('raw_label'),\
          \ str):\n                raise ValueError('每项需要原图标注raw_label')\n       \
          \     box = row.get('bbox')\n            ids = row.get('anchor_ids', [])\n\
          \            if not isinstance(box, list) or len(box) != 4 or any((isinstance(x,\
          \ bool) or not isinstance(x, (int, float)) or (not 0 <= x <= 1) for x in\
          \ box)) or (box[0] >= box[2]) or (box[1] >= box[3]):\n                raise\
          \ ValueError('每项必须定位到当前图片，bbox为有效0至1坐标')\n            if not isinstance(ids,\
          \ list) or any((not isinstance(x, str) or x not in anchors for x in ids)):\n\
          \                raise ValueError('不能引用本区不存在的原文编号')\n            if ids\
          \ and comparable(row['raw_label']) not in comparable(' '.join((anchors[x]\
          \ for x in ids))):\n                raise ValueError('原文与证据不一致，不得把MCB改成MCCB或猜测缺字')\n\
          \            quantity = row.get('quantity')\n            if quantity is\
          \ not None and (isinstance(quantity, bool) or not isinstance(quantity, (int,\
          \ float)) or (not 0 < quantity < 100000000.0)):\n                raise ValueError('数量为实际正数或null，不推算未知数量')\n\
          \            if 'uncertainties' in row and (not isinstance(row['uncertainties'],\
          \ list)):\n                raise ValueError('uncertainties应为数组')\n     \
          \   for field in ('drawings', 'cabinets', 'notes'):\n            if field\
          \ in data and (not isinstance(data[field], list)):\n                raise\
          \ ValueError(field + '应为数组')\n        packet = {'unit_id': context['unit_id'],\
          \ 'raw': json.dumps(data, ensure_ascii=False, separators=(',', ':')), 'failed':\
          \ False}\n        return {'valid': 'YES', 'packet_json': json.dumps(packet,\
          \ ensure_ascii=False), 'message': ''}\n    except (ValueError, TypeError,\
          \ KeyError) as exc:\n        message = str(exc)\n    packet = {'unit_id':\
          \ context['unit_id'], 'raw': '', 'failed': True}\n    return {'valid': 'NO',\
          \ 'packet_json': json.dumps(packet, ensure_ascii=False), 'message': message\
          \ + '；本区未作为成功识别。'}\n\ndef main(raw, context_json):\n    return checked_model(raw,\
          \ context_json)\n"
        variables:
        - variable: raw
          value_selector:
          - '2600000000018'
          - text
        - variable: context_json
          value_selector:
          - '2600000000016'
          - context_json
        outputs:
          valid:
            type: string
            children: null
          packet_json:
            type: string
            children: null
          message:
            type: string
            children: null
        isInIteration: true
        iteration_id: '2600000000014'
      position:
        x: 1200
        y: 70
