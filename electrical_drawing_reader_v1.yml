        type: code
        title: 显示真实进度、失败和待核对标注
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\ndef checked_body(status_code, body):\n    if\
          \ int(status_code) != 200:\n        raise ValueError('图纸解析工具请求失败，HTTP '\
          \ + str(status_code) + '；请查看该HTTP节点的响应，未伪造识别结果。')\n    value = json.loads(body)\n\
          \    if not isinstance(value, dict):\n        raise ValueError('解析工具未返回JSON对象')\n\
          \    return value\ndef status(status_code, body):\n    value = checked_body(status_code,\
          \ body)\n    s = value.get('summary', {})\n    pending = s.get('pending_units',\
          \ 0)\n    failed = s.get('failed_units', 0)\n    unbound = s.get('unassociated_native_labels',\
          \ 0)\n    message = value.get('message', '') + '\\n'\n    if pending:\n\
          \        message += '发送“继续识图”处理下一批；当前下载文件是阶段性结果。\\n'\n    if failed:\n \
          \       message += '有' + str(failed) + '个分区识别失败，已列入结果，不能据此认为图纸已完整识别。\\n'\n\
          \    if unbound:\n        message += '有' + str(unbound) + '条原生标注尚未与视觉条目关联，已保留在原文及待核对表。\\\
          n'\n    message += '本轮仅提取与解释图纸信息；AI归属和数量需对照原图核对。原文记录数不等于实物数量。'\n    return\
          \ {'message': message}\n\ndef main(status_code, body):\n    return status(status_code,\
          \ body)\n"
        variables:
        - variable: status_code
          value_selector:
          - '2600000000026'
          - status_code
        - variable: body
          value_selector:
          - '2600000000026'
          - body
