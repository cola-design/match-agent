app:
  description: 独立识图：PDF/DWG/DXF原文定位、分区视觉识别、常用电气标注解释和待核对项。支持多文件多轮续处理；本阶段不做选型、报价或出图。
  icon: 📐
  icon_background: '#E4FBCC'
  mode: advanced-chat
  name: 电气图纸识别 V1（PDF/DWG原文与语义提取）
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/tongyi:0.2.3@966063fe991c50e5ac82106e65fc1949f852b2989ab2433ac028f0d25c6f92b1
kind: app
version: 0.4.0
workflow:
  conversation_variables:
  - id: 0b5e9974-20b5-4f5c-acd8-575b684fce69
    name: drawing_project_id
    description: 解析工具中的项目编号；不存放整套原文
    value_type: string
    value: ''
  environment_variables:
  - id: 2cec35e3-694e-4baa-a69c-3533f99630b8
    name: DRAWING_READER_BASE_URL
    description: 配套解析工具根地址，例如http://electrical-reader:9910
    value_type: string
    value: ''
  - id: 8680db53-ab4b-494a-8a17-d3fb5a5562c0
    name: DRAWING_READER_API_KEY
    description: 配套解析工具密钥，与服务配置相同
    value_type: secret
    value: ''
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .PDF
      - .dwg
      - .DWG
      - .dxf
      - .DXF
      allowed_file_types:
      - custom
      allowed_file_upload_methods:
      - local_file
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      number_limits: 10
    opening_statement: 上传整套PDF、DWG或DXF，发送“开始识图”。本应用先提取器件、线缆及原文含义，保留来源和疑问。每轮处理6个分区，未完成时发送“继续识图”；查看和下载当前结果请发送“查看结果”。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 开始识图
    - 继续识图
    - 查看结果
    - 新建识图项目
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '2600000000001'
      type: custom
      data:
        type: start
        title: 在聊天框上传PDF、DWG或DXF；先独立识图
        desc: ''
        selected: false
        variables: []
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      width: 260
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '2600000000002'
      type: custom
      data:
        type: code
        title: 检查上传格式与当前识图任务
        desc: ''
        selected: false
        code_language: python3
        code: "import json\nimport re\ndef route(files, project_id, query, base_url):\n\
          \    root = str(base_url or '').strip().rstrip('/')\n    if not root.startswith(('http://',\
          \ 'https://')):\n        return {'route': 'HELP', 'base_url': root, 'message':\
          \ '请先部署配套图纸解析工具，并配置DRAWING_READER_BASE_URL和DRAWING_READER_API_KEY。该工具用于PDF分区、文字定位和DWG解码。'}\n\
          \    if any((not str(f.get('filename') or f.get('name') or '').lower().endswith(('.pdf',\
          \ '.dwg', '.dxf')) for f in files or [])):\n        return {'route': 'HELP',\
          \ 'base_url': root, 'message': '本识图流程仅接收PDF、DWG和DXF；其他业务文件请后续整合。'}\n   \
          \ if files:\n        action = 'NEW' if not project_id or re.search('新建|重新开始',\
          \ str(query)) else 'ADD'\n    elif project_id:\n        action = 'REPORT'\
          \ if re.search('查看|下载|结果', str(query)) else 'PROCESS'\n    else:\n     \
          \   action = 'HELP'\n    return {'route': action, 'base_url': root, 'message':\
          \ '在下方聊天框上传PDF/DWG/DXF并发送“开始识图”。多页多图会分区处理；发送“继续识图”处理下一批，发送“查看结果”下载当前结果。新项目请附文件发送“新建识图项目”。'}\n\
          \ndef main(files, project_id, query, base_url):\n    return route(files,\
          \ project_id, query, base_url)\n"
        variables:
        - variable: files
          value_selector:
          - sys
          - files
        - variable: project_id
          value_selector:
          - conversation
          - drawing_project_id
        - variable: query
          value_selector:
          - sys
          - query
        - variable: base_url
          value_selector:
          - env
          - DRAWING_READER_BASE_URL
        outputs:
          route:
            type: string
            children: null
          base_url:
            type: string
            children: null
          message:
            type: string
            children: null
      position:
        x: 350
