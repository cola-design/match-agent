        code_language: python3
        code: "import json\nimport re\ndef checked_body(status_code, body):\n    if\
          \ int(status_code) != 200:\n        raise ValueError('图纸解析工具请求失败，HTTP '\
          \ + str(status_code) + '；请查看该HTTP节点的响应，未伪造识别结果。')\n    value = json.loads(body)\n\
          \    if not isinstance(value, dict):\n        raise ValueError('解析工具未返回JSON对象')\n\
          \    return value\ndef batch(status_code, body):\n    value = checked_body(status_code,\
          \ body)\n    if not isinstance(value.get('batch'), list) or len(value['batch'])\
          \ > 12:\n        raise ValueError('解析工具返回的分区批次无效')\n    return {'units':\
          \ [json.dumps(x, ensure_ascii=False, separators=(',', ':')) for x in value['batch']]}\n\
          \ndef main(status_code, body):\n    return batch(status_code, body)\n"
