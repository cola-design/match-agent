        type: code
        title: 按序号绑定原图位置与整页上下文
        desc: ''
        selected: false
        code_language: python3
        code: "import base64\n\nimport json\n\nimport math\n\nimport zlib\n\ndef pack(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'),\
          \ allow_nan=False)\n\ndef unpack_manifest(value):\n    if not isinstance(value,\
          \ str) or len(value) > 60000:\n        raise ValueError('解析说明大小无效')\n  \
          \  decoded = base64.b64decode(value, validate=True)\n    inflater = zlib.decompressobj()\n\
          \    content = inflater.decompress(decoded, 1500001)\n    if len(content)\
          \ > 1500000 or not inflater.eof or inflater.unused_data:\n        raise\
          \ ValueError('解析说明压缩结构无效')\n    return json.loads(content)\n\ndef bind_image(index,\
          \ manifest_compact):\n    p = unpack_manifest(manifest_compact)\n    names\
          \ = p['uploaded_image_names']\n    if isinstance(index, bool) or not isinstance(index,\
          \ (int, float)) or (not math.isfinite(index)) or (index != int(index)) or\
          \ (not 0 <= index < len(names)):\n        raise ValueError('图片序号无效')\n \
          \   unit = next((u for u in p['units'] if u['image_name'] == names[int(index)]))\n\
          \    ctx = dict(unit['context'], selection_context=p['selection_context'])\n\
          \    return {'context_json': pack(ctx)}\n\ndef main(index,manifest_compact):\n\
          \    return bind_image(index,manifest_compact)\n"
