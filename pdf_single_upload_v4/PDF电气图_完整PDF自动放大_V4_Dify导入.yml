    - id: '2900000000006'
      type: custom
      data:
        type: code
        title: 核对整页/放大图与原PDF来源
        desc: ''
        selected: false
        code_language: python3
        code: "import base64\n\nimport json\n\nimport math\n\nimport zlib\n\ndef pack(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'),\
          \ allow_nan=False)\n\ndef bind_manifest(tool_json, images, selection_context):\n\
          \    try:\n        if not isinstance(tool_json, list):\n            raise\
          \ ValueError('未收到PDF解析插件的JSON结果')\n        records = [x for x in tool_json\
          \ if isinstance(x, dict) and 'success' in x]\n        if len(records) !=\
          \ 1 or records[0]['success'] is not True:\n            raise ValueError(str(records[0].get('message',\
          \ 'PDF解析失败')) if records else 'PDF解析结果缺失')\n        manifest = records[0]['manifest']\n\
          \        if manifest.get('schema_version') != 'electrical-pdf/4':\n    \
          \        raise ValueError('PDF插件版本与本流程不匹配')\n        units = manifest['units']\n\
          \        if not units or len(units) > 24 or (not isinstance(images, list)):\n\
          \            raise ValueError('整页/放大图数量无效')\n        actual = [str(x.get('filename')\
          \ or x.get('name') or '') for x in images]\n        expected = [x['image_name']\
          \ for x in units]\n        if len(set(actual)) != len(actual) or len(set(expected))\
          \ != len(expected) or set(actual) != set(expected):\n            raise ValueError('整页/放大图文件与原文说明不匹配，停止调用模型')\n\
          \        if len({u['unit_id'] for u in units}) != len(units):\n        \
          \    raise ValueError('图面编号重复')\n        manifest['uploaded_image_names']\
          \ = actual\n        manifest['selection_context'] = str(selection_context\
          \ or '')[:3000]\n        compact = base64.b64encode(zlib.compress(pack(manifest).encode('utf8'))).decode('ascii')\n\
          \        if len(compact) > 60000:\n            raise ValueError('整份PDF说明超过本试用版预算，未删除页面继续')\n\
          \        return {'valid': 'YES', 'manifest_compact': compact, 'message':\
          \ ''}\n    except (ValueError, KeyError, TypeError, AttributeError) as exc:\n\
          \        return {'valid': 'NO', 'manifest_compact': '', 'message': str(exc)}\n\
          \ndef main(tool_json,images,selection_context):\n    return bind_manifest(tool_json,images,selection_context)\n"
        variables:
        - variable: tool_json
          value_selector:
          - '2900000000005'
          - json
        - variable: images
          value_selector:
          - '2900000000005'
          - files
        - variable: selection_context
          value_selector:
          - '2900000000001'
          - selection_context
