    - id: '2900000000018'
      type: custom
      data:
        type: code
        title: 核对整份结果数量与来源，禁止漏图后假称完成
        desc: ''
        selected: false
        code_language: python3
        code: "import base64\n\nimport json\n\nimport math\n\nimport zlib\n\ndef pack(value):\n\
          \    return json.dumps(value, ensure_ascii=False, separators=(',', ':'),\
          \ allow_nan=False)\n\ndef unpack_manifest(value):\n    if not isinstance(value,\
          \ str) or len(value) > 60000:\n        raise ValueError('解析说明大小无效')\n  \
          \  decoded = base64.b64decode(value, validate=True)\n    inflater = zlib.decompressobj()\n\
          \    content = inflater.decompress(decoded, 1500001)\n    if len(content)\
          \ > 1500000 or not inflater.eof or inflater.unused_data:\n        raise\
          \ ValueError('解析说明压缩结构无效')\n    return json.loads(content)\n\ndef collect_records(packets,\
          \ manifest_compact):\n    p = unpack_manifest(manifest_compact)\n    records\
          \ = [json.loads(x) for x in packets]\n    ids = [x['unit_id'] for x in records]\n\
          \    expected = {u['unit_id'] for u in p['units']}\n    if len(ids) != len(expected)\
          \ or len(set(ids)) != len(ids) or set(ids) != expected:\n        raise ValueError('图片结果漏失或重复，不能声称整份处理完成')\n\
          \    encoded = pack(records)\n    if len(encoded) > 60000:\n        raise\
          \ ValueError('完整结果超出预算，未截断冒充成功')\n    return {'vision_results': encoded}\n\
          \ndef main(packets,manifest_compact):\n    return collect_records(packets,manifest_compact)\n"
        variables:
