        title: 按真实像素裁切局部PNG，保留颜色
        desc: ''
        selected: false
        code_language: python3
        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\nimport re\n\nimport unicodedata\n\nimport re\n\nimport base64\n\
          \nimport itertools\n\nimport json\n\nimport math\n\nimport re\n\nimport\
          \ struct\n\nimport zlib\n\ndef png_chunk(kind, data):\n    return struct.pack('>I',\
          \ len(data)) + kind + data + struct.pack('>I', zlib.crc32(kind + data) &\
          \ 4294967295)\n\ndef read_png(encoded):\n    if not isinstance(encoded,\
          \ str) or len(encoded) > 16000000:\n        raise ValueError('页图编码为空或超过16MB处理预算')\n\
          \    if encoded.startswith('data:'):\n        prefix, encoded = encoded.split(',',\
          \ 1)\n        if prefix != 'data:image/png;base64':\n            raise ValueError('必须使用PDF-to-Images的PNG输出')\n\
          \    encoded = re.sub('\\\\s+', '', encoded)\n    blob = base64.b64decode(encoded,\
          \ validate=True)\n    if blob[:8] != b'\\x89PNG\\r\\n\\x1a\\n':\n      \
          \  raise ValueError('输入不是PNG图片')\n    offset = 8\n    packed = []\n    extras\
          \ = []\n    header = None\n    ended = False\n    while offset + 12 <= len(blob):\n\
          \        size = struct.unpack('>I', blob[offset:offset + 4])[0]\n      \
          \  kind = blob[offset + 4:offset + 8]\n        if offset + 12 + size > len(blob):\n\
          \            raise ValueError('PNG数据被截断')\n        data = blob[offset +\
          \ 8:offset + 8 + size]\n        crc = struct.unpack('>I', blob[offset +\
          \ 8 + size:offset + 12 + size])[0]\n        if zlib.crc32(kind + data) &\
          \ 4294967295 != crc:\n            raise ValueError('PNG校验失败')\n        offset\
          \ += size + 12\n        if kind == b'IHDR':\n            if header is not\
          \ None or len(data) != 13:\n                raise ValueError('PNG头部无效')\n\
          \            header = struct.unpack('>IIBBBBB', data)\n        elif kind\
          \ == b'IDAT':\n            packed.append(data)\n        elif kind in (b'PLTE',\
          \ b'tRNS', b'sRGB', b'gAMA', b'cHRM', b'iCCP'):\n            extras.append((kind,\
          \ data))\n        elif kind == b'IEND':\n            ended = True\n    \
          \        break\n    if header is None or not ended:\n        raise ValueError('PNG结构不完整')\n\
          \    width, height, depth, color, compression, filtering, interlace = header\n\
          \    channels = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}.get(color)\n    if depth\
          \ != 8 or not channels or compression or filtering or interlace:\n     \
          \   raise ValueError('当前裁切仅支持8位非隔行PNG；未擅自转换或忽略该页')\n    if width < 1 or\
          \ height < 1 or width * height > 16000000:\n        raise ValueError('页图超过1600万像素处理预算；请降低转图DPI')\n\
          \    expected = height * (1 + width * channels)\n    decoder = zlib.decompressobj()\n\
          \    raw = decoder.decompress(b''.join(packed), expected + 1)\n    if len(raw)\
          \ != expected or not decoder.eof or decoder.unused_data:\n        raise\
          \ ValueError('PNG像素长度不匹配或解压超过预算')\n    return (header, extras, raw)\n\n\
          def unfilter_row(filtered, previous, channels, method):\n    if method ==\
          \ 0:\n        return bytearray(filtered)\n    if method == 1:\n        row\
          \ = bytearray(len(filtered))\n        for channel in range(channels):\n\
          \            row[channel::channels] = bytes((value & 255 for value in itertools.accumulate(filtered[channel::channels])))\n\
          \        return row\n    if method == 2:\n        return bytearray((a +\
          \ b & 255 for a, b in zip(filtered, previous)))\n    if method not in (3,\
          \ 4):\n        raise ValueError('PNG过滤方式无效')\n    row = bytearray(filtered)\n\
          \    for i in range(len(row)):\n        left = row[i - channels] if i >=\
          \ channels else 0\n        up = previous[i]\n        upper_left = previous[i\
          \ - channels] if i >= channels else 0\n        if method == 3:\n       \
          \     predictor = (left + up) // 2\n        else:\n            p = left\
          \ + up - upper_left\n            a, b, c = (abs(p - left), abs(p - up),\
          \ abs(p - upper_left))\n            predictor = left if a <= b and a <=\
          \ c else up if b <= c else upper_left\n        row[i] = row[i] + predictor\
          \ & 255\n    return row\n\ndef crop_png(encoded, rect):\n    header, extras,\
          \ raw = read_png(encoded)\n    width, height, depth, color, _, _, _ = header\n\
          \    channels = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}[color]\n    if not isinstance(rect,\
          \ list) or len(rect) != 4 or any((type(v) not in (int, float) or not math.isfinite(v)\
          \ for v in rect)):\n        raise ValueError('裁切坐标无效')\n    a, b, c, d =\
          \ rect\n    if not (0 <= a < c <= 1000 and 0 <= b < d <= 1000):\n      \
          \  raise ValueError('裁切坐标越界')\n    x0, y0 = (int(width * a / 1000), int(height\
          \ * b / 1000))\n    x1, y1 = (min(width, math.ceil(width * c / 1000)), min(height,\
          \ math.ceil(height * d / 1000)))\n    stride = width * channels\n    previous\
          \ = bytearray(stride)\n    output = bytearray()\n    prior_crop = bytearray((x1\
          \ - x0) * channels)\n    for y in range(y1):\n        offset = y * (stride\
          \ + 1)\n        row = unfilter_row(raw[offset + 1:offset + stride + 1],\
          \ previous, channels, raw[offset])\n        previous = row\n        if y\
          \ < y0:\n            continue\n        cropped = row[x0 * channels:x1 *\
          \ channels]\n        output.append(2)\n        output.extend((a - b & 255\
          \ for a, b in zip(cropped, prior_crop)))\n        prior_crop = cropped\n\
          \    out_header = struct.pack('>IIBBBBB', x1 - x0, y1 - y0, depth, color,\
          \ 0, 0, 0)\n    blob = b'\\x89PNG\\r\\n\\x1a\\n' + png_chunk(b'IHDR', out_header)\n\
          \    blob += b''.join((png_chunk(kind, data) for kind, data in extras))\n\
          \    blob += png_chunk(b'IDAT', zlib.compress(bytes(output), 6)) + png_chunk(b'IEND',\
          \ b'')\n    actual = [1000 * x0 / width, 1000 * y0 / height, 1000 * x1 /\
          \ width, 1000 * y1 / height]\n    return (blob, {'original_pixels': [width,\
          \ height], 'crop_pixels': [x0, y0, x1, y1], 'actual_rect': actual, 'pixel_colors_preserved':\
          \ True, 'crop_method': 'lossless_png_crop'})\n\ndef crop_node(encoded, job_json):\n\
          \    job = json.loads(job_json)\n    try:\n        blob, audit = crop_png(encoded,\
          \ job['rect'])\n        text = 'data:image/png;base64,' + base64.b64encode(blob).decode('ascii')\n\
          \        if len(text) > 16 * 60000:\n            raise ValueError('局部图超过当前96万字符传输预算；未删减图像继续识别')\n\
          \        out = {'valid': 'YES', 'message': '', 'context_json': json.dumps(dict(job,\
          \ crop_audit=audit), ensure_ascii=False), 'filename': job['job_id'] + '.png'}\n\
          \        out.update({'part%d' % i: text[i * 60000:(i + 1) * 60000] for i\
          \ in range(16)})\n        return out\n    except (ValueError, TypeError,\
          \ KeyError, struct.error, zlib.error) as exc:\n        out = {'valid': 'NO',\
          \ 'message': str(exc), 'context_json': job_json, 'filename': job.get('job_id',\
          \ 'failed') + '.png'}\n        out.update({'part%d' % i: '' for i in range(16)})\n\
          \        return out\n\nfrom collections import Counter\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\ndef main(encoded,job_json):\n\
          \    return crop_node(encoded,job_json)\n"
