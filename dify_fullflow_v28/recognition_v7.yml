    - id: '3700000000029'
      type: custom
      data:
        type: code
        title: 按原页位置合并实例，校验回路归属
        desc: ''
        selected: false
        code_language: python3
        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\ndef j(v):\n    return json.dumps(v, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef canonical(s):\n    return re.sub('\\\\s+',\
          \ '', norm(s)).upper().replace('×', 'X')\n\ndef uncompress(value):\n   \
          \ obj = zlib.decompressobj()\n    raw = obj.decompress(base64.b64decode(value,\
          \ validate=True), 600001)\n    if len(raw) > 600000 or not obj.eof or obj.unused_data:\n\
          \        raise ValueError('整份说明超出预算或结构无效')\n    return json.loads(raw)\n\
          \nimport re\n\nimport unicodedata\n\ndef norm(s):\n    return re.sub('[‐‑‒–—−]',\
          \ '-', unicodedata.normalize('NFKC', str(s))).strip().replace('×', 'x')\n\
          \ndef decode_base(raw):\n    \"\"\"Decode explicit literal markings; never\
          \ infer catalogue properties.\"\"\"\n    s = norm(raw).upper()\n    p =\
          \ {}\n    kind = 'other'\n    meaning = ''\n    m = re.search('(?<![A-Z0-9])(MCCB|MCB|RCBO|RCCB|RCB|RCD)(?=[\\\
          \\d /-]|$)', s)\n    if m:\n        kind = 'device_model'\n        p['drawing_abbreviation']\
          \ = m[1]\n        meaning = {'MCCB': '塑壳断路器', 'MCB': '小型断路器', 'RCB': '剩余电流保护器件，订货类别待核对',\
          \ 'RCBO': '带过电流保护的剩余电流动作断路器', 'RCCB': '不带过电流保护的剩余电流动作断路器', 'RCD': '剩余电流保护器件统称'}[m[1]]\n\
          \        curve = re.search('(?:^|[/\\\\s-])([BCD])\\\\s*(\\\\d+(?:\\\\.\\\
          \\d+)?)\\\\s*A(?=$|[/\\\\s(])', s)\n        if curve:\n            p.update(trip_curve=curve[1],\
          \ rated_current_a=float(curve[2]))\n        trip = re.search('MA\\\\d+(?:\\\
          \\.\\\\d+)?A', s)\n        if trip:\n            p['trip_marking_raw'] =\
          \ trip[0]\n            p['rated_current_a'] = float(re.search('\\\\d+(?:\\\
          \\.\\\\d+)?', trip[0])[0])\n    elif re.search('(?<![A-Z])(?:WDZ[A-Z0-9]*-|NHBV-|ZNBV-|BVR?-|UTP/|CAT\\\
          \\d)', s):\n        kind = 'cable'\n        meaning = '电线、线缆或通信线标注'\n  \
          \      if 'WDZB-' in s:\n            p.update(halogen_free=True, low_smoke=True,\
          \ flame_retardant_category='B')\n        family = re.search('(?:WDZ[A-Z0-9]*-)(BYJ|YJY|YJV|RYJS|RYJSP|RYJ)(?:-|$)',\
          \ s)\n        if family:\n            p['family'] = family[1]\n        \
          \    if family[1] == 'BYJ':\n                p['family_meaning'] = '交联聚烯烃绝缘布电线'\n\
          \            elif family[1] == 'YJY':\n                p['family_meaning']\
          \ = '交联聚乙烯绝缘、聚烯烃护套电力电缆'\n        spec = re.search('\\\\d+\\\\s*[X*]\\\\\
          s*\\\\d+(?:\\\\.\\\\d+)?(?:\\\\s*\\\\+\\\\s*\\\\d+\\\\s*[X*]\\\\s*\\\\d+(?:\\\
          \\.\\\\d+)?)*', s)\n        if spec:\n            p['conductor_groups']\
          \ = [{'count': int(n), 'area_mm2': float(a)} for n, a in re.findall('(\\\
          \\d+)\\\\s*[X*]\\\\s*(\\\\d+(?:\\\\.\\\\d+)?)', spec[0])]\n        routes\
