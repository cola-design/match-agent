    - id: '3700000000007'
      type: custom
      data:
        type: code
        title: 核对页图，生成整页和六个局部识别任务
        desc: ''
        selected: false
        code_language: python3
        code: "from collections import Counter\n\nimport base64\n\nimport html\n\n\
          import json\n\nimport math\n\nimport re\n\nimport unicodedata\n\nimport\
          \ zlib\n\ndef j(v):\n    return json.dumps(v, ensure_ascii=False, separators=(',',\
          \ ':'), allow_nan=False)\n\ndef uncompress(value):\n    obj = zlib.decompressobj()\n\
          \    raw = obj.decompress(base64.b64decode(value, validate=True), 600001)\n\
          \    if len(raw) > 600000 or not obj.eof or obj.unused_data:\n        raise\
          \ ValueError('整份说明超出预算或结构无效')\n    return json.loads(raw)\n\ndef bind_pages(tool_json,\
          \ images, document_text, notes):\n    try:\n        records = [x for x in\
          \ tool_json or [] if isinstance(x, dict) and 'images' in x]\n        if\
          \ len(records) != 1 or records[0].get('success') is not True:\n        \
          \    raise ValueError('未收到PDF-to-Images成功记录，请查看现有转图节点')\n        stats =\
          \ records[0]\n        pages = stats['images']\n        if type(stats.get('total_pages'))\
          \ is not int or not 1 <= stats['total_pages'] <= 12:\n            raise\
          \ ValueError('本次试用支持1至12页，未截取部分页冒充整份识别')\n        if stats.get('total_images')\
          \ != stats['total_pages'] or len(pages) != stats['total_pages']:\n     \
          \       raise ValueError('PDF页数与转图数量不一致，停止识别')\n        names = [str(x.get('filename')\
          \ or x.get('name') or '') for x in images or []]\n        expected = [x['filename']\
          \ for x in pages]\n        if len(set(names)) != len(names) or len(set(expected))\
          \ != len(expected) or set(names) != set(expected):\n            raise ValueError('PDF页图文件缺失或重复，停止识别')\n\
          \        numbers = [x.get('page_number') for x in pages]\n        if any((type(n)\
          \ is not int for n in numbers)) or set(numbers) != set(range(1, len(pages)\
          \ + 1)):\n            raise ValueError('PDF页码缺失或重复')\n        if any((x.get('file_index')\
          \ != 1 for x in pages)):\n            raise ValueError('本次仅允许一份PDF，不混合不同文件的页图')\n\
          \        if isinstance(document_text, list):\n            if any((not isinstance(x,\
          \ str) for x in document_text)):\n                raise ValueError('文字辅助结构无效')\n\
          \            text = '\\n'.join(document_text)\n        elif isinstance(document_text,\
          \ str):\n            text = document_text\n        else:\n            text\
          \ = ''\n        if len(text) > 60000:\n            raise ValueError('PDF全文超过本次上下文预算，未删去后半部分继续识别')\n\
          \        if len(text) + len(str(notes or '')[:3000]) + 1000 > 60000:\n \
          \           raise ValueError('全文和补充说明超过单页上下文预算，尚未调用模型')\n        packet\
          \ = {'schema_version': 'pdf-ollama-page/5', 'images': pages, 'uploaded_names':\
          \ names, 'native_text': text, 'notes': str(notes or '')[:3000], 'page_count':\
          \ len(pages)}\n        encoded = base64.b64encode(zlib.compress(j(packet).encode('utf8'))).decode('ascii')\n\
          \        if len(encoded) > 60000:\n            raise ValueError('整份说明超过节点传输预算')\n\
          \        return {'valid': 'YES', 'manifest_compact': encoded, 'message':\
          \ ''}\n    except (ValueError, TypeError, KeyError, AttributeError) as exc:\n\
          \        return {'valid': 'NO', 'manifest_compact': '', 'message': str(exc)}\n\
          \nimport re\n\nimport unicodedata\n\nimport re\n\nimport base64\n\nimport\
          \ itertools\n\nimport json\n\nimport math\n\nimport re\n\nimport struct\n\
          \nimport zlib\n\nfrom collections import Counter\n\nimport html\n\nimport\
          \ json\n\nimport math\n\nimport re\n\ndef prepare_jobs(tool_json, images,\
          \ document_text, notes):\n    bound = bind_pages(tool_json, images, document_text,\
          \ notes)\n    if bound['valid'] != 'YES':\n        return dict(bound, jobs=[])\n\
          \    packet = uncompress(bound['manifest_compact'])\n    jobs = []\n   \
          \ rectangles = [('overview', [0, 0, 1000, 1000])]\n    rectangles += [('H%d'\
          \ % (i + 1), [0, a, 1000, b]) for i, (a, b) in enumerate([(0, 400), (300,\
          \ 700), (600, 1000)])]\n    rectangles += [('V%d' % (i + 1), [a, 0, b, 1000])\
          \ for i, (a, b) in enumerate([(0, 400), (300, 700), (600, 1000)])]\n   \
          \ for page in packet['images']:\n        serial = packet['uploaded_names'].index(page['filename'])\
          \ + 1\n        for name, rect in rectangles:\n            jobs.append(j({'job_id':\
          \ 'P%d-%s' % (page['page_number'], name), 'page': page['page_number'], 'file_serial':\
          \ serial, 'image_name': page['filename'], 'view_id': name, 'mode': 'overview'\
          \ if name == 'overview' else 'detail', 'rect': rect}))\n    return dict(bound,\
          \ jobs=jobs)\n\ndef main(tool_json,images,document_text,notes):\n    return\
          \ prepare_jobs(tool_json,images,document_text,notes)\n"
        variables:
        - variable: tool_json
          value_selector:
          - '3700000000006'
          - json
        - variable: images
          value_selector:
