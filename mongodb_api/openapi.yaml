openapi: 3.0.3
info:
  title: match-agent MongoDB API
  version: 1.2.0
servers:
  - url: http://match-agent-mongo-api:8000
security:
  - ApiKeyAuth: []
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Database connection ready}
  /v1/products/search:
    get:
      operationId: searchProducts
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, maxLength: 240}}
        - {name: model, in: query, required: false, schema: {type: string, maxLength: 180}}
        - {name: category, in: query, required: false, schema: {type: string, maxLength: 180}}
        - {name: limit, in: query, required: false, schema: {type: integer, default: 30, maximum: 50, minimum: 1}}
      responses:
        '200': {description: Active product candidates requiring specification validation}
  /v1/products/{material_code}:
    get:
      operationId: getProductByCode
      parameters:
        - {name: material_code, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Active product records}
  /v1/prices/{material_code}:
    get:
      operationId: getPriceByCode
      parameters:
        - {name: material_code, in: path, required: true, schema: {type: string}}
        - {name: as_of, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200': {description: Active price records valid on the quotation date}
        '409': {description: Excessive price versions for one material}
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
