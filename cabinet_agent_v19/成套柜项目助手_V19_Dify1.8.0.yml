kind: app
version: 0.4.0
app:
  name: 成套柜项目助手 V19（PDF视觉与工程确认）
  description: PDF识别→问题确认→BOM确认→报价/排产/DWG。由独立项目服务保存跨轮状态；DWG需配置真实转换器。
  mode: advanced-chat
  icon: 📐
  icon_background: '#E4FBCC'
  use_icon_as_answer_icon: false
dependencies: []
workflow:
  conversation_variables:
  - id: c0c75c5a-d3da-5d61-86da-9d2b2b3bd26d
    name: project_id
    value_type: string
    value: ''
    description: 当前对话项目ID
    selector:
    - conversation
    - project_id
  environment_variables:
  - id: 59afdb44-93a9-5664-9707-0b09afaa70cb
    name: PROJECT_SERVICE_BASE_URL
    value_type: string
    value: ''
    description: 项目服务地址，末尾不加斜杠。Dify容器必须可访问。
    selector:
    - env
    - PROJECT_SERVICE_BASE_URL
  - id: 6399a7db-ad1e-5f15-b0b8-2cb9c2ed110d
    name: PROJECT_SERVICE_API_KEY
    value_type: secret
    value: ''
    description: 与项目服务.env中的PROJECT_API_KEY一致，不是MongoDB密码。
    selector:
    - env
    - PROJECT_SERVICE_API_KEY
  features:
    file_upload:
      enabled: true
      allowed_file_types:
      - document
      allowed_file_extensions:
      - .pdf
      - .PDF
      - .xlsx
      - .XLSX
      allowed_file_upload_methods:
      - local_file
      number_limits: 8
      fileUploadConfig:
        file_size_limit: 32
        batch_count_limit: 8
        workflow_file_upload_limit: 8
        image_file_size_limit: 10
        audio_file_size_limit: 50
        video_file_size_limit: 100
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
    opening_statement: 请在聊天输入框上传本轮附件并发送操作：新建项目、提交问题确认、提交BOM确认、生成交付文件、查看项目、重新识别。新建上传图纸PDF与可选技术协议PDF；确认阶段上传已填写Excel。
    suggested_questions:
    - 新建项目
    - 查看项目
    - 提交问题确认
    - 提交BOM确认
    - 生成交付文件
    suggested_questions_after_answer:
      enabled: false
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    nodes:
    - id: '1900000000001'
      type: custom
      data:
        type: start
        title: 开始：每轮在聊天框上传对应文件
        variables:
        - variable: project_name
          label: 项目名称（新建时使用）
          type: text-input
          max_length: 120
          required: false
          options: []
        - variable: project_id
          label: 已有项目ID（留空自动使用当前对话项目）
          type: text-input
          max_length: 48
          required: false
          options: []
        selected: false
      position:
        x: 0
        y: 200
      positionAbsolute:
        x: 0
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1900000000002'
      type: custom
      data:
        type: code
        title: 识别操作并读取当前项目
        code_language: python3
        code: "def main(query: str, project_name: str, supplied_id: str, previous_id:\
          \ str) -> dict:\n    q = (query or '').strip()\n    aliases = {'开始选型':'新建项目','开始项目':'新建项目','提交确认BOM':'提交BOM确认','生成报价':'生成交付文件','查看进度':'查看项目'}\n\
          \    operations = ('新建项目','提交问题确认','提交BOM确认','生成交付文件','查看项目','重新识别')\n \
          \   operation = next((x for x in operations if q == x or q.startswith(x+'\
          \ ')), '')\n    if not operation:\n        operation = aliases.get(q, '查看项目')\n\
          \    project_id = (supplied_id or previous_id or '').strip()\n    return\
          \ {'operation': operation, 'project_id': project_id, 'project_name': project_name\
          \ or '电气成套项目'}\n"
        variables:
        - variable: query
          value_selector:
          - sys
          - query
        - variable: project_name
          value_selector:
          - '1900000000001'
          - project_name
        - variable: supplied_id
          value_selector:
          - '1900000000001'
          - project_id
        - variable: previous_id
          value_selector:
          - conversation
          - project_id
        outputs:
          operation:
            type: string
            children: null
          project_id:
            type: string
            children: null
          project_name:
            type: string
            children: null
        selected: false
      position:
        x: 300
        y: 200
      positionAbsolute:
        x: 300
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1900000000003'
      type: custom
      data:
        type: http-request
        title: 项目服务：上传本轮文件并执行
        method: post
        url: '{{#env.PROJECT_SERVICE_BASE_URL#}}/v1/agent/command'
        authorization:
          type: api-key
          config:
            type: custom
            api_key: '{{#env.PROJECT_SERVICE_API_KEY#}}'
            header: X-API-Key
        headers: Accept:application/json
        params: ''
        body:
          type: form-data
          data:
          - key: operation
            type: text
            value: '{{#1900000000002.operation#}}'
            file: []
          - key: project_id
            type: text
            value: '{{#1900000000002.project_id#}}'
            file: []
          - key: project_name
            type: text
            value: '{{#1900000000002.project_name#}}'
            file: []
          - key: actor
            type: text
            value: '{{#sys.user_id#}}'
            file: []
          - key: message_files
            type: file
            value: ''
            file:
            - sys
            - files
        timeout:
          connect: 5
          read: 90
          write: 60
        ssl_verify: true
        retry_config:
          max_retries: 0
          retry_enabled: false
          retry_interval: 1000
        selected: false
      position:
        x: 600
        y: 200
      positionAbsolute:
        x: 600
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1900000000004'
      type: custom
      data:
        type: code
        title: 读取进度与下载链接
        code_language: python3
        code: "import json\ndef main(body: str, status_code: int, previous_id: str)\
          \ -> dict:\n    try:\n        data = json.loads(body)\n    except Exception:\n\
          \        data = {}\n    project_id = data.get('project_id') or previous_id\
          \ or ''\n    if status_code != 200:\n        message = data.get('message')\
          \ or ('项目服务请求失败，HTTP '+str(status_code)+'。请管理员检查服务配置和上传限制。')\n    else:\n\
          \        message = data.get('message') or '项目服务未返回状态，请查看服务日志。'\n    return\
          \ {'project_id':project_id,'message':message}\n"
        variables:
        - variable: body
          value_selector:
          - '1900000000003'
          - body
        - variable: status_code
          value_selector:
          - '1900000000003'
          - status_code
        - variable: previous_id
          value_selector:
          - '1900000000002'
          - project_id
        outputs:
          project_id:
            type: string
            children: null
          message:
            type: string
            children: null
        selected: false
      position:
        x: 900
        y: 200
      positionAbsolute:
        x: 900
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1900000000005'
      type: custom
      data:
        type: assigner
        version: '2'
        title: 记住当前项目ID
        items:
        - variable_selector:
          - conversation
          - project_id
          input_type: variable
          operation: over-write
          value:
          - '1900000000004'
          - project_id
        selected: false
      position:
        x: 1200
        y: 200
      positionAbsolute:
        x: 1200
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    - id: '1900000000006'
      type: custom
      data:
        type: answer
        title: 显示结果与下一步
        answer: '{{#1900000000004.message#}}'
        variables: []
        selected: false
      position:
        x: 1500
        y: 200
      positionAbsolute:
        x: 1500
        y: 200
      width: 244
      height: 120
      sourcePosition: right
      targetPosition: left
      selected: false
    edges:
    - id: 1900000000001-1900000000002
      source: '1900000000001'
      target: '1900000000002'
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: code
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: 1900000000002-1900000000003
      source: '1900000000002'
      target: '1900000000003'
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: http-request
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: 1900000000003-1900000000004
      source: '1900000000003'
      target: '1900000000004'
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: http-request
        targetType: code
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: 1900000000004-1900000000005
      source: '1900000000004'
      target: '1900000000005'
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: code
        targetType: assigner
        isInIteration: false
        isInLoop: false
      zIndex: 0
    - id: 1900000000005-1900000000006
      source: '1900000000005'
      target: '1900000000006'
      sourceHandle: source
      targetHandle: target
      type: custom
      data:
        sourceType: assigner
        targetType: answer
        isInIteration: false
        isInLoop: false
      zIndex: 0
    viewport:
      x: 0
      y: 0
      zoom: 0.75
